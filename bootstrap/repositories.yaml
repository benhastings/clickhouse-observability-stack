# Cerberus publishes its Helm chart to an OCI registry (ghcr.io). Argo CD needs
# the registry declared as an OCI-enabled Helm repository before it can pull it.
apiVersion: v1
kind: Secret
metadata:
  name: repo-cerberus-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: cerberus
  url: ghcr.io/tsouza/cerberus/charts
  enableOCI: "true"

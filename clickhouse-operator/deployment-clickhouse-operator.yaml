# Source: clickhouse-operator/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse-operator
  namespace: clickhouse-operator
  labels:
    app.kubernetes.io/name: clickhouse-operator
    app.kubernetes.io/instance: clickhouse-operator
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: clickhouse-operator-0.1.0
    app.kubernetes.io/version: "0.27.4"
    environment: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse-operator
      app.kubernetes.io/instance: clickhouse-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-operator
        app.kubernetes.io/instance: clickhouse-operator
      annotations:
        checksum/config: 996af8df30a82797712c3a6381814d70c671e76f866e0ccbeed4f42643b4efde
    spec:
      serviceAccountName: clickhouse-operator
      automountServiceAccountToken: true
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: clickhouse-operator
          image: "altinity/clickhouse-operator:0.27.4"
          imagePullPolicy: IfNotPresent
          ports:
            - name: op-metrics
              containerPort: 9999
              protocol: TCP
          env:
            - name: OPERATOR_CONTAINER_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: 1m
                  resource: limits.cpu
            - name: OPERATOR_CONTAINER_CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  divisor: 1m
                  resource: requests.cpu
            - name: OPERATOR_CONTAINER_MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: 1Mi
                  resource: limits.memory
            - name: OPERATOR_CONTAINER_MEM_REQUEST
              valueFrom:
                resourceFieldRef:
                  divisor: 1Mi
                  resource: requests.memory
            - name: OPERATOR_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OPERATOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_POD_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OPERATOR_POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/clickhouse-operator
              name: config
            - mountPath: /etc/clickhouse-operator/chi/conf.d
              name: chi-confd
            - mountPath: /etc/clickhouse-operator/chi/config.d
              name: chi-configd
            - mountPath: /etc/clickhouse-operator/chi/templates.d
              name: chi-templatesd
            - mountPath: /etc/clickhouse-operator/chi/users.d
              name: chi-usersd
            - mountPath: /etc/clickhouse-operator/chk/conf.d
              name: chk-confd
            - mountPath: /etc/clickhouse-operator/chk/keeper_config.d
              name: chk-configd
            - mountPath: /etc/clickhouse-operator/chk/templates.d
              name: chk-templatesd
            - mountPath: /etc/clickhouse-operator/chk/users.d
              name: chk-usersd
            - mountPath: /etc/clickhouse-operator-ipc
              name: ipc
      volumes:
        - name: chi-confd
          emptyDir: {}
        - name: chi-configd
          configMap:
            name: 'clickhouse-operator-chi-configd'
        - name: chi-templatesd
          emptyDir: {}
        - name: chi-usersd
          configMap:
            name: 'clickhouse-operator-chi-usersd'
        - name: chk-confd
          emptyDir: {}
        - name: chk-configd
          configMap:
            name: 'clickhouse-operator-chk-configd'
        - name: chk-templatesd
          emptyDir: {}
        - name: chk-usersd
          emptyDir: {}
        - name: config
          configMap:
            name: 'clickhouse-operator-files'
        - name: ipc
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

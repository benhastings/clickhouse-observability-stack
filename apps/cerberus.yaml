apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cerberus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Cerberus: Prometheus / Loki / Tempo query APIs over ClickHouse.
  # It also owns the OTel table definitions (see values/cerberus.yaml).
  sources:
    - repoURL: ghcr.io/tsouza/cerberus/charts
      chart: cerberus
      targetRevision: 0.18.0
      helm:
        releaseName: cerberus
        valueFiles:
          - $values/values/cerberus.yaml
    - repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-load
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Optional: synthetic traces so there is something to look at.
  # Delete this file (or the Application) to stop the load.
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: manifests/demo-load
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Altinity ClickHouse operator: installs the ClickHouseInstallation CRD and
  # reconciles it into StatefulSets, Services and config.
  sources:
    - repoURL: https://helm.altinity.com
      chart: altinity-clickhouse-operator
      targetRevision: 0.27.4
      helm:
        releaseName: clickhouse-operator
        valueFiles:
          - $values/values/clickhouse-operator.yaml
    - repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: clickhouse-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Grafana with Prometheus, Loki and Tempo datasources that all point at Cerberus,
  # plus a provisioned span-metrics dashboard.
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.2.6
      helm:
        releaseName: grafana
        valueFiles:
          - $values/values/grafana.yaml
    - repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
      targetRevision: main
      path: manifests/grafana-dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

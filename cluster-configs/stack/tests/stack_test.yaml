suite: stack
templates:
  - charts/*/templates/common.yaml
release:
  name: stack
  namespace: observability
tests:
  - it: renders ClickHouse from the clickhouse block
    template: charts/clickhouse/templates/common.yaml
    set:
      clickhouse.clickhouse.storage: 77Gi
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: metadata.name
          value: otel
      - equal:
          path: spec.templates.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 77Gi

  - it: keeps the Service names the other apps dial, although every node shares one release
    template: charts/cerberus/templates/common.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: cerberus

  - it: names the collector otel-collector
    template: charts/otel-collector/templates/common.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: otel-collector

  - it: names Grafana grafana and passes global labels through
    template: charts/grafana/templates/common.yaml
    set:
      global.labels.environment: test
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: grafana
      - equal:
          path: metadata.labels.environment
          value: test

  - it: renders demo-load by default
    template: charts/demo-load/templates/common.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: demo-load

  - it: omits demo-load when demo-load.enabled is false, as prod sets it
    set:
      demo-load.enabled: false
    documentSelector:
      path: metadata.name
      value: demo-load
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0

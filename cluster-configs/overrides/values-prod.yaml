# yaml-language-server: $schema=../app-of-apps/values.schema.json
environment: prod
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

global:
  labels:
    environment: prod
  # Istio, the chart default, set here so the example says so. Grafana and OTLP over HTTP are reachable on
  # these placeholder hosts: each app gets its own Gateway on 443 and a VirtualService. Istio reads the TLS
  # Secret from the ingress gateway's namespace (usually istio-system); the site creates it, for example
  # with cert-manager. To bind to a Gateway the site already runs, set exposure.gateway.name and .namespace.
  mesh: istio
  exposure:
    enabled: true
    hosts:
      grafana: grafana.example
      otlp: otlp.example
    tls:
      credentialName: observability-tls

applications:
  clickhouse-operator:
    values:
      deployment:
        containers:
          clickhouse-operator:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi

  clickhouse:
    values:
      clickhouse:
        # About 400 spans/s, 300 log records/s and 400 metric samples/s at the retention below, with 50% headroom
        # (README: Disk sizing). Measure your own bytes per row before trusting the formula with real attributes.
        storage: 200Gi
        lowMemory: false
        # Three weeks of traces to search, two of logs, and a month of metrics so a dashboard can compare
        # with the same day four weeks back. Cerberus's metadata lookback below follows the longest of these.
        schema:
          ttlDays:
            traces: 21
            logs: 14
            metrics: 30
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            memory: 8Gi
        # A quarter of the server for one notebook query, five minutes per query, two at a time.
        analyst:
          maxMemoryUsage: 2147483648
          maxExecutionTime: 300
          maxRowsToRead: 10000000000
          maxConcurrentQueries: 2
          quota:
            readRows: 100000000000
            executionTime: 7200

  cerberus:
    values:
      # Grafana's metric and label pickers ask Cerberus without a time range, and Cerberus then looks back
      # 14 days unless told the retention. Keep this equal to clickhouse.schema.ttlDays.metrics above.
      configMaps:
        env:
          data:
            CERBERUS_PROM_METADATA_LOOKBACK: 30d
      deployment:
        replicas: 2
        containers:
          cerberus:
            env:
              GOMEMLIMIT: 1717986918B
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi

  otel-collector:
    values:
      # Every OTLP sender, inside the cluster or out, sends the token from the pre-created Secret
      # otel-collector-auth (key token) as "Authorization: Bearer <token>". Exposing the collector
      # outside the cluster requires this.
      collector:
        auth:
          enabled: true
      deployment:
        containers:
          otel-collector:
            env:
              GOMEMLIMIT: 1638MiB
              OTLP_BEARER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: otel-collector-auth
                    key: token
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi

  grafana:
    values:
      # Grafana reads its secrets from Vault: the Vault Agent Injector writes <vault.path>/grafana-admin and
      # <vault.path>/grafana-oauth (key client-secret) into the pod, and the pod authenticates with Vault's
      # Kubernetes auth role grafana, bound to its ServiceAccount. Neither is a Kubernetes Secret here.
      vault:
        enabled: true
        role: grafana
      # Sign-in through the platform's OpenID Connect provider, a Keycloak realm at a placeholder host here.
      # root_url is https://grafana.example/ from global.exposure above, so the provider's client needs the
      # redirect URI https://grafana.example/login/generic_oauth. Realm roles grafana-admin and grafana-editor
      # map to Admin and Editor (the node's roleAttributePath); anyone else is a Viewer. A signed-out user goes
      # straight to the provider; the login form stays for the admin user as a way in when the provider is down.
      # A provider on a private CA also needs tlsCaConfigMap (README: Grafana sign-in with Keycloak).
      auth:
        loginMaximumLifetimeDuration: 7d
        genericOauth:
          enabled: true
          clientId: grafana
          authUrl: https://sso.example/realms/platform/protocol/openid-connect/auth
          tokenUrl: https://sso.example/realms/platform/protocol/openid-connect/token
          apiUrl: https://sso.example/realms/platform/protocol/openid-connect/userinfo
          groupsAttributePath: groups
          autoLogin: true
      deployment:
        containers:
          grafana:
            secretEnv:
              GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
                secret: grafana-oauth
                key: client-secret
            env:
              GOMEMLIMIT: 921MiB
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

  demo-load:
    enabled: false

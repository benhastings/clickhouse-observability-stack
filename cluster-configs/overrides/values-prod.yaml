# yaml-language-server: $schema=../app-of-apps/values.schema.json
environment: prod
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

global:
  labels:
    environment: prod
  # Istio, the chart default, set here so the example says so. Grafana and OTLP over HTTP are reachable on
  # these placeholder hosts: each app gets its own Gateway on 443 and a VirtualService. Istio reads the TLS
  # Secret from the ingress gateway's namespace (usually istio-system); the site creates it, for example
  # with cert-manager. To bind to a Gateway the site already runs, set exposure.gateway.name and .namespace.
  mesh: istio
  exposure:
    enabled: true
    hosts:
      grafana: grafana.example
      otlp: otlp.example
    tls:
      credentialName: observability-tls

applications:
  clickhouse-operator:
    values:
      deployment:
        containers:
          clickhouse-operator:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi

  clickhouse:
    values:
      clickhouse:
        storage: 200Gi
        lowMemory: false
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            memory: 8Gi

  cerberus:
    values:
      deployment:
        replicas: 2
        containers:
          cerberus:
            env:
              GOMEMLIMIT: 1717986918B
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi

  otel-collector:
    values:
      # Every OTLP sender, inside the cluster or out, sends the token from the pre-created Secret
      # otel-collector-auth (key token) as "Authorization: Bearer <token>". Exposing the collector
      # outside the cluster requires this.
      collector:
        auth:
          enabled: true
      deployment:
        containers:
          otel-collector:
            env:
              GOMEMLIMIT: 1638MiB
              OTLP_BEARER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: otel-collector-auth
                    key: token
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi

  grafana:
    values:
      deployment:
        containers:
          grafana:
            env:
              GOMEMLIMIT: 921MiB
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

  demo-load:
    enabled: false

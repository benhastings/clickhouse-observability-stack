# yaml-language-server: $schema=../app-of-apps/values.schema.json
# Production is the default: helm-templates/common/values.yaml and each cluster-nodes/<app>/values.yaml are
# production-shaped, so this environment overrides nothing. It names itself and where Argo CD deploys it from. A
# site's own production copies this file and adds only what differs: its hosts under global.exposure.hosts, its
# TLS Secret, its single sign-on provider (grafana.auth.genericOauth), its sizes.
environment: prod
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

environment: prod
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

global:
  labels:
    environment: prod

applications:
  clickhouse-operator:
    values:
      deployment:
        containers:
          clickhouse-operator:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi

  clickhouse:
    values:
      clickhouse:
        storage: 200Gi
        lowMemory: false
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            memory: 8Gi

  cerberus:
    values:
      deployment:
        replicas: 2
        containers:
          cerberus:
            env:
              GOMEMLIMIT: 1717986918B
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi

  otel-collector:
    values:
      # Every OTLP sender, inside the cluster or out, sends the token from the pre-created Secret
      # otel-collector-auth (key token) as "Authorization: Bearer <token>". Exposing the collector
      # outside the cluster requires this.
      collector:
        auth:
          enabled: true
      deployment:
        containers:
          otel-collector:
            env:
              GOMEMLIMIT: 1638MiB
              OTLP_BEARER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: otel-collector-auth
                    key: token
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi

  grafana:
    values:
      deployment:
        containers:
          grafana:
            env:
              GOMEMLIMIT: 921MiB
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

  demo-load:
    enabled: false

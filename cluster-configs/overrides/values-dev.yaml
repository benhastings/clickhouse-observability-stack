# yaml-language-server: $schema=../app-of-apps/values.schema.json
environment: dev
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

global:
  # dev exposes nothing outside the cluster until a site gives it hostnames under exposure.
  exposure:
    enabled: false

# Production's sizes, with a week of retention, the laptop's analyst limits, Kubernetes Secrets and no single
# sign-on.
applications:
  clickhouse-operator:
    values:
      secrets:
        credentials:
          create: false

  clickhouse:
    values:
      clickhouse:
        schema:
          ttlDays:
            logs: 7
            metrics: 7
            traces: 7
        analyst:
          maxMemoryUsage: 268435456
          maxExecutionTime: 60
          maxRowsToRead: 200000000
          quota:
            readRows: 2000000000
            executionTime: 1800

  cerberus:
    values:
      configMaps:
        env:
          data:
            CERBERUS_PROM_METADATA_LOOKBACK: 7d

  otel-collector:
    values:
      collector:
        auth:
          enabled: false

  grafana:
    values:
      vault:
        enabled: false
      auth:
        genericOauth:
          enabled: false

# yaml-language-server: $schema=../app-of-apps/values.schema.json
environment: dev
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

global:
  # Production's sizes keep 15 days of traces and 45 of metrics even here; ClickHouse's TTLs and Cerberus's lookback
  # follow it.
  retention:
    traces: 15
    logs: 7
    metrics: 45
  # dev exposes nothing outside the cluster until a site gives it hostnames under exposure.
  exposure:
    enabled: false

# Production's sizes, with a week of retention, the laptop's analyst limits, Kubernetes Secrets and no single
# sign-on.
applications:
  clickhouse-operator:
    values:
      secrets:
        credentials:
          create: false

  clickhouse:
    values:
      clickhouse:
        analyst:
          maxMemoryUsage: 268435456
          maxExecutionTime: 60
          maxRowsToRead: 200000000
          quota:
            readRows: 2000000000
            executionTime: 1800


  otel-collector:
    values:
      collector:
        auth:
          enabled: false

  grafana:
    values:
      vault:
        enabled: false
      auth:
        genericOauth:
          enabled: false

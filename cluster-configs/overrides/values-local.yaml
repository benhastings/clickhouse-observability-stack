environment: local
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

global:
  labels:
    environment: local

applications:
  clickhouse:
    values:
      secrets:
        credentials:
          create: true
          stringData:
            password: otel-local-dev
  grafana:
    values:
      configMaps:
        config:
          data:
            # Dashboards can be saved from the UI, then exported to
            # cluster-nodes/grafana/dashboards/. UI edits live in Grafana's
            # emptyDir and are lost when the pod restarts. Lists replace whole,
            # so the provider is repeated in full.
            dashboards.yaml:
              providers:
                - name: dashboards
                  orgId: 1
                  type: file
                  folder: Cerberus
                  disableDeletion: true
                  allowUiUpdates: true
                  options:
                    path: /var/lib/grafana/dashboards
      # Keeps the Drilldown plugins across restarts, so they download once.
      pluginsClaim: true
      objects:
        plugins:
          apiVersion: v1
          kind: PersistentVolumeClaim
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      deployment:
        # The plugins claim is ReadWriteOnce: stop the old pod before starting the new.
        strategy:
          type: Recreate
        containers:
          grafana:
            # Startup is slow on a small machine; liveness only counts once it's up.
            startupProbe:
              httpGet:
                path: /api/health
                port: grafana
              periodSeconds: 10
              timeoutSeconds: 30
              failureThreshold: 60
        volumes:
          # Grafana's database is thrown away on restart and is small (about 2 MB),
          # so keep it in memory: on a laptop disk its 1,400-odd startup migrations
          # take minutes.
          storage:
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi
      secrets:
        admin:
          create: true
          stringData:
            admin-user: admin
            admin-password: admin

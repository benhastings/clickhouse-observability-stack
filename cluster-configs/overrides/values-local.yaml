# yaml-language-server: $schema=../app-of-apps/values.schema.json
environment: local
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

global:
  # kind runs no service mesh, so no Istio resources are rendered.
  mesh: kubernetes
  # A week of each signal, for the 2 Gi volume below; ClickHouse's TTLs and Cerberus's lookback follow it.
  retention:
    traces: 7
    logs: 7
    metrics: 7
  # Nothing is exposed outside kind: make cluster/port-forward reaches Grafana, Cerberus and OTLP.
  exposure:
    enabled: false

# No credentials here: scripts/kind-up.sh creates clickhouse-admin, clickhouse-writer, clickhouse-reader, clickhouse-analyst, clickhouse-garmr, grafana-admin and
# clickhouse-operator-credentials in the cluster with random passwords before Argo CD syncs.
applications:
  # The laptop profile: every size below fits the stack in about 2.4 GB (README: Sizing). The defaults are
  # production's.
  clickhouse-operator:
    values:
      deployment:
        containers:
          clickhouse-operator:
            resources:
              requests:
                cpu: 25m
                memory: 48Mi
              limits:
                memory: 192Mi

  clickhouse:
    values:
      clickhouse:
        storage: 2Gi
        lowMemory: true
        # The e2e reads trace_summary soon after the demo load starts; traces finish in seconds.
        traceSummary:
          lagMinutes: 2
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1664Mi
        analyst:
          maxMemoryUsage: 268435456
          maxExecutionTime: 60
          maxRowsToRead: 200000000
          quota:
            readRows: 2000000000
            executionTime: 1800

  cerberus:
    values:
      deployment:
        replicas: 1
        containers:
          cerberus:
            env:
              GOMEMLIMIT: 322122547B
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 384Mi

  otel-collector:
    values:
      # No bearer token on kind's OTLP, which nothing outside the cluster reaches.
      collector:
        auth:
          enabled: false
        agent:
          kubelet:
            # kind's kubelet serving certificate is self-signed.
            insecureSkipVerify: true
      deployment:
        containers:
          otel-collector:
            env:
              GOMEMLIMIT: 204MiB
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

  grafana:
    values:
      # The admin password from the grafana-admin Secret scripts/local-secrets.bash creates, not Vault, and the
      # login form instead of single sign-on.
      vault:
        enabled: false
      auth:
        genericOauth:
          enabled: false
      configMaps:
        config:
          data:
            # Dashboards can be saved from the UI, then exported to
            # cluster-nodes/grafana/dashboards/. UI edits live in Grafana's
            # emptyDir and are lost when the pod restarts. Lists replace whole,
            # so the provider is repeated in full.
            dashboards.yaml:
              providers:
                - name: dashboards
                  orgId: 1
                  type: file
                  folder: Cerberus
                  disableDeletion: true
                  allowUiUpdates: true
                  options:
                    path: /var/lib/grafana/dashboards
      # The starter rules, sent to the stack's Alertmanager. The error ratio waits 1m rather than 10m so
      # scripts/e2e.bash sees it fire. kind's local-path volumes report no volume metrics, so the disk rule
      # would only ever be No Data.
      alerts:
        enabled: true
        errorRatio:
          for: 1m
        clickhouseDisk:
          enabled: false
      # Keeps the Drilldown plugins across restarts, so they download once.
      pluginsClaim: true
      objects:
        plugins:
          apiVersion: v1
          kind: PersistentVolumeClaim
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      deployment:
        # The plugins claim is ReadWriteOnce: stop the old pod before starting the new.
        strategy:
          type: Recreate
        containers:
          grafana:
            env:
              GOMEMLIMIT: 920MiB
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
        volumes:
          # Grafana's database is thrown away on restart and is small (about 2 MB),
          # so keep it in memory: on a laptop disk its 1,400-odd startup migrations
          # take minutes.
          storage:
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi

  demo-load:
    enabled: true

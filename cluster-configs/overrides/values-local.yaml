# yaml-language-server: $schema=../app-of-apps/values.schema.json
environment: local
repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
targetRevision: main

global:
  # kind runs no service mesh, so no Istio resources are rendered.
  mesh: kubernetes
  labels:
    environment: local

# No credentials here: scripts/kind-up.sh creates clickhouse-admin, clickhouse-writer, clickhouse-reader, grafana-admin and
# clickhouse-operator-credentials in the cluster with random passwords before Argo CD syncs.
applications:
  otel-collector:
    values:
      collector:
        agent:
          kubelet:
            # kind's kubelet serving certificate is self-signed.
            insecureSkipVerify: true
  alertmanager:
    values:
      deployment:
        containers:
          alertmanager:
            # Alertmanager's main branch, pinned by digest: Slack threads (slack.post_updates_to_thread,
            # prometheus/alertmanager#5540) are merged but not released after v0.34.1. Go back to a release
            # tag once one has them. Slack itself stays off until make dev/slack, or slack.enabled here.
            image:
              tag: "main@sha256:6e381f097eedbf0d6ec8cf9373d85bea0ee3b03c4a001dfc080c734f0eab87e8"
  grafana:
    values:
      configMaps:
        config:
          data:
            # Dashboards can be saved from the UI, then exported to
            # cluster-nodes/grafana/dashboards/. UI edits live in Grafana's
            # emptyDir and are lost when the pod restarts. Lists replace whole,
            # so the provider is repeated in full.
            dashboards.yaml:
              providers:
                - name: dashboards
                  orgId: 1
                  type: file
                  folder: Cerberus
                  disableDeletion: true
                  allowUiUpdates: true
                  options:
                    path: /var/lib/grafana/dashboards
      # The starter rules, sent to the stack's Alertmanager. The error ratio waits 1m rather than 10m so
      # scripts/e2e.bash sees it fire. kind's local-path volumes report no volume metrics, so the disk rule
      # would only ever be No Data.
      alerts:
        enabled: true
        errorRatio:
          for: 1m
        clickhouseDisk:
          enabled: false
      # Keeps the Drilldown plugins across restarts, so they download once.
      pluginsClaim: true
      objects:
        plugins:
          apiVersion: v1
          kind: PersistentVolumeClaim
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      deployment:
        # The plugins claim is ReadWriteOnce: stop the old pod before starting the new.
        strategy:
          type: Recreate
        containers:
          grafana:
            # Startup is slow on a small machine; liveness only counts once it's up.
            startupProbe:
              httpGet:
                path: /api/health
                port: grafana
              periodSeconds: 10
              timeoutSeconds: 30
              failureThreshold: 60
        volumes:
          # Grafana's database is thrown away on restart and is small (about 2 MB),
          # so keep it in memory: on a laptop disk its 1,400-odd startup migrations
          # take minutes.
          storage:
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi

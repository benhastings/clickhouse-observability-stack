environment: ""
repoURL: ""
targetRevision: main
# The Argo CD project of every child Application and of the bootstrap app-of-apps-<env>.yaml,
# which must name the same project. Empty means observability-<environment>.
project: ""
# Render that AppProject. Set false to use a project a platform team already manages.
projectCreate: true
destinationServer: https://kubernetes.default.svc
namespace: observability

global: {}

# The charts under cluster-nodes/ (check/structure keeps this list in step with the directory). An
# application without its own path, chart or repoURL must be one of these, so a typo in an
# environment file fails the render instead of creating an Application for a chart that doesn't exist.
nodes:
  - cerberus
  - clickhouse
  - clickhouse-operator
  - demo-load
  - grafana
  - otel-collector

# The supported set. An environment file may set enabled: false on one, change one under values:, or
# add its own application next to them; an added one needs a syncWave and, unless it is one of the
# nodes above (say, a second collector released under another name), a path, chart or repoURL.
#
# An application may set repoURL, targetRevision, and path (or chart, for a packaged Helm
# chart) to deploy its node from another source. Omitted, they default to repoURL,
# targetRevision, and cluster-nodes/<name> above.
applications:
  clickhouse-operator:
    syncWave: 0
    namespace: clickhouse-operator
  clickhouse:
    syncWave: 1
    # The operator writes status back onto the ClickHouseInstallation; without this the
    # Application can sit OutOfSync. Only status is ignored, so spec drift still self-heals.
    ignoreDifferences:
      - group: clickhouse.altinity.com
        kind: ClickHouseInstallation
        jsonPointers:
          - /status
  cerberus:
    syncWave: 2
  otel-collector:
    syncWave: 3
  grafana:
    syncWave: 3
  demo-load:
    syncWave: 4

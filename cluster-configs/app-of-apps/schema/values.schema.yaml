# The app-of-apps chart's values, which is the shape of every cluster-configs/overrides/values-<env>.yaml.
# make generate writes it to cluster-configs/app-of-apps/values.schema.json, which helm validates on every
# render. Each application's values are checked again by its node's own schema when the node renders. The
# chart itself fails on a missing syncWave or repoURL, with a message naming the key.
$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
properties:
  environment: {type: string, pattern: "^[a-z0-9-]*$"}
  repoURL: {type: string, minLength: 1}
  targetRevision: {type: string, minLength: 1}
  project: {type: string}
  projectCreate: {type: boolean}
  destinationServer: {type: string}
  namespace: {type: string}
  global: {type: object}
  nodes: {type: array, items: {type: string}}
  applications:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        syncWave: {type: integer}
        namespace: {type: string}
        enabled: {type: boolean}
        repoURL: {type: string}
        targetRevision: {type: string}
        path: {type: string}
        chart: {type: string}
        values: {type: object}
        ignoreDifferences: {type: array, items: {type: object}}

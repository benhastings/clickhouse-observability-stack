{{- if .Values.projectCreate }}
{{- $env := required "environment is required" .Values.environment -}}
{{- $namespaces := list "argocd" }}
{{- range $name, $app := .Values.applications }}
{{- if include "app-of-apps.enabled" (list $ $name $app) }}
{{- $namespaces = append $namespaces ($app.namespace | default $.Values.namespace) }}
{{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ include "app-of-apps.project" . }}
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: {{ $env }}
  annotations:
    # Before the wave 0 Applications that reference it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The clickhouse-observability-stack applications for {{ $env }}.
  sourceRepos:
    - {{ required "repoURL is required" .Values.repoURL }}
  destinations:
    {{- range $namespaces | uniq | sortAlpha }}
    - server: {{ $.Values.destinationServer }}
      namespace: {{ . }}
    {{- end }}
  {{- if not (include "app-of-apps.clusterScoped" .) }}
  # The restricted-namespace profile (clusterScoped: false): no cluster-scoped kind at all, not even a Namespace.
  clusterResourceWhitelist: []
  {{- else }}
  # The cluster-scoped kinds the nodes render: namespaces from CreateNamespace, the operator's CRDs from
  # its crds/ directory, and the operator's and the collector's ClusterRole and ClusterRoleBinding. With a
  # shared operator (global.clickhouseOperator.shared) nothing may install a CRD.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    {{- if not (dig "clickhouseOperator" "shared" false (default dict .Values.global)) }}
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    {{- end }}
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  {{- end }}
{{- end }}

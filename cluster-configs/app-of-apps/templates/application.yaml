{{- $env := required "environment is required" .Values.environment -}}
{{- $repoURL := required "repoURL is required" .Values.repoURL -}}
{{- range $name, $app := .Values.applications }}
{{- if and $app (ne $app.enabled false) }}
{{- $_ := required (printf "applications.%s.syncWave is required" $name) $app.syncWave }}
{{- if not (or $app.path $app.chart $app.repoURL (has $name ($.Values.nodes | default list))) }}
{{- fail (printf "applications.%s is not a chart under cluster-nodes/ (nodes lists them); set its path, chart or repoURL, or check the name" $name) }}
{{- end }}
{{- $values := mustMergeOverwrite (dict "global" (deepCopy $.Values.global)) (deepCopy (default dict $app.values)) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}-{{ $env }}
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: {{ $env }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ required (printf "applications.%s.syncWave is required" $name) $app.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ include "app-of-apps.project" $ }}
  source:
    repoURL: {{ $app.repoURL | default $repoURL }}
    targetRevision: {{ $app.targetRevision | default $.Values.targetRevision }}
    {{- if $app.chart }}
    chart: {{ $app.chart }}
    {{- else }}
    path: {{ $app.path | default (printf "cluster-nodes/%s" $name) }}
    {{- end }}
    helm:
      releaseName: {{ $name }}
      valuesObject:
        {{- toYaml $values | nindent 8 }}
  destination:
    server: {{ $.Values.destinationServer }}
    namespace: {{ $app.namespace | default $.Values.namespace }}
  {{- with $app.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
{{- end }}

# Source: alertmanager/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: alertmanager-0.1.0
    app.kubernetes.io/version: "0.34.1"
    environment: dev
data:
  alertmanager.yml: |-
    receivers:
    - name: default
    - name: history
      webhook_configs:
      - max_alerts: 1
        send_resolved: true
        url: 'http://otel-collector:8088/alertmanager'
    route:
      group_by:
      - alertname
      - service_name
      group_interval: 5m
      group_wait: 30s
      receiver: default
      repeat_interval: 4h
      routes:
      - continue: true
        group_by:
        - '...'
        group_interval: 1m
        group_wait: 0s
        receiver: history
        repeat_interval: 168h
      - receiver: default

# Source: grafana/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: grafana-0.1.0
    app.kubernetes.io/version: "13.2.2"
    environment: dev
data:
  alert-hygiene.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**Alert hygiene**: every notification Alertmanager sends is also a log of service `alertmanager` in ClickHouse (the `history` receiver, through the collector). These panels count them with LogQL through Cerberus, to find noisy, flapping and slow-to-resolve rules before tuning thresholds."
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Firing notifications per rule",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "datasource": {
            "type": "loki",
            "uid": "cerberus-loki"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "cerberus-loki"
              },
              "expr": "sum by (alertname) (count_over_time({service_name=\"alertmanager\"} | status=\"firing\" [$__interval]))",
              "refId": "A",
              "queryType": "range",
              "legendFormat": "{{alertname}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "Notifications per rule",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 0,
            "y": 11
          },
          "datasource": {
            "type": "loki",
            "uid": "cerberus-loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "reduce",
              "options": {
                "reducers": [
                  "lastNotNull"
                ],
                "mode": "seriesToRows"
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "cerberus-loki"
              },
              "expr": "sum by (alertname) (count_over_time({service_name=\"alertmanager\"} | status=\"firing\" [$__range]))",
              "refId": "A",
              "queryType": "instant",
              "legendFormat": "{{alertname}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Median time to resolve",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 8,
            "y": 11
          },
          "datasource": {
            "type": "loki",
            "uid": "cerberus-loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Last *",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "reduce",
              "options": {
                "reducers": [
                  "lastNotNull"
                ],
                "mode": "seriesToRows"
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "cerberus-loki"
              },
              "expr": "quantile_over_time(0.5, {service_name=\"alertmanager\"} | status=\"resolved\" | unwrap duration_seconds [$__range]) by (alertname)",
              "refId": "A",
              "queryType": "instant",
              "legendFormat": "{{alertname}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Flapping: rules resolved more than 3 times",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 11
          },
          "datasource": {
            "type": "loki",
            "uid": "cerberus-loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "reduce",
              "options": {
                "reducers": [
                  "lastNotNull"
                ],
                "mode": "seriesToRows"
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "cerberus-loki"
              },
              "expr": "sum by (alertname) (count_over_time({service_name=\"alertmanager\"} | status=\"resolved\" [$__range])) > 3",
              "refId": "A",
              "queryType": "instant",
              "legendFormat": "{{alertname}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "logs",
          "title": "Notifications",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "loki",
            "uid": "cerberus-loki"
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": false,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "cerberus-loki"
              },
              "expr": "{service_name=\"alertmanager\"}",
              "refId": "A",
              "queryType": "range",
              "legendFormat": ""
            }
          ]
        }
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": [
        "alerting",
        "cerberus",
        "clickhouse"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Alert hygiene",
      "uid": "alert-hygiene"
    }
  span-metrics.json: |
    {
      "panels": [
        {
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "content": "**Span metrics (RED)**: rate, errors and duration derived from traces by the OTel Collector's `spanmetrics` connector, stored in ClickHouse, and queried here with PromQL through Cerberus. Dots on the charts are exemplars: click one to open that trace in Tempo (Cerberus).",
            "mode": "markdown"
          },
          "title": "",
          "type": "text"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "cerberus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 8,
                "lineWidth": 2
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 3
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cerberus-prometheus"
              },
              "exemplar": true,
              "expr": "sum by (service_name) (rate(traces_span_metrics_calls{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "Requests per second",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "cerberus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 8,
                "lineWidth": 2
              },
              "max": 1,
              "min": 0,
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 3
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cerberus-prometheus"
              },
              "exemplar": true,
              "expr": "(sum by (service_name) (rate(traces_span_metrics_calls{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\", status_code=\"STATUS_CODE_ERROR\"}[$__rate_interval])) or sum by (service_name) (rate(traces_span_metrics_calls{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])) * 0) / sum by (service_name) (rate(traces_span_metrics_calls{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "Error rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "cerberus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 8,
                "lineWidth": 2
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 3
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cerberus-prometheus"
              },
              "exemplar": true,
              "expr": "histogram_quantile(0.5, sum by (le, service_name) (rate(traces_span_metrics_duration_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))",
              "legendFormat": "{{service_name}} p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cerberus-prometheus"
              },
              "exemplar": true,
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(traces_span_metrics_duration_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))",
              "legendFormat": "{{service_name}} p95",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cerberus-prometheus"
              },
              "exemplar": true,
              "expr": "histogram_quantile(0.99, sum by (le, service_name) (rate(traces_span_metrics_duration_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))",
              "legendFormat": "{{service_name}} p99",
              "refId": "C"
            }
          ],
          "title": "Latency p50 / p95 / p99",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "cerberus-prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Req/s"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "reqps"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Error rate"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 0.01
                        },
                        {
                          "color": "red",
                          "value": 0.05
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p95 (ms)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "ms"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 11
          },
          "id": 5,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Req/s"
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cerberus-prometheus"
              },
              "expr": "sum by (service_name, span_name) (rate(traces_span_metrics_calls{service_name=~\"$service\"}[5m]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cerberus-prometheus"
              },
              "expr": "(sum by (service_name, span_name) (rate(traces_span_metrics_calls{service_name=~\"$service\", status_code=\"STATUS_CODE_ERROR\"}[5m])) or sum by (service_name, span_name) (rate(traces_span_metrics_calls{service_name=~\"$service\"}[5m])) * 0) / sum by (service_name, span_name) (rate(traces_span_metrics_calls{service_name=~\"$service\"}[5m]))",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cerberus-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, service_name, span_name) (rate(traces_span_metrics_duration_bucket{service_name=~\"$service\"}[5m])))",
              "format": "table",
              "instant": true,
              "refId": "C"
            }
          ],
          "title": "Operations (last 5m)",
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "Req/s",
                  "Value #B": "Error rate",
                  "Value #C": "p95 (ms)",
                  "service_name": "Service",
                  "span_name": "Operation"
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": [
        "span-metrics",
        "cerberus",
        "clickhouse"
      ],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "cerberus-prometheus"
            },
            "definition": "label_values(traces_span_metrics_calls, service_name)",
            "includeAll": true,
            "label": "Service",
            "multi": true,
            "name": "service",
            "query": {
              "query": "label_values(traces_span_metrics_calls, service_name)",
              "refId": "svc"
            },
            "refresh": 2,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Span metrics (RED)",
      "uid": "span-metrics-red",
      "annotations": {
        "list": [
          {
            "datasource": {
              "type": "loki",
              "uid": "cerberus-loki"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "name": "Alerts firing",
            "expr": "{service_name=\"alertmanager\"} | status=\"firing\"",
            "titleFormat": "{{alertname}} firing",
            "textFormat": "{{alert_service_name}}",
            "tagKeys": "alertname,alert_service_name,severity",
            "instant": false
          },
          {
            "datasource": {
              "type": "loki",
              "uid": "cerberus-loki"
            },
            "enable": true,
            "hide": false,
            "iconColor": "green",
            "name": "Alerts resolved",
            "expr": "{service_name=\"alertmanager\"} | status=\"resolved\"",
            "titleFormat": "{{alertname}} resolved",
            "textFormat": "{{alert_service_name}}",
            "tagKeys": "alertname,alert_service_name,severity",
            "instant": false
          }
        ]
      }
    }

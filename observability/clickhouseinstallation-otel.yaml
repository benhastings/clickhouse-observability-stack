# Source: clickhouse/templates/objects.yaml
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  labels:
    app.kubernetes.io/instance: clickhouse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/version: 26.9.5.2
    environment: dev
    helm.sh/chart: clickhouse-0.1.0
  name: otel
  namespace: observability
spec:
  configuration:
    clusters:
      - layout:
          replicasCount: 1
          shardsCount: 1
        name: main
    files:
      config.d/prometheus.xml: |
        <clickhouse>
          <prometheus>
            <endpoint>/metrics</endpoint>
            <port>9363</port>
            <metrics>true</metrics>
            <events>true</events>
            <asynchronous_metrics>true</asynchronous_metrics>
            <errors>true</errors>
          </prometheus>
        </clickhouse>
    profiles:
      analyst/constraints/max_concurrent_queries_for_user/max: 2
      analyst/constraints/max_execution_time/max: 60
      analyst/constraints/max_memory_usage/max: 268435456
      analyst/constraints/max_rows_to_read/max: 200000000
      analyst/constraints/priority/min: 10
      analyst/max_concurrent_queries_for_user: 2
      analyst/max_execution_time: 60
      analyst/max_memory_usage: 268435456
      analyst/max_rows_to_read: 200000000
      analyst/priority: 10
    quotas:
      analyst/interval/duration: 3600
      analyst/interval/execution_time: 1800
      analyst/interval/queries: 600
      analyst/interval/read_rows: 2000000000
    users:
      otel_admin/networks/ip:
        - 0.0.0.0/0
        - ::/0
      otel_admin/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-admin
      otel_admin/profile: default
      otel_admin/quota: default
      otel_analyst/grants/query:
        - GRANT SELECT ON otel.*
        - GRANT SELECT ON otel_baseline.*
        - GRANT SELECT ON otel_features.*
        - GRANT INSERT ON otel_ml.*
      otel_analyst/networks/ip:
        - 0.0.0.0/0
        - ::/0
      otel_analyst/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-analyst
      otel_analyst/profile: analyst
      otel_analyst/quota: analyst
      otel_reader/grants/query:
        - GRANT SELECT ON otel.*
        - GRANT SELECT ON otel_baseline.*
        - GRANT SELECT ON otel_slo.*
        - GRANT SELECT ON system.view_refreshes
        - GRANT SELECT ON system.disks
      otel_reader/networks/ip:
        - 0.0.0.0/0
        - ::/0
      otel_reader/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-reader
      otel_reader/profile: default
      otel_reader/quota: default
      otel_writer/grants/query:
        - GRANT INSERT ON otel.*
      otel_writer/networks/ip:
        - 0.0.0.0/0
        - ::/0
      otel_writer/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-writer
      otel_writer/profile: default
      otel_writer/quota: default
  defaults:
    templates:
      dataVolumeClaimTemplate: data
      podTemplate: clickhouse
      serviceTemplate: clickhouse
  templates:
    podTemplates:
      - metadata:
          annotations:
            traffic.sidecar.istio.io/excludeInboundPorts: "8123"
          labels:
            sidecar.istio.io/inject: "true"
        name: clickhouse
        spec:
          containers:
            - image: clickhouse/clickhouse-server:26.9.5.2
              name: clickhouse
              resources:
                limits:
                  memory: 8Gi
                requests:
                  cpu: "2"
                  memory: 8Gi
    serviceTemplates:
      - generateName: clickhouse
        name: clickhouse
        spec:
          ports:
            - name: http
              port: 8123
            - name: tcp
              port: 9000
          type: ClusterIP
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 200Gi

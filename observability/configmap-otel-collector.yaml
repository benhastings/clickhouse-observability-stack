# Source: otel-collector/templates/common.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: otel-collector-0.1.0
    app.kubernetes.io/version: "0.161.0"
    environment: dev
data:
  relay.yaml: |-
    connectors:
      servicegraph:
        latency_histogram_buckets:
        - 10ms
        - 50ms
        - 100ms
        - 250ms
        - 500ms
        - 1s
        - 2.5s
        - 5s
        store:
          max_items: 10000
          ttl: 5s
      spanmetrics:
        dimensions:
        - name: http.request.method
        - name: http.response.status_code
        - name: http.route
        exemplars:
          enabled: true
        histogram:
          explicit:
            buckets:
            - 5ms
            - 10ms
            - 25ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2.5s
            - 5s
            - 10s
          unit: ms
        metrics_flush_interval: 15s
    exporters:
      clickhouse:
        create_schema: false
        database: otel
        endpoint: tcp://clickhouse:9000?dial_timeout=10s
        password: ${env:CLICKHOUSE_PASSWORD}
        retry_on_failure:
          enabled: true
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
        timeout: 10s
        username: otel
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
    receivers:
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 30s
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: false
        metric_groups: [node, pod, container, volume]
      # OTLP listens on every interface in the pod, not just the pod IP, because
      # kubectl port-forward (make cluster/port-forward) connects to localhost inside the pod.
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters:
          - clickhouse
          processors:
          - memory_limiter
          - batch
          receivers:
          - otlp
        metrics:
          exporters:
          - clickhouse
          processors:
          - memory_limiter
          - batch
          receivers:
          - otlp
          - kubeletstats
          - spanmetrics
          - servicegraph
        traces:
          exporters:
          - clickhouse
          - spanmetrics
          - servicegraph
          processors:
          - memory_limiter
          - batch
          receivers:
          - otlp
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888

# Source: otel-collector/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: otel-collector-0.1.0
    app.kubernetes.io/version: "0.161.0"
    environment: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: otel-collector
      annotations:
        checksum/config: 391b84de2258c2655a0ddb94bff2711d4c2f3c3c4f5097943ae3f9bb5212585b
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: otel-collector
          image: "otel/opentelemetry-collector-contrib:0.161.0"
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/relay.yaml
          ports:
            - name: otlp
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: clickhouse-credentials
            - name: GOMEMLIMIT
              value: "1638MiB"
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /conf
              name: config
      volumes:
        - name: config
          configMap:
            name: 'otel-collector'

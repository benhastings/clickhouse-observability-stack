suite: common.vault
release:
  name: fixture
  namespace: demo
tests:
  - it: reads secretEnv from a Kubernetes Secret when Vault is off
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: fixture-credentials
                key: password
      - notExists:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject"]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: injects secretEnv through the Vault agent when Vault is on
    set:
      vault.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/role"]
          value: fixture
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-fixture-credentials-password"]
          value: secret/data/fixture-credentials
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-template-fixture-credentials-password"]
          value: '{{- with secret "secret/data/fixture-credentials" -}}{{ index .Data.data "password" }}{{- end -}}'
      - notExists:
          path: spec.template.metadata.annotations["vault.hashicorp.com/secret-volume-path-fixture-credentials-password"]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: points the file env var at the injected file instead of reading the Secret
    set:
      vault.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD_FILE
            value: /vault/secrets/fixture-credentials-password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: fixture-credentials
                key: password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: fixture-credentials
                key: username

  - it: writes a yamlKey entry as nested YAML into its own directory
    set:
      vault.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-template-app.yaml"]
          value: |-
            {{- with secret "secret/data/fixture-credentials" -}}
            db:
              username: {{ index .Data.data "username" | toJSON }}
            {{- end -}}
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/secret-volume-path-app.yaml"]
          value: /etc/app

  - it: takes the role, path prefix and extra annotations from values
    set:
      vault.enabled: true
      vault.role: observability
      vault.path: kv/data/observability/
      vault.annotations:
        vault.hashicorp.com/agent-pre-populate-only: "true"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/role"]
          value: observability
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-fixture-credentials-password"]
          value: kv/data/observability/fixture-credentials
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-pre-populate-only"]
          value: "true"

  - it: gives config the injected file's path through common.secretFile
    set:
      vault.enabled: true
      configMaps.main.data.secretPath: '{{ include "common.secretFile" (list . "app" "DB_USERNAME") }}'
    documentSelector:
      path: data["motd.txt"]
      value: hello from fixture
    asserts:
      - equal:
          path: data.secretPath
          value: /etc/app/app.yaml

  - it: fails when a secretEnv entry has no key
    set:
      deployment.containers.app.secretEnv.DB_PASSWORD.key: null
    asserts:
      - failedTemplate:
          errorMessage: deployment.containers.app.secretEnv.DB_PASSWORD.key is required

  - it: takes vault settings from global, with the node's own vault winning
    set:
      global.vault:
        enabled: true
        role: from-global
        path: kv/data
      vault.role: from-node
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/role"]
          value: from-node
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-fixture-credentials-password"]
          value: kv/data/fixture-credentials

  - it: injects no agent into a pod that declares no secretEnv
    set:
      vault.enabled: true
      deployment.containers.app.secretEnv: null
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject"]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: reads every entry from one parent record with vault.secret, a field named for the Secret and key
    set:
      global.vault:
        enabled: true
        secret: OBS_SECRET
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-fixture-credentials-password"]
          value: secret/data/OBS_SECRET
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-template-fixture-credentials-password"]
          value: '{{- with secret "secret/data/OBS_SECRET" -}}{{ index .Data.data "fixture-credentials-password" }}{{- end -}}'
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-template-app.yaml"]
          value: |-
            {{- with secret "secret/data/OBS_SECRET" -}}
            db:
              username: {{ index .Data.data "fixture-credentials-username" | toJSON }}
            {{- end -}}

  - it: reads the field an entry names with vault.field, keeping the file it writes
    set:
      vault.enabled: true
      vault.secret: OBS_SECRET
      deployment.containers.app.secretEnv.DB_PASSWORD.vault.field: db_password
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-template-fixture-credentials-password"]
          value: '{{- with secret "secret/data/OBS_SECRET" -}}{{ index .Data.data "db_password" }}{{- end -}}'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD_FILE
            value: /vault/secrets/fixture-credentials-password

  - it: fails when Vault and External Secrets are both on, naming the app and both mechanisms
    set:
      vault.enabled: true
      global.externalSecrets.enabled: true
      global.externalSecrets.secretStoreRef.name: vault-backend
    asserts:
      - failedTemplate:
          errorPattern: '^fixture: vault.enabled and global.externalSecrets.enabled are both true'

  - it: fails on both mechanisms when Vault comes from global
    set:
      global.vault.enabled: true
      global.externalSecrets.enabled: true
      global.externalSecrets.secretStoreRef.name: vault-backend
    asserts:
      - failedTemplate:
          errorPattern: '^fixture: vault.enabled and global.externalSecrets.enabled are both true'

  - it: gives a Job under objects each secretEnv entry as a secretKeyRef when Vault is off
    set:
      job.enabled: true
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: MODE
              value: once
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fixture-credentials
                  key: token
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-credentials
                  key: password
      - notExists:
          path: spec.template.metadata.annotations
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "exec /bin/job\n"

  - it: injects a Job's secretEnv through a pre-populate-only Vault agent, so its pod can complete
    set:
      job.enabled: true
      vault.enabled: true
      vault.secret: OBS_SECRET
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-pre-populate-only"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/role"]
          value: fixture
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-fixture-credentials-password"]
          value: secret/data/OBS_SECRET
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-template-fixture-credentials-token"]
          value: '{{- with secret "secret/data/OBS_SECRET" -}}{{ index .Data.data "fixture-credentials-token" }}{{- end -}}'
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      # Only the vault.env entry is an env var, and it holds a path, never a value.
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: MODE
              value: once
            - name: API_TOKEN_FILE
              value: /vault/secrets/fixture-credentials-token
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: |
            API_TOKEN="$(cat '/vault/secrets/fixture-credentials-token')"
            export API_TOKEN
            DB_PASSWORD="$(cat '/vault/secrets/fixture-credentials-password')"
            export DB_PASSWORD
            exec /bin/job

  - it: lets vault.annotations override a Job's pre-populate-only
    set:
      job.enabled: true
      vault.enabled: true
      vault.annotations:
        vault.hashicorp.com/agent-pre-populate-only: "false"
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-pre-populate-only"]
          value: "false"

  - it: renders a Job with no secretEnv without an agent, even with Vault on
    set:
      job.enabled: true
      job.secretEnv: null
      vault.enabled: true
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notExists:
          path: spec.template.metadata.annotations
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

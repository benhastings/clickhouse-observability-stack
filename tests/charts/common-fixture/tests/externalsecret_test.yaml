suite: global.externalSecrets
release:
  name: fixture
  namespace: demo
tests:
  - it: renders no ExternalSecret while External Secrets is off
    set:
      secrets.credentials.external.keys: [username, password]
    asserts:
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1
        not: true

  - it: requests a declared Secret from the store under the same name, and does not render the Secret
    set:
      global.externalSecrets.enabled: true
      global.externalSecrets.secretStoreRef.name: vault-backend
      secrets.credentials.external.keys: [username, password]
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: fixture-credentials
        not: true
      - equal:
          path: spec
          value:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: fixture-credentials
              creationPolicy: Owner
            data:
              - secretKey: username
                remoteRef:
                  key: observability/fixture-credentials
                  property: username
              - secretKey: password
                remoteRef:
                  key: observability/fixture-credentials
                  property: password
        documentSelector:
          path: kind
          value: ExternalSecret

  - it: reads an explicit remote key
    set:
      global.externalSecrets.enabled: true
      global.externalSecrets.secretStoreRef.name: vault-backend
      secrets.credentials.external:
        keys: [password]
        remoteKey: teams/obs/clickhouse
    documentSelector:
      path: kind
      value: ExternalSecret
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: teams/obs/clickhouse

  - it: fails when no store is named
    set:
      global.externalSecrets.enabled: true
      secrets.credentials.external.keys: [password]
    asserts:
      - failedTemplate:
          errorPattern: "global.externalSecrets.secretStoreRef.name is empty"

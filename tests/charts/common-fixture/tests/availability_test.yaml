suite: common.podDisruptionBudget and common.autoscaling
release:
  name: fixture
  namespace: demo
tests:
  - it: renders no disruption budget or autoscaler by default
    asserts:
      - notFailedTemplate: {}
      - containsDocument:
          kind: PodDisruptionBudget
          apiVersion: policy/v1
        not: true
      - containsDocument:
          kind: HorizontalPodAutoscaler
          apiVersion: autoscaling/v2
        not: true

  - it: keeps spec.replicas on the Deployment by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: renders a disruption budget selecting the Deployment's pods
    set:
      podDisruptionBudget.enabled: true
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: metadata.name
          value: fixture
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: fixture
            app.kubernetes.io/instance: fixture

  - it: uses maxUnavailable once minAvailable is set to null
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: fails when both minAvailable and maxUnavailable are set
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
        maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorPattern: minAvailable and podDisruptionBudget.maxUnavailable are mutually exclusive

  - it: renders an autoscaler targeting the Deployment
    set:
      autoscaling.enabled: true
    documentSelector:
      path: kind
      value: HorizontalPodAutoscaler
    asserts:
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: fixture
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 6
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70

  - it: leaves spec.replicas to the autoscaler
    set:
      autoscaling.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.replicas

  - it: fails when the autoscaler is on and deployment.replicas is changed
    set:
      autoscaling.enabled: true
      deployment.replicas: 3
    asserts:
      - failedTemplate:
          errorPattern: autoscaling.enabled is true, so the HorizontalPodAutoscaler owns the replica count

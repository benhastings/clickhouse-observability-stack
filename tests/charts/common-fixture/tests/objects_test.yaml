suite: common.objects
release:
  name: fixture
  namespace: demo
tests:
  - it: defaults name and namespace, templates the body and merges labels
    documentSelector:
      path: kind
      value: Widget
    asserts:
      - equal:
          path: metadata.name
          value: fixture-widget
      - equal:
          path: metadata.namespace
          value: demo
      - equal:
          path: spec.owner
          value: fixture
      - equal:
          path: metadata.labels.extra
          value: "yes"
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: clickhouse-observability-stack

  - it: skips an object whose body renders empty
    asserts:
      - hasDocuments:
          count: 1
        template: templates/objects.yaml

  - it: renders that object once its body is not empty
    set:
      ghostEnabled: true
    asserts:
      - hasDocuments:
          count: 2
        template: templates/objects.yaml

suite: naming and global values
release:
  name: fixture
  namespace: demo
tests:
  - it: renames every object with nameOverride
    set:
      nameOverride: renamed
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: renamed
      - equal:
          path: spec.template.spec.serviceAccountName
          value: renamed

  - it: moves every namespaced object with global.namespace
    set:
      global.namespace: elsewhere
    asserts:
      - equal:
          path: metadata.namespace
          value: elsewhere
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: metadata.namespace
          value: elsewhere
        documentSelector:
          path: kind
          value: Widget

  - it: adds global.labels to every object
    set:
      global.labels.environment: test
    asserts:
      - equal:
          path: metadata.labels.environment
          value: test
        documentSelector:
          path: kind
          value: Service
      - equal:
          path: metadata.labels.environment
          value: test
        documentSelector:
          path: kind
          value: ClusterRole

  # global.clickhouseOperator is read by the app-of-apps and the clickhouse node; every node accepts it, since
  # global reaches them all, and it leaves an app's own RBAC alone.
  - it: accepts global.clickhouseOperator and keeps an app's own ClusterRole
    set:
      global.clickhouseOperator.shared: true
      global.clickhouseOperator.podLabels:
        app.kubernetes.io/name: altinity-clickhouse-operator
    template: templates/rbac.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - isKind:
          of: ClusterRole

  - it: rejects an unknown key under global.clickhouseOperator
    set:
      global.clickhouseOperator.unknownKey: true
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'unknownKey' not allowed"

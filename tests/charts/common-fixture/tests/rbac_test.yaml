suite: common.rbac and common.serviceAccount
release:
  name: fixture
  namespace: demo
tests:
  - it: binds the ClusterRole to the chart's ServiceAccount
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: fixture
              namespace: demo
      - notExists:
          path: metadata.namespace

  - it: binds the Role in the release namespace
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.namespace
          value: demo
      - equal:
          path: roleRef.name
          value: fixture

  - it: grants rules and clusterRules, and not namespaceRules, at the default cluster scope
    template: templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [namespaces]
              verbs: [get, list]
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get]
        documentSelector:
          path: kind
          value: Role

  - it: renders no cluster-scoped RBAC at namespace scope, and grants namespaceRules in the Role instead
    set:
      rbac.scope: namespace
    template: templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: kind
          pattern: ^(Role|RoleBinding)$
      - equal:
          path: metadata.namespace
          value: demo
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]
        documentSelector:
          path: kind
          value: Role

  - it: renders a Role from namespaceRules alone at namespace scope
    set:
      rbac.scope: namespace
      rbac.rules: []
    template: templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]
        documentSelector:
          path: kind
          value: Role

  - it: uses the default ServiceAccount when none is created
    set:
      serviceAccount.create: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

suite: global.clickhouse standalone over TLS
release:
  name: fixture
  namespace: demo
set:
  networkPolicy.egress: |-
    {{- include "common.clickhouseEgress" (list . (list 9000 8123 9363)) }}
tests:
  - it: reaches a standalone ClickHouse only on 9440, 8443 for HTTP and 9363 when the app names them, never a plaintext native or HTTP port
    set: &standalone
      global.networkPolicy.enabled: true
      global.mesh: kubernetes
      global.clickhouse.standalone: true
      global.clickhouse.tls.serverName: clickhouse.demo.svc
      global.clickhouse.tls.caConfigMap: platform-ca
      global.clickhouse.tls.serverSecret: clickhouse-tls
      global.services.clickhouse: clickhouse:9440
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[1]
          value:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: clickhouse
            ports:
              - port: 9440
                protocol: TCP
              - port: 8443
                protocol: TCP
              - port: 9363
                protocol: TCP

  - it: reaches only 8443 for an app that names only HTTP
    set:
      <<: *standalone
      networkPolicy.egress: |-
        {{- include "common.clickhouseEgress" (list . (list 8123)) }}
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[1].ports
          value:
            - port: 8443
              protocol: TCP

  - it: reaches an external ClickHouse's HTTPS port, 8443, for an app that names HTTP
    set:
      global.networkPolicy.enabled: true
      global.mesh: kubernetes
      global.clickhouse.external: true
      global.clickhouse.tls.serverName: clickhouse.paas.example
      global.clickhouse.tls.caConfigMap: platform-ca
      global.services.clickhouse: clickhouse.paas.example:9440
      networkPolicy.egress: |-
        {{- include "common.clickhouseEgress" (list . (list 8123)) }}
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[1]
          value:
            ports:
              - port: 8443
                protocol: TCP

  - it: gives the HTTPS address on 8443 for the host of global.services.clickhouse
    set:
      <<: *standalone
      configMaps.main.data.https: '{{ include "common.clickhouseHTTPSAddress" . }}'
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: fixture
    asserts:
      - equal:
          path: data.https
          value: clickhouse:8443

  - it: leaves out 9363 for an app that does not scrape ClickHouse
    set:
      <<: *standalone
      networkPolicy.egress: |-
        {{- include "common.clickhouseEgress" (list . (list 9000)) }}
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[1].ports
          value:
            - port: 9440
              protocol: TCP

  - it: mounts the platform's CA bundle in a container that sets clickhouseCA
    set: *standalone
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: clickhouse-ca
            configMap:
              name: platform-ca
      - equal:
          path: spec.template.spec.containers[?(@.name == "sidecar")].volumeMounts
          value:
            - name: clickhouse-ca
              mountPath: /etc/clickhouse-ca
              readOnly: true

  - it: fails a standalone ClickHouse with no server name, since no client could verify it
    set:
      <<: *standalone
      global.clickhouse.tls.serverName: ""
    template: templates/networkpolicy.yaml
    asserts:
      - failedTemplate:
          errorPattern: global.clickhouse.standalone is true but global.clickhouse.tls.serverName is empty

  - it: fails a standalone ClickHouse with no CA bundle
    set:
      <<: *standalone
      global.clickhouse.tls.caConfigMap: ""
    template: templates/networkpolicy.yaml
    asserts:
      - failedTemplate:
          errorPattern: global.clickhouse.standalone is true but global.clickhouse.tls.caConfigMap is empty

  - it: fails a standalone ClickHouse dialled on the plaintext native port
    set:
      <<: *standalone
      global.services.clickhouse: clickhouse:9000
    template: templates/networkpolicy.yaml
    asserts:
      - failedTemplate:
          errorPattern: "global.services.clickhouse is clickhouse:9000: a standalone ClickHouse serves the native protocol only over TLS, on 9440"

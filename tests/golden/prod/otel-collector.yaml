# Source: otel-collector/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: otel-collector-0.1.0
    app.kubernetes.io/version: "0.161.0"
    environment: prod
data:
  relay.yaml: |-
    connectors:
      servicegraph:
        latency_histogram_buckets:
        - 10ms
        - 50ms
        - 100ms
        - 250ms
        - 500ms
        - 1s
        - 2.5s
        - 5s
        store:
          max_items: 10000
          ttl: 5s
      spanmetrics:
        dimensions:
        - name: http.request.method
        - name: http.response.status_code
        - name: http.route
        exemplars:
          enabled: true
        histogram:
          explicit:
            buckets:
            - 5ms
            - 10ms
            - 25ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2.5s
            - 5s
            - 10s
          unit: ms
        metrics_flush_interval: 15s
    exporters:
      clickhouse:
        create_schema: false
        database: otel
        endpoint: tcp://clickhouse:9000?dial_timeout=10s
        password: ${env:CLICKHOUSE_PASSWORD}
        retry_on_failure:
          enabled: true
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
        timeout: 10s
        username: otel_writer
    extensions:
      bearertokenauth:
        token: ${env:OTLP_BEARER_TOKEN}
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Alertmanager's webhook payload, one alert per notification (the history route groups by every
      # label), as a log of service alertmanager with the alert's fields as attributes for LogQL.
      transform/alertmanager:
        error_mode: ignore
        log_statements:
          - set(resource.attributes["service.name"], "alertmanager")
          - set(log.time, log.observed_time)
          - merge_maps(log.cache, ParseJSON(log.body), "upsert")
          - set(log.cache["alert"], log.cache["alerts"][0])
          - set(log.attributes["status"], log.cache["status"])
          - set(log.attributes["receiver"], log.cache["receiver"])
          - set(log.attributes["alertname"], log.cache["alert"]["labels"]["alertname"])
          - set(log.attributes["severity"], log.cache["alert"]["labels"]["severity"])
          - set(log.attributes["alert_service_name"], log.cache["alert"]["labels"]["service_name"])
          - set(log.attributes["fingerprint"], log.cache["alert"]["fingerprint"])
          - set(log.attributes["starts_at"], log.cache["alert"]["startsAt"])
          - set(log.severity_text, "WARN") where log.cache["status"] == "firing"
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.cache["status"] == "firing"
          - set(log.severity_text, "INFO") where log.cache["status"] == "resolved"
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.cache["status"] == "resolved"
          - set(log.attributes["ends_at"], log.cache["alert"]["endsAt"]) where log.cache["status"] == "resolved"
          - >-
            set(log.attributes["duration_seconds"],
            UnixSeconds(Time(log.cache["alert"]["endsAt"], "%Y-%m-%dT%H:%M:%S.%fZ")) -
            UnixSeconds(Time(log.cache["alert"]["startsAt"], "%Y-%m-%dT%H:%M:%S.%fZ")))
            where log.cache["status"] == "resolved"
    receivers:
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 30s
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: false
        metric_groups: [node, pod, container, volume]
      # Alertmanager's history receiver posts every notification here (global.services.alertHistory).
      webhook_event:
        endpoint: 0.0.0.0:8088
        path: /alertmanager
      # OTLP listens on every interface in the pod, not just the pod IP, because
      # kubectl port-forward (make cluster/port-forward) connects to localhost inside the pod.
      otlp:
        protocols:
          grpc:
            auth:
              authenticator: bearertokenauth
            endpoint: 0.0.0.0:4317
          http:
            auth:
              authenticator: bearertokenauth
            endpoint: 0.0.0.0:4318
    service:
      extensions:
      - bearertokenauth
      - health_check
      pipelines:
        logs:
          exporters:
          - clickhouse
          processors:
          - memory_limiter
          - batch
          receivers:
          - otlp
        logs/alertmanager:
          exporters:
          - clickhouse
          processors:
          - memory_limiter
          - transform/alertmanager
          - batch
          receivers:
          - webhook_event
        metrics:
          exporters:
          - clickhouse
          processors:
          - memory_limiter
          - batch
          receivers:
          - otlp
          - kubeletstats
          - spanmetrics
          - servicegraph
        traces:
          exporters:
          - clickhouse
          - spanmetrics
          - servicegraph
          processors:
          - memory_limiter
          - batch
          receivers:
          - otlp
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888

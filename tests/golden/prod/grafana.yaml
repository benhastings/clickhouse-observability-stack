  alert-hygiene.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**Alert hygiene**: every notification Alertmanager sends is also a log of service `alertmanager` in ClickHouse (the `history` receiver, through the collector). These panels count them with LogQL through Cerberus, to find noisy, flapping and slow-to-resolve rules before tuning thresholds."
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Firing notifications per rule",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "datasource": {
            "type": "loki",
            "uid": "cerberus-loki"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "cerberus-loki"
              },
              "expr": "sum by (alertname) (count_over_time({service_name=\"alertmanager\"} | status=\"firing\" [$__interval]))",
              "refId": "A",
              "queryType": "range",
              "legendFormat": "{{alertname}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "Notifications per rule",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 0,
            "y": 11
          },
          "datasource": {
            "type": "loki",
            "uid": "cerberus-loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "reduce",
              "options": {
                "reducers": [
                  "lastNotNull"
                ],
                "mode": "seriesToRows"
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "cerberus-loki"
              },
              "expr": "sum by (alertname) (count_over_time({service_name=\"alertmanager\"} | status=\"firing\" [$__range]))",
              "refId": "A",
              "queryType": "instant",
              "legendFormat": "{{alertname}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Median time to resolve",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 8,
            "y": 11
          },
          "datasource": {
            "type": "loki",
            "uid": "cerberus-loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Last *",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "reduce",
              "options": {
                "reducers": [
                  "lastNotNull"
                ],
                "mode": "seriesToRows"
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "cerberus-loki"
              },
              "expr": "quantile_over_time(0.5, {service_name=\"alertmanager\"} | status=\"resolved\" | unwrap duration_seconds [$__range]) by (alertname)",
              "refId": "A",
              "queryType": "instant",
              "legendFormat": "{{alertname}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Flapping: rules resolved more than 3 times",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 11
          },

# Source: app-of-apps/templates/app-project.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: prod
  annotations:
    # Before the wave 0 Applications that reference it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The clickhouse-observability-stack applications for prod.
  sourceRepos:
    - https://github.com/benhastings/clickhouse-observability-stack.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: clickhouse-operator
    - server: https://kubernetes.default.svc
      namespace: observability
  # The cluster-scoped kinds the nodes render: namespaces from CreateNamespace, the operator's CRDs from
  # its crds/ directory, and the operator's and the collector's ClusterRole and ClusterRoleBinding. With a
  # shared operator (global.clickhouseOperator.shared) or an external ClickHouse (global.clickhouse.external)
  # nothing may install a CRD.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
---
# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-prod
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/alertmanager
    helm:
      releaseName: alertmanager
      valuesObject:
        global:
          labels:
            environment: prod
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Argo CD creates the namespace, so it also labels it for Istio sidecar injection; no Namespace object
    # is rendered for it to fight with.
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
---

# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-dev
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/clickhouse
    helm:
      releaseName: clickhouse
      valuesObject:
        clickhouse:
          analyst:
            maxExecutionTime: 60
            maxMemoryUsage: 268435456
            maxRowsToRead: 200000000
            quota:
              executionTime: 1800
              readRows: 2000000000
        global:
          exposure:
            enabled: false
          labels:
            environment: dev
          retention:
            logs: 7
            metrics: 45
            traces: 15
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
    - group: clickhouse.altinity.com
      jsonPointers:
      - /status
      kind: ClickHouseInstallation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Argo CD creates the namespace, so it also labels it for Istio sidecar injection; no Namespace object
    # is rendered for it to fight with.
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
---

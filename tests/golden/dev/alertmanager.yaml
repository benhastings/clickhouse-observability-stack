# Source: alertmanager/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: alertmanager-0.1.0
    app.kubernetes.io/version: "0.34.1"
    environment: dev
automountServiceAccountToken: false
---
# Source: alertmanager/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: alertmanager-0.1.0
    app.kubernetes.io/version: "0.34.1"
    environment: dev
data:
  alertmanager.yml: |-
    receivers:
    - name: default
    - name: heartbeat
    - name: history
      webhook_configs:
      - max_alerts: 1
        send_resolved: true
        url: 'http://otel-collector:8088/alertmanager'
    route:
      group_by:
      - alertname
      - service_name
      group_interval: 5m
      group_wait: 30s
      receiver: default
      repeat_interval: 4h
      routes:
      - continue: true
        group_by:
        - '...'
        group_interval: 1m
        group_wait: 0s
        receiver: history
        repeat_interval: 168h
      - group_by:
        - alertname
        group_interval: 1m
        group_wait: 0s
        matchers:
        - alertname="Watchdog"
        receiver: heartbeat
        repeat_interval: 1m
      - receiver: default
---
# Source: alertmanager/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: alertmanager-0.1.0
    app.kubernetes.io/version: "0.34.1"
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
      protocol: TCP
      appProtocol: http
---
# Source: alertmanager/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: alertmanager-0.1.0
    app.kubernetes.io/version: "0.34.1"
    environment: dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/instance: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/instance: alertmanager
      annotations:
        checksum/config: 197305a04f247863a55df433e2244e84f28d168708641e8fc90d0eba2a6ffddb
    spec:
      serviceAccountName: alertmanager
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: alertmanager
          image: "quay.io/prometheus/alertmanager:v0.34.1"
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/alertmanager
              name: config
              readOnly: true
            - mountPath: /alertmanager
              name: data
      volumes:
        - name: config
          configMap:
            name: 'alertmanager-config'
        - name: data
          emptyDir: {}
---
# Source: alertmanager/templates/destinationrule.yaml
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: alertmanager-0.1.0
    app.kubernetes.io/version: "0.34.1"
    environment: dev
spec:
  host: alertmanager.observability.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

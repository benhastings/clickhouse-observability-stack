# Source: vmalert/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: observability
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/instance: vmalert
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vmalert-0.1.0
    app.kubernetes.io/version: "1.153.0"
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/instance: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
      protocol: TCP
      appProtocol: http
---
# Source: vmalert/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: observability
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/instance: vmalert
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vmalert-0.1.0
    app.kubernetes.io/version: "1.153.0"
    environment: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
      app.kubernetes.io/instance: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/instance: vmalert
      annotations:
        checksum/config: 75208a944da0e49164456ffcfcce4691a50c700d674ef6401e0a7d89fb246927
    spec:
      serviceAccountName: vmalert
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: vmalert
          image: "victoriametrics/vmalert:v1.153.0"
          imagePullPolicy: IfNotPresent
          args:
            - -httpListenAddr=:8880
            - -rule=/etc/vmalert/rules/*.yaml
            - -rule.validateExpressions=false
            - -datasource.url=http://garmr-sql-adapter:8080
            - -notifier.url=http://alertmanager:9093
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8880
              protocol: TCP
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/vmalert/rules
              name: rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: 'vmalert-rules'
---

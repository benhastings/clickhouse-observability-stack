# Source: vmalert/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/instance: vmalert
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: vmalert-0.1.0
    app.kubernetes.io/version: "1.153.0"
    environment: dev
data:
  anomaly.yaml: |
    # The stack's default rules: anomalies, a change from what is normal for each service, not fixed thresholds.
    # Each expr is ClickHouse SQL that garmr sql-adapter runs as otel_reader. otel_baseline.anomaly (the clickhouse
    # node's schema) gives every service and signal its observed value over the last 5 minutes, its expected
    # median and MAD, how many samples that baseline has, and z, the robust z-score. A rule keeps the rows that are
    # anomalous enough, with enough traffic to mean something, and returns z as the value. The annotations query
    # the same view for the observed value and the baseline, so a notification prints both.
    #
    # files/reference/anomaly.yaml has each rule written in PromQL; it is what these rules mean, and
    # scripts/e2e.bash checks that the error-ratio one agrees on the injected incident.
    groups:
      - name: anomaly
        interval: 1m
        rules:
          # Traffic both ways: a drop is often the first sign of an outage upstream.
          - alert: RequestRateAnomaly
            expr: |
              SELECT service_name, z AS value
              FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')})
              WHERE signal = 'requests_per_minute' AND samples >= 8 AND median >= 10 AND abs(z) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }}: request rate is {{ $value | printf \"%.1f\" }} deviations from normal"
              description: >-
                {{ $labels.service_name }} is serving {{ with printf "SELECT observed AS value FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')}) WHERE signal = 'requests_per_minute' AND service_name = '%s'" $labels.service_name | query }}{{ . | first | value | printf "%.0f" }}{{ end }} requests a minute;
                normally {{ with printf "SELECT median AS value FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')}) WHERE signal = 'requests_per_minute' AND service_name = '%s'" $labels.service_name | query }}{{ . | first | value | printf "%.0f" }}{{ end }}.
  
          # Only above a 5% floor, so a service that normally has no errors doesn't page on one.
          - alert: ErrorRatioAnomaly
            expr: |
              SELECT service_name, z AS value
              FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')})
              WHERE signal = 'error_ratio' AND samples >= 8 AND requests >= 50 AND observed > 0.05 AND z > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }}: error ratio is {{ $value | printf \"%.1f\" }} deviations above normal"
              description: >-
                {{ $labels.service_name }} errors on {{ with printf "SELECT observed AS value FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')}) WHERE signal = 'error_ratio' AND service_name = '%s'" $labels.service_name | query }}{{ . | first | value | humanizePercentage }}{{ end }} of server spans;
                normally {{ with printf "SELECT median AS value FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')}) WHERE signal = 'error_ratio' AND service_name = '%s'" $labels.service_name | query }}{{ . | first | value | humanizePercentage }}{{ end }}.
  
          - alert: LatencyAnomaly
            expr: |
              SELECT service_name, z AS value
              FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')})
              WHERE signal = 'latency_p95_ms' AND samples >= 8 AND requests >= 50 AND z > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }}: p95 latency is {{ $value | printf \"%.1f\" }} deviations above normal"
              description: >-
                {{ $labels.service_name }}'s server spans take {{ with printf "SELECT observed AS value FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')}) WHERE signal = 'latency_p95_ms' AND service_name = '%s'" $labels.service_name | query }}{{ . | first | value | printf "%.0f" }}{{ end }} ms at the 95th
                percentile; normally {{ with printf "SELECT median AS value FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')}) WHERE signal = 'latency_p95_ms' AND service_name = '%s'" $labels.service_name | query }}{{ . | first | value | printf "%.0f" }}{{ end }} ms.
  
          - alert: ErrorLogAnomaly
            expr: |
              SELECT service_name, z AS value
              FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')})
              WHERE signal = 'error_logs_per_minute' AND samples >= 8 AND observed >= 5 AND z > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }}: error logs are {{ $value | printf \"%.1f\" }} deviations above normal"
              description: >-
                {{ $labels.service_name }} logs {{ with printf "SELECT observed AS value FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')}) WHERE signal = 'error_logs_per_minute' AND service_name = '%s'" $labels.service_name | query }}{{ . | first | value | printf "%.1f" }}{{ end }} errors a minute;
                normally {{ with printf "SELECT median AS value FROM otel_baseline.anomaly(at = {time:DateTime64(3, 'UTC')}) WHERE signal = 'error_logs_per_minute' AND service_name = '%s'" $labels.service_name | query }}{{ . | first | value | printf "%.1f" }}{{ end }}.
  
          # The dead man's switch for ingestion: a service that sent spans over the last hour and none for 5
          # minutes. The value is how many requests a minute it normally serves.
          - alert: TelemetryAbsent
            expr: |
              SELECT e.service_name AS service_name, e.median AS value
              FROM otel_baseline.expected(at = {time:DateTime64(3, 'UTC')}) AS e
              LEFT ANTI JOIN otel_baseline.current(at = {time:DateTime64(3, 'UTC')}) AS c
                  ON c.service_name = e.service_name AND c.signal = e.signal
              WHERE e.signal = 'requests_per_minute' AND e.samples >= 8 AND e.median >= 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service_name }}: no spans for 5 minutes"
              description: >-
                {{ $labels.service_name }} normally serves {{ $value | printf "%.0f" }} requests a minute but has sent
                no server spans for 5 minutes: it is down, or its telemetry isn't reaching the collector.
  stack.yaml: |
    # The rules that watch the stack itself. The rules about services are anomaly.yaml. Each expr is ClickHouse
    # SQL that garmr sql-adapter runs as otel_reader: the column named value is the sample, every other column is
    # a label, and {time:DateTime64(3, 'UTC')} is the evaluation time. Group by every label column. The labels
    # severity and service_name are what Alertmanager groups and routes on.
    groups:
      - name: stack
        interval: 1m
        rules:
          # Always firing, so the alerting pipeline itself is watched: Alertmanager routes it to the heartbeat
          # receiver, which a site points at a dead man's switch service.
          # If vmalert stops evaluating, or can't reach ClickHouse or Alertmanager, the heartbeat stops.
          - alert: Watchdog
            expr: SELECT 1 AS value
            labels:
              severity: none
            annotations:
              summary: "The alerting pipeline is working: vmalert evaluates rules and Alertmanager receives them"
  
          # Alertmanager's own counters, scraped by the collector into otel_metrics_sum. A receiver that can't
          # deliver (a revoked Slack token, an unreachable mail relay) fails silently otherwise. Alertmanager
          # routes this alert by its integration label, so it can go to a receiver other than the failing one.
          - alert: AlertmanagerNotificationsFailing
            expr: |
              SELECT Attributes['integration'] AS integration, max(Value) - min(Value) AS value
              FROM otel.otel_metrics_sum
              WHERE MetricName = 'alertmanager_notifications_failed_total'
                AND TimeUnix > {time:DateTime64(3, 'UTC')} - INTERVAL 10 MINUTE
                AND TimeUnix <= {time:DateTime64(3, 'UTC')}
              GROUP BY integration
              HAVING value > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Alertmanager failed to send {{ $value }} {{ $labels.integration }} notifications in 10 minutes"
  
          # The anomaly baselines are refreshable views in otel_baseline (the clickhouse node's schema). A refresh
          # that fails, or a view that hasn't succeeded for a while (10 minutes for the per-minute signals, 2 hours
          # for the hourly baselines), leaves the anomaly rules comparing against a stale or empty baseline.
          - alert: BaselineRefreshFailing
            expr: |
              SELECT view, 1 AS value
              FROM system.view_refreshes
              WHERE database = 'otel_baseline'
                AND (exception != ''
                     OR dateDiff('second', last_success_time, {time:DateTime64(3, 'UTC')})
                        > if(view = 'signal_1m_mv', 600, 7200))
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "The anomaly baseline view otel_baseline.{{ $labels.view }} is failing or late"
              description: >-
                Check system.view_refreshes for otel_baseline.{{ $labels.view }}: its exception, or why
                last_success_time is old. Anomaly rules compare against the last baseline it wrote.
  
          # The spanmetrics connector counts every dimension combination past collector.spanMetrics.cardinalityLimit
          # in one series marked otel.metric.overflow="true". Its requests are still counted, but under no span
          # name, so the operations table and per-route panels lose them. Usually a span name or route with an ID
          # in it.
          - alert: SpanMetricsCardinalityLimitHit
            expr: |
              SELECT ServiceName AS service_name, max(Value) - min(Value) AS value
              FROM otel.otel_metrics_sum
              WHERE MetricName = 'traces_span_metrics_calls'
                AND Attributes['otel.metric.overflow'] = 'true'
                AND TimeUnix > {time:DateTime64(3, 'UTC')} - INTERVAL 10 MINUTE
                AND TimeUnix <= {time:DateTime64(3, 'UTC')}
              GROUP BY service_name
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }} has more span-metrics series than the collector tracks"
              description: >-
                {{ $value }} of {{ $labels.service_name }}'s spans in 10 minutes went to the overflow series. Look for
                span names or http.route values with IDs in them: topk(20, count by (span_name)
                (traces_span_metrics_calls{service_name="{{ $labels.service_name }}"})).
  
          # ClickHouse's own view of its disks, so this works on any volume type (kubelet reports no volume
          # stats for hostPath volumes such as kind's) and in every environment, prod included. A full disk
          # stops inserts: the collector queues, then drops. Object-storage disks report no total and are skipped.
          - alert: ClickHouseDiskFilling
            expr: |
              SELECT name AS disk, round(1 - free_space / total_space, 3) AS value
              FROM system.disks
              WHERE total_space > 0 AND 1 - free_space / total_space > 0.8
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ClickHouse disk {{ $labels.disk }} is {{ $value | humanizePercentage }} full"
              description: >-
                Lower clickhouse.schema.ttlDays or grow clickhouse.storage before it passes 90%.
          - alert: ClickHouseDiskFull
            expr: |
              SELECT name AS disk, round(1 - free_space / total_space, 3) AS value
              FROM system.disks
              WHERE total_space > 0 AND 1 - free_space / total_space > 0.9
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "ClickHouse disk {{ $labels.disk }} is {{ $value | humanizePercentage }} full"
              description: >-
                Inserts fail when the disk fills, and the collector drops telemetry once its queue is full.
                Grow clickhouse.storage, or lower clickhouse.schema.ttlDays and let the TTL merges free space.

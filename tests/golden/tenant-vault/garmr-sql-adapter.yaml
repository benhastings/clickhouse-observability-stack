    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: garmr-sql-adapter-0.1.0
    app.kubernetes.io/version: "0.3.0"
    environment: tenant-vault
automountServiceAccountToken: false
---
# Source: garmr-sql-adapter/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: garmr-sql-adapter-env
  namespace: observability
  labels:
    app.kubernetes.io/name: garmr-sql-adapter
    app.kubernetes.io/instance: garmr-sql-adapter
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: garmr-sql-adapter-0.1.0
    app.kubernetes.io/version: "0.3.0"
    environment: tenant-vault
data:
  CLICKHOUSE_ADDR: "clickhouse:9440"
  CLICKHOUSE_DATABASE: "otel"
  CLICKHOUSE_TLS_CA_FILE: "/vault/secrets/platform-ca-bundle-ca.crt"
  CLICKHOUSE_TLS_ENABLED: "true"
  CLICKHOUSE_TLS_SERVER_NAME: "clickhouse"
  CLICKHOUSE_USER: "otel_reader"
  GARMR_LISTEN_ADDRESS: ":8080"
  GARMR_LOG_FORMAT: "json"

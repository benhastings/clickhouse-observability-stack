# Source: garmr/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmr
  namespace: observability
  labels:
    app.kubernetes.io/name: garmr
    app.kubernetes.io/instance: garmr
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: garmr-0.1.0
    app.kubernetes.io/version: "0.3.0"
    environment: tenant-vault
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: garmr
      app.kubernetes.io/instance: garmr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garmr
        app.kubernetes.io/instance: garmr
      annotations:
        checksum/config: 56bdf94709b4679c5fa358715d892c2841cfea8a9ffa3efa36a42366cad20fa9
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-secret-clickhouse-garmr-password: secret/data/OBS_SECRET
        vault.hashicorp.com/agent-inject-secret-platform-ca-bundle-ca.crt: secret/data/OBS_SECRET
        vault.hashicorp.com/agent-inject-template-clickhouse-garmr-password: '{{- with secret
          "secret/data/OBS_SECRET" -}}{{ index .Data.data "clickhouse-garmr-password" }}{{-
          end -}}'
        vault.hashicorp.com/agent-inject-template-platform-ca-bundle-ca.crt: '{{- with secret
          "secret/data/OBS_SECRET" -}}{{ index .Data.data "platform-ca-bundle-ca.crt" }}{{-
          end -}}'
        vault.hashicorp.com/agent-limits-cpu: 100m
        vault.hashicorp.com/agent-limits-mem: 64Mi
        vault.hashicorp.com/agent-requests-cpu: 10m
        vault.hashicorp.com/agent-requests-mem: 32Mi
        vault.hashicorp.com/role: observability
    spec:
      serviceAccountName: garmr
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: garmr
          image: "ghcr.io/benhastings/garmr:v0.3.0@sha256:68f6faf6ab936681ac681c0b41f05c4e6729bb7f5f7134668d4e5981d490e356"
          imagePullPolicy: IfNotPresent
          args:
            - serve
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLICKHOUSE_PASSWORD_FILE
              value: "/vault/secrets/clickhouse-garmr-password"
            - name: GOMEMLIMIT
              value: "50331648B"
          envFrom:
            - configMapRef:
                name: 'garmr-env'
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/garmr/slack
              name: slack
              readOnly: true
      volumes:
        - name: slack
          emptyDir: {}

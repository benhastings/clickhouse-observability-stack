---
# Source: garmr/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garmr
  namespace: observability
  labels:
    app.kubernetes.io/name: garmr
    app.kubernetes.io/instance: garmr
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: garmr-0.1.0
    app.kubernetes.io/version: "0.3.0"
    environment: tenant-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garmr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - podSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - alertmanager
            - otel-collector
      ports:
      - port: 8080
        protocol: TCP
    # Ambient: the same peers over HBONE, which ztunnel delivers on 15008.
    - from:
      - podSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - alertmanager
            - otel-collector
      ports:
      - port: 15008
        protocol: TCP
    # Ambient: kubelet's health probes, which ztunnel rewrites to come from this link-local address.
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - port: 9440
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
          protocol: TCP
    - ports:
      - port: 8200
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: vault
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vault
    # Ambient: the same peers over HBONE, which ztunnel sends to on 15008.
    - ports:
      - port: 15008
        protocol: TCP
      to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: clickhouse
    - ports:
      - port: 15008
        protocol: TCP
      to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
    - ports:
      - port: 15008
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: vault
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vault

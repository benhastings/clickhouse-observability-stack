apiVersion: v1
kind: ConfigMap
metadata:
  name: garmr-env
  namespace: observability
  labels:
    app.kubernetes.io/name: garmr
    app.kubernetes.io/instance: garmr
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm

  CLICKHOUSE_TLS_SERVER_NAME: "clickhouse"
  CLICKHOUSE_USER: "otel_garmr"
  GARMR_ALERTMANAGER_URL: "http://alertmanager:9093"
  GARMR_DATABASE: "garmr"
  GARMR_LISTEN_ADDRESS: ":8080"
  GARMR_LOG_FORMAT: "json"
  GARMR_TRACE_URL: ""
  SLACK_APP_TOKEN_FILE: ""
  SLACK_BOT_TOKEN_FILE: ""
  SLACK_CHANNEL: ""

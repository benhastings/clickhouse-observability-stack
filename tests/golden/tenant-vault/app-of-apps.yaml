---
# Source: app-of-apps/templates/app-project.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability-tenant-vault
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: tenant-vault
  annotations:
    # Before the wave 0 Applications that reference it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The clickhouse-observability-stack applications for tenant-vault.
  sourceRepos:
    - https://github.com/benhastings/clickhouse-observability-stack.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: observability
  # The restricted-namespace profile (clusterScoped: false): no cluster-scoped kind at all, not even a Namespace.
  clusterResourceWhitelist: []
---
# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager-tenant-vault
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: tenant-vault
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-tenant-vault
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/alertmanager
    helm:
      releaseName: alertmanager
      valuesObject:
        global:
          clickhouse:
            standalone: true
            tls:
              caConfigMap: platform-ca-bundle
              caKey: ca.crt
              serverName: clickhouse
              serverSecret: clickhouse-tls
              vault: true
          exposure:
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.tenant-vault.example
          externalSecrets:
            enabled: false
          istio:
            dataplaneMode: ambient
          labels:
            environment: tenant-vault
          networkPolicy:
            enabled: true
            exposureNamespaces:
            - istio-ingress
            vault:
              namespace: vault
              podLabels:
                app.kubernetes.io/name: vault
          quota:
            requireLimits: true
          resources:
            limits:
              cpu: 500m
          retention:
            logs: 7
            metrics: 7
            traces: 7
          services:
            clickhouse: clickhouse:9440
          vault:
            annotations:
              vault.hashicorp.com/agent-limits-cpu: 100m
              vault.hashicorp.com/agent-limits-mem: 64Mi
              vault.hashicorp.com/agent-requests-cpu: 10m
              vault.hashicorp.com/agent-requests-mem: 32Mi
            enabled: true
            role: observability
            secret: OBS_SECRET
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

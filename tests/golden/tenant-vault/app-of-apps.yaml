# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-tenant-vault
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: tenant-vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-tenant-vault
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/clickhouse
    helm:
      releaseName: clickhouse
      valuesObject:
        clickhouse:
          analyst:
            maxExecutionTime: 60
            maxMemoryUsage: 268435456
            maxRowsToRead: 200000000
            quota:
              executionTime: 1800
              readRows: 2000000000
          lowMemory: true
          resources:
            limits:
              cpu: "1"
              memory: 1664Mi
            requests:
              cpu: 100m
              memory: 256Mi
          schema:
            resources:
              limits:
                cpu: 500m
          storage: 2Gi
        global:
          clickhouse:
            standalone: true
            tls:
              caConfigMap: platform-ca-bundle
              caKey: ca.crt
              serverName: clickhouse
              serverSecret: clickhouse-tls
              vault: true
          exposure:
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.tenant-vault.example
          externalSecrets:
            enabled: false
          istio:
            dataplaneMode: ambient
          labels:
            environment: tenant-vault
          networkPolicy:
            enabled: true
            exposureNamespaces:
            - istio-ingress
            vault:
              namespace: vault
              podLabels:
                app.kubernetes.io/name: vault
          quota:
            requireLimits: true
          resources:
            limits:
              cpu: 500m
          retention:
            logs: 7
            metrics: 7
            traces: 7
          services:
            clickhouse: clickhouse:9440
          vault:
            annotations:
              vault.hashicorp.com/agent-limits-cpu: 100m
              vault.hashicorp.com/agent-limits-mem: 64Mi
              vault.hashicorp.com/agent-requests-cpu: 10m
              vault.hashicorp.com/agent-requests-mem: 32Mi
            enabled: true
            role: observability
            secret: OBS_SECRET
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
    - group: clickhouse.altinity.com
      jsonPointers:
      - /status
      kind: ClickHouseInstallation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

---
# Source: cerberus/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus
  namespace: observability
  labels:
    app.kubernetes.io/name: cerberus
    app.kubernetes.io/instance: cerberus
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: cerberus-0.1.0
    app.kubernetes.io/version: "1.22.0"
    environment: tenant-vault
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cerberus
      app.kubernetes.io/instance: cerberus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cerberus
        app.kubernetes.io/instance: cerberus
      annotations:
        checksum/config: c887d0342ae2472f4e71f1f3644b8fbe61a258ca3849ae46c5409c87378a91ab
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-secret-cerberus.yaml: secret/data/OBS_SECRET
        vault.hashicorp.com/agent-inject-secret-platform-ca-bundle-ca.crt: secret/data/OBS_SECRET
        vault.hashicorp.com/agent-inject-template-cerberus.yaml: |-
          {{- with secret "secret/data/OBS_SECRET" -}}
          clickhouse:
            password: {{ index .Data.data "clickhouse-reader-password" | toJSON }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-template-platform-ca-bundle-ca.crt: '{{- with secret
          "secret/data/OBS_SECRET" -}}{{ index .Data.data "platform-ca-bundle-ca.crt" }}{{-
          end -}}'
        vault.hashicorp.com/agent-limits-cpu: 100m
        vault.hashicorp.com/agent-limits-mem: 64Mi
        vault.hashicorp.com/agent-requests-cpu: 10m
        vault.hashicorp.com/agent-requests-mem: 32Mi
        vault.hashicorp.com/role: observability
        vault.hashicorp.com/secret-volume-path-cerberus.yaml: /etc/cerberus
    spec:
      serviceAccountName: cerberus
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: cerberus
          image: "ghcr.io/tsouza/cerberus:1.22.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GOMEMLIMIT
              value: "322122547B"
          envFrom:
            - configMapRef:
                name: 'cerberus-env'
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 384Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true

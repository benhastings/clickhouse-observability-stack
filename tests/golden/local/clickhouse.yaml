    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/version: 26.9.5.2
    environment: local
    helm.sh/chart: clickhouse-0.1.0
  name: clickhouse-schema-65b49e63
  namespace: observability
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-schema
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          until clickhouse-client --query 'SELECT 1' >/dev/null; do
            echo "waiting for ClickHouse at $CLICKHOUSE_HOST:$CLICKHOUSE_PORT"

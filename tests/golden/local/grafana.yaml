apiVersion: v1
data:
  alerts.yaml: |
    # Starter alert rules. They query Cerberus through the cerberus-prometheus datasource, and every rule
    # notifies stack-alertmanager.
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: "stack-alertmanager"
        receivers:
          - uid: observability-stack-contact
            type: "prometheus-alertmanager"
            settings:
              url: http://alertmanager:9093
    groups:
      - orgId: 1
        name: observability-stack
        folder: Observability stack
        interval: 1m
        rules:
          - uid: stack-span-error-ratio
            title: Span error ratio above 0.05
            condition: C
            for: 1m
            noDataState: OK
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: The share of server spans that end in an error is above the threshold for a service.
            data:
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: cerberus-prometheus
                model:
                  refId: A
                  instant: true
                  expr: >-
                    sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER",
                    status_code="STATUS_CODE_ERROR", service_name=~".+"}[5m]))
                    / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER",
                    service_name=~".+"}[5m]))
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: gt, params: [0.05]}
            notification_settings:
              receiver: "stack-alertmanager"
          - uid: stack-collector-no-spans
            title: The collector received no spans for 15 minutes
            condition: C
            for: 0s
            noDataState: Alerting
            execErrState: Error
            labels:
              severity: critical
            annotations:
              summary: No span metrics in the last 15 minutes, so the collector is down or nothing is sending.
            data:
              - refId: A
                relativeTimeRange: {from: 900, to: 0}
                datasourceUid: cerberus-prometheus
                model:
                  refId: A
                  instant: true
                  expr: sum(increase(traces_span_metrics_calls[15m]))
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: {type: lt, params: [1]}
            notification_settings:
              receiver: "stack-alertmanager"

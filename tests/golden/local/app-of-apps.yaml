apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: local
  annotations:
    argocd.argoproj.io/sync-wave: "3"

# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: local
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-local
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/clickhouse
    helm:
      releaseName: clickhouse
      valuesObject:
        clickhouse:
          analyst:
            maxExecutionTime: 60
            maxMemoryUsage: 268435456
            maxRowsToRead: 200000000
            quota:
              executionTime: 1800
              readRows: 2000000000
          lowMemory: true
          resources:
            limits:
              memory: 1664Mi
            requests:
              cpu: 100m
              memory: 256Mi
          schema:
            ttlDays:
              logs: 7
              metrics: 7
              traces: 7
          storage: 2Gi
        global:
          exposure:
            enabled: false
          labels:
            environment: local
          mesh: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
    - group: clickhouse.altinity.com
      jsonPointers:
      - /status
      kind: ClickHouseInstallation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

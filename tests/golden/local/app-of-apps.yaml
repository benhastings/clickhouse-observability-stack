# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: local
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-local
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/grafana
    helm:
      releaseName: grafana
      valuesObject:
        alerts:
          clickhouseDisk:
            enabled: false
          enabled: true
          errorRatio:
            for: 1m
        auth:
          genericOauth:
            enabled: false
        configMaps:
          config:
            data:
              dashboards.yaml:
                providers:
                - allowUiUpdates: true
                  disableDeletion: true
                  folder: Cerberus
                  name: dashboards
                  options:
                    path: /var/lib/grafana/dashboards
                  orgId: 1
                  type: file
        deployment:
          containers:
            grafana:
              env:
                GOMEMLIMIT: 920MiB
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /api/health
                  port: grafana
                periodSeconds: 10
                timeoutSeconds: 30
          strategy:
            type: Recreate
          volumes:
            storage:
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
        global:
          exposure:
            enabled: false
          labels:
            environment: local
          mesh: kubernetes
        objects:
          plugins:
            apiVersion: v1
            kind: PersistentVolumeClaim
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        pluginsClaim: true
        vault:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# Source: demo-load/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-load
  namespace: observability
  labels:
    app.kubernetes.io/name: demo-load
    app.kubernetes.io/instance: demo-load
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: demo-load-0.1.0
    app.kubernetes.io/version: "v0.1.0"
    environment: local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-load
      app.kubernetes.io/instance: demo-load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-load
        app.kubernetes.io/instance: demo-load
      annotations:
        checksum/config: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    spec:
      serviceAccountName: demo-load
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: correlated-telemetrygen
          image: "ghcr.io/brandonapol/correlated-telemetrygen:v0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --rate=2
            - --error-ratio=0.25
            - --environment=local
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(K8S_POD_NAME)"
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi

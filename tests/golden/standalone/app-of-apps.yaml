# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-standalone
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: standalone
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-standalone
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/clickhouse
    helm:
      releaseName: clickhouse
      valuesObject:
        clickhouse:
          analyst:
            maxExecutionTime: 60
            maxMemoryUsage: 268435456
            maxRowsToRead: 200000000
            quota:
              executionTime: 1800
              readRows: 2000000000
          lowMemory: true
          resources:
            limits:
              memory: 1664Mi
            requests:
              cpu: 100m
              memory: 256Mi
          storage: 2Gi
        global:
          clickhouse:
            standalone: true
            tls:
              caConfigMap: platform-ca-bundle
              caKey: ca.crt
              serverName: clickhouse.observability.svc
              serverSecret: clickhouse-tls
          exposure:
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.standalone.example
          labels:
            environment: standalone
          retention:
            logs: 7
            metrics: 7
            traces: 7
          services:
            clickhouse: clickhouse:9440
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
    - group: clickhouse.altinity.com
      jsonPointers:
      - /status
      kind: ClickHouseInstallation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

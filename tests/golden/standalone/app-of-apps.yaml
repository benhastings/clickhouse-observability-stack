apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-standalone
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: standalone
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-standalone
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/grafana
    helm:
      releaseName: grafana
      valuesObject:
        auth:
          genericOauth:
            enabled: false
        deployment:
          containers:
            grafana:
              env:
                GOMEMLIMIT: 920MiB
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
        global:
          clickhouse:
            standalone: true
            tls:
              caConfigMap: platform-ca-bundle
              caKey: ca.crt
              serverName: clickhouse.observability.svc
              serverSecret: clickhouse-tls
          exposure:
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.standalone.example
          labels:
            environment: standalone
          retention:
            logs: 7
            metrics: 7
            traces: 7
          services:
            clickhouse: clickhouse:9440
        vault:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

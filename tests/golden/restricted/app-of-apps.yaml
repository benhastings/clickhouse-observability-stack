apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-restricted
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-restricted
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/clickhouse
    helm:
      releaseName: clickhouse
      valuesObject:
        global:
          clickhouseOperator:
            shared: true
          exposure:
            enabled: true
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.restricted.example
          labels:
            environment: restricted
          mesh: istio
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
    - group: clickhouse.altinity.com
      jsonPointers:
      - /status
      kind: ClickHouseInstallation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

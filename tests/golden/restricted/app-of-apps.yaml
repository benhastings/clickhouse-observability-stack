# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-restricted
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-restricted
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/grafana
    helm:
      releaseName: grafana
      valuesObject:
        auth:
          genericOauth:
            enabled: false
        deployment:
          containers:
            grafana:
              env:
                GOMEMLIMIT: 920MiB
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
              secretEnv:
                GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: null
        global:
          clickhouseOperator:
            shared: true
          exposure:
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.restricted.example
          labels:
            environment: restricted
        vault:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

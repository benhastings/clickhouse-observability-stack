apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cerberus-restricted
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-restricted
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/cerberus
    helm:
      releaseName: cerberus
      valuesObject:
        configMaps:
          env:
            data:
              CERBERUS_PROM_METADATA_LOOKBACK: null
        deployment:
          containers:
            cerberus:
              env:
                GOMEMLIMIT: 322122547B
              resources:
                limits:
                  memory: 384Mi
                requests:
                  cpu: 25m
                  memory: 64Mi
          replicas: 1
        global:
          clickhouseOperator:
            shared: true
          exposure:
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.restricted.example
          labels:
            environment: restricted
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

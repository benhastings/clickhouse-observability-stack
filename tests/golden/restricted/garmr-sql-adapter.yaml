# Source: garmr-sql-adapter/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmr-sql-adapter
  namespace: observability
  labels:
    app.kubernetes.io/name: garmr-sql-adapter
    app.kubernetes.io/instance: garmr-sql-adapter
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: garmr-sql-adapter-0.1.0
    app.kubernetes.io/version: "0.3.0"
    environment: restricted
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: garmr-sql-adapter
      app.kubernetes.io/instance: garmr-sql-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garmr-sql-adapter
        app.kubernetes.io/instance: garmr-sql-adapter
      annotations:
        checksum/config: 87cdaa4b24f03c7f0b384cfc8a7b048d0ce454cf2f3662d3ecdfa6236aed12f1
    spec:
      serviceAccountName: garmr-sql-adapter
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: garmr
          image: "ghcr.io/benhastings/garmr:v0.3.0@sha256:68f6faf6ab936681ac681c0b41f05c4e6729bb7f5f7134668d4e5981d490e356"
          imagePullPolicy: IfNotPresent
          args:
            - sql-adapter
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: clickhouse-reader
            - name: GOMEMLIMIT
              value: "50331648B"
          envFrom:
            - configMapRef:
                name: 'garmr-sql-adapter-env'
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true

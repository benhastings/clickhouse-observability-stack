# Source: garmr/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmr
  namespace: observability
  labels:
    app.kubernetes.io/name: garmr
    app.kubernetes.io/instance: garmr
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: garmr-0.1.0
    app.kubernetes.io/version: "0.3.0"
    environment: paas
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: garmr
      app.kubernetes.io/instance: garmr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garmr
        app.kubernetes.io/instance: garmr
      annotations:
        checksum/config: c48343681e1aaab43b36d8d0e1a102f8bcc2492563769e777567586d71b4d81c
    spec:
      serviceAccountName: garmr
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: garmr
          image: "ghcr.io/benhastings/garmr:v0.3.0@sha256:68f6faf6ab936681ac681c0b41f05c4e6729bb7f5f7134668d4e5981d490e356"
          imagePullPolicy: IfNotPresent
          args:
            - serve
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: clickhouse-garmr
            - name: GOMEMLIMIT
              value: "50331648B"
          envFrom:
            - configMapRef:
                name: 'garmr-env'
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/garmr/slack
              name: slack
              readOnly: true
            - mountPath: /etc/clickhouse-ca
              name: clickhouse-ca
              readOnly: true
      volumes:
        - name: slack
          emptyDir: {}
        - name: clickhouse-ca
          configMap:
            name: platform-ca-bundle

---
# Source: app-of-apps/templates/app-project.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability-paas
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: paas
  annotations:
    # Before the wave 0 Applications that reference it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The clickhouse-observability-stack applications for paas.
  sourceRepos:
    - https://github.com/benhastings/clickhouse-observability-stack.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: observability
  # The restricted-namespace profile (clusterScoped: false): no cluster-scoped kind at all, not even a Namespace.
  clusterResourceWhitelist: []
---
# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager-paas
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: paas
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability-paas
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/alertmanager
    helm:
      releaseName: alertmanager
      valuesObject:
        global:
          clickhouse:
            external: true
            networkPolicyPeers: []
            tls:
              caConfigMap: platform-ca-bundle
              caKey: ca.crt
              serverName: clickhouse.paas.example
          exposure:
            enabled: true
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.paas.example
          labels:
            environment: paas
          mesh: istio
          services:
            clickhouse: clickhouse.paas.example:9440
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---

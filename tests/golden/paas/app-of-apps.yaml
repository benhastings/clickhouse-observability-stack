spec:
  project: observability-paas
  source:
    repoURL: https://github.com/benhastings/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/clickhouse
    helm:
      releaseName: clickhouse
      valuesObject:
        global:
          clickhouse:
            external: true
            networkPolicyPeers: []
            tls:
              caConfigMap: platform-ca-bundle
              caKey: ca.crt
              serverName: clickhouse.paas.example
          exposure:
            enabled: true
            gateway:
              name: shared-gateway
              namespace: istio-ingress
            hosts:
              grafana: grafana.paas.example
          labels:
            environment: paas
          mesh: istio
          services:
            clickhouse: clickhouse.paas.example:9440

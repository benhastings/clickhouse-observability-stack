# cspell:words bearertokenauth
suite: otel-collector
release:
  name: otel-collector
  namespace: observability
tests:
  - it: accepts OTLP on otel-collector:4317 and :4318, and Alertmanager's notifications on :8088
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: otel-collector
      - equal:
          path: spec.ports
          value:
            - name: alertmanager
              port: 8088
              targetPort: alertmanager
              protocol: TCP
              appProtocol: http
            - name: otlp
              port: 4317
              targetPort: otlp
              protocol: TCP
              appProtocol: grpc
            - name: otlp-http
              port: 4318
              targetPort: otlp-http
              protocol: TCP

  - it: listens for OTLP on every interface, so kubectl port-forward can reach it through localhost
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "otlp:\\n    protocols:\\n      grpc:\\n        endpoint: 0.0.0.0:4317\\n      http:\\n        endpoint: 0.0.0.0:4318\\n"

  - it: inserts as the write-only otel_writer and never creates the schema, which the clickhouse node owns
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "create_schema: false"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "(?m)^ +username: otel_writer$"
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "username: otel_(reader|admin)"

  - it: gives the agent the same write-only user
    set:
      collector:
        agent:
          enabled: true
      daemonset:
        enabled: true
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "(?m)^ +username: otel_writer$"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-writer
                key: password

  - it: routes traces through the span-metrics and service-graph connectors
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "exporters:\\n\\s+- clickhouse\\n\\s+- spanmetrics\\n\\s+- servicegraph"

  - it: mounts the rendered config where --config points
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config=/conf/relay.yaml
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: otel-collector

  - it: may read kubelet stats for system metrics, and watch what k8sattributes and k8s_cluster read
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes/stats]
              verbs: [get]
            - apiGroups: [""]
              resources: [nodes, pods, namespaces, services, replicationcontrollers, resourcequotas]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [replicasets, deployments, daemonsets, statefulsets]
              verbs: [get, list, watch]
            - apiGroups: [batch]
              resources: [jobs, cronjobs]
              verbs: [get, list, watch]
            - apiGroups: [autoscaling]
              resources: [horizontalpodautoscalers]
              verbs: [get, list, watch]

  - it: holds k8s_cluster's Lease in its own namespace, so one gateway replica reports the cluster
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [get, list, watch, create, update, patch]
        documentSelector:
          path: kind
          value: Role
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "k8s_leader_elector:\\n\\s+auth_type: serviceAccount\\n\\s+lease_name: otel-collector-k8s-cluster\\n\\s+lease_namespace: observability\\n"
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "k8s_cluster:\\n(\\s+\\S.*\\n)*?\\s+k8s_leader_elector: k8s_leader_elector\\n"
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "extensions:\\n\\s+- health_check\\n\\s+- k8s_leader_elector\\n"
        documentSelector:
          path: kind
          value: ConfigMap

  - it: adds Kubernetes attributes in every OTLP pipeline, before batch drops the connection
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "k8sattributes:\\n\\s+auth_type: serviceAccount\\n\\s+extract:\\n\\s+metadata:\\n\\s+- k8s.namespace.name\\n\\s+- k8s.pod.name\\n\\s+- k8s.pod.uid\\n\\s+- k8s.deployment.name"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "pod_association:\\n\\s+- sources:\\n\\s+- from: resource_attribute\\n\\s+name: k8s.pod.uid\\n(\\s+\\S.*\\n)*?\\s+- from: connection"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "\\n\\s+logs:\\n(\\s+\\S.*\\n)*?\\s+processors:\\n\\s+- memory_limiter\\n\\s+- k8sattributes\\n\\s+- batch\\n"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "\\n\\s+metrics:\\n\\s+exporters:\\n(\\s+\\S.*\\n)*?\\s+processors:\\n\\s+- memory_limiter\\n\\s+- k8sattributes\\n\\s+- batch\\n"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "\\n\\s+traces:\\n(\\s+\\S.*\\n)*?\\s+processors:\\n\\s+- memory_limiter\\n\\s+- k8sattributes\\n\\s+- batch\\n"

  - it: gives the agent's pod and container metrics their owning workload, from this node's pods only
    set:
      collector.agent.enabled: true
      daemonset.enabled: true
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: K8S_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "k8sattributes:\\n\\s+auth_type: serviceAccount\\n\\s+filter:\\n\\s+node_from_env_var: K8S_NODE_NAME\\n"
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "- memory_limiter\\n\\s+- k8sattributes\\n\\s+- batch\\n\\s+receivers:\\n\\s+- kubeletstats"

  - it: reaches the API server for k8sattributes when network policies are on
    set:
      global.networkPolicy.enabled: true
    template: templates/networkpolicy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
              - port: 6443
                protocol: TCP

  - it: mounts the ServiceAccount token the kubelet authenticates
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: sends kubelet stats down the metrics pipeline to ClickHouse
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "endpoint: https://\\$\\{env:K8S_NODE_IP\\}:10250"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "receivers:\\n\\s+- otlp\\n\\s+- kubeletstats\\n\\s+- k8s_cluster\\n\\s+- spanmetrics"

  - it: adds no extra receivers by default
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "syslog"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "logs:\\n(\\s+\\S.*\\n)*?\\s+receivers:\\n\\s+- otlp\\n\\s+logs/alertmanager:"

  - it: appends an extra receiver to a default pipeline without restating it
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      collector:
        extraReceivers:
          syslog:
            tcp:
              listen_address: ${env:MY_POD_IP}:54527
        extraPipelines:
          logs:
            receivers:
              - syslog
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "receivers:\\n(.*\\n)*  syslog:\\n    tcp:\\n      listen_address: \\$\\{env:MY_POD_IP\\}:54527\\nservice:"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "logs:\\n(\\s+\\S.*\\n)*?\\s+receivers:\\n\\s+- otlp\\n\\s+- syslog\\n\\s+logs/alertmanager:"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "traces:\\n(\\s+\\S.*\\n)*?\\s+receivers:\\n\\s+- otlp\\n\\s+telemetry:"

  - it: has no bearer token auth by default
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "bearertokenauth|auth:|OTLP_BEARER_TOKEN"

  - it: never creates the bearer token Secret
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: kind
          value: Secret
          skipEmptyTemplates: true

  - it: checks a bearer token from the environment on both OTLP protocols when auth is enabled
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      collector:
        auth:
          enabled: true
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "extensions:\\n  bearertokenauth:\\n    token: \\$\\{env:OTLP_BEARER_TOKEN\\}\\n  health_check:"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "grpc:\\n        auth:\\n          authenticator: bearertokenauth\\n        endpoint: 0.0.0.0:4317\\n      http:\\n        auth:\\n          authenticator: bearertokenauth\\n        endpoint: 0.0.0.0:4318\\n"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "service:\\n  extensions:\\n  - bearertokenauth\\n  - health_check\\n"
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "token: [^$]"

  - it: runs no agent by default, so the gateway scrapes kubeletstats and verifies the kubelet certificate
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: kind
          value: DaemonSet
          skipEmptyTemplates: true
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "kubeletstats:\\n(\\s+\\S.*\\n)*?\\s+insecure_skip_verify: false\\n"
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "receivers:\\n\\s+- otlp\\n\\s+- kubeletstats\\n\\s+- k8s_cluster\\n\\s+- spanmetrics"
        documentSelector:
          path: kind
          value: ConfigMap

  - it: moves kubeletstats from the gateway to a DaemonSet agent when the agent is enabled, and keeps k8s_cluster
    set:
      collector:
        agent:
          enabled: true
      daemonset:
        enabled: true
    asserts:
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "kubeletstats"
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "receivers:\\n\\s+- otlp\\n\\s+- k8s_cluster\\n\\s+- spanmetrics\\n\\s+- servicegraph"
        documentSelector:
          path: kind
          value: ConfigMap
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config=env:OTELCOL_AGENT_CONFIG
        documentSelector:
          path: kind
          value: DaemonSet
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "receivers:\\n  kubeletstats:\\n(\\s+\\S.*\\n)*?\\s+insecure_skip_verify: false\\n(.*\\n)*\\s+receivers:\\n\\s+- kubeletstats\\n"
        documentSelector:
          path: kind
          value: DaemonSet
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "spanmetrics|servicegraph|otlp|k8s_cluster"
        documentSelector:
          path: kind
          value: DaemonSet

  - it: gives the agent its own selector, off the otel-collector Service, and its own memory
    set:
      collector:
        agent:
          enabled: true
      daemonset:
        enabled: true
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: otel-collector-agent
            app.kubernetes.io/instance: otel-collector
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

  - it: lets an environment skip kubelet certificate verification in the agent
    set:
      collector:
        agent:
          enabled: true
          kubelet:
            insecureSkipVerify: true
      daemonset:
        enabled: true
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "insecure_skip_verify: true"

  - it: fails when the agent and the DaemonSet are not enabled together
    set:
      collector:
        agent:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "collector.agent.enabled and daemonset.enabled must be set together"

  - it: renders no Ingress unless exposure is enabled
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: kind
          value: Ingress
          skipEmptyTemplates: true

  - it: exposes OTLP over HTTP, and only HTTP, on the otlp host when the mesh is kubernetes
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            otlp: otlp.example
      collector:
        auth:
          enabled: true
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules
          value:
            - host: otlp.example
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: otel-collector
                        port:
                          name: otlp-http

  - it: refuses to expose the collector outside the cluster without auth
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            otlp: otlp.example
    asserts:
      - failedTemplate:
          errorPattern: "global.exposure.enabled puts the collector outside the cluster: set collector.auth.enabled"

  - it: exposes the collector with auth on
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            otlp: otlp.example
      collector:
        auth:
          enabled: true
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: Ingress
        documentSelector:
          path: kind
          value: Ingress

  - it: exposes the collector without auth only when a private network is declared
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            otlp: otlp.example
      collector:
        auth:
          allowUnauthenticatedExposure: true
    asserts:
      - notFailedTemplate: {}
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "bearertokenauth"
        documentSelector:
          path: kind
          value: ConfigMap

  - it: reads the ClickHouse password from clickhouse-writer
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-writer
                key: password

  - it: reads the ClickHouse password from a Vault-injected file when Vault is on
    set:
      vault.enabled: true
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "password: \\$\\{file:/vault/secrets/clickhouse-writer-password\\}"
        documentSelector:
          path: kind
          value: ConfigMap
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-clickhouse-writer-password"]
          value: secret/data/clickhouse-writer
        documentSelector:
          path: kind
          value: Deployment

  - it: gives the agent the same password file when Vault is on
    set:
      vault.enabled: true
      collector:
        agent:
          enabled: true
      daemonset:
        enabled: true
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "password: \\$\\{file:/vault/secrets/clickhouse-writer-password\\}"
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-clickhouse-writer-password"]
          value: secret/data/clickhouse-writer
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
          any: true

  - it: exports to global.services.clickhouse, and only the exporter endpoint changes
    set:
      global:
        services:
          clickhouse: clickhouse.data.svc.cluster.local:9000
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "endpoint: tcp://clickhouse.data.svc.cluster.local:9000\\?dial_timeout=10s"
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "tcp://clickhouse:9000"

  - it: collects kubelet volume metrics, which the ClickHouse disk alert reads
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "metric_groups: \\[node, pod, container, volume\\]"

  - it: keeps every Alertmanager notification as a log of service alertmanager, through its own pipeline
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "webhook_event:\\n\\s+endpoint: 0.0.0.0:8088\\n\\s+path: /alertmanager"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "logs/alertmanager:\\n\\s+exporters:\\n\\s+- clickhouse\\n\\s+processors:\\n\\s+- memory_limiter\\n\\s+- transform/alertmanager\\n\\s+- batch\\n\\s+receivers:\\n\\s+- webhook_event"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: 'set\(resource.attributes\["service.name"\], "alertmanager"\)'

  - it: accepts Alertmanager's notifications from Alertmanager only when network policies are on
    set:
      global.networkPolicy.enabled: true
    template: templates/networkpolicy.yaml
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: alertmanager
            ports:
              - port: 8088
                protocol: TCP

  - it: scrapes only Alertmanager's notification counters, from global.services.alertmanager
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "targets: \\['alertmanager:9093'\\]"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "regex: alertmanager_notifications\\(_failed\\)\\?_total"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "- servicegraph\\n\\s+- prometheus/alertmanager"

# cspell:words bearertokenauth
suite: otel-collector
release:
  name: otel-collector
  namespace: observability
tests:
  - it: accepts OTLP on otel-collector:4317 and :4318
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: otel-collector
      - equal:
          path: spec.ports
          value:
            - name: otlp
              port: 4317
              targetPort: otlp
              protocol: TCP
              appProtocol: grpc
            - name: otlp-http
              port: 4318
              targetPort: otlp-http
              protocol: TCP

  - it: listens for OTLP on every interface, so kubectl port-forward can reach it through localhost
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "otlp:\\n    protocols:\\n      grpc:\\n        endpoint: 0.0.0.0:4317\\n      http:\\n        endpoint: 0.0.0.0:4318\\n"

  - it: never creates the ClickHouse schema, which Cerberus owns
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "create_schema: false"

  - it: routes traces through the span-metrics and service-graph connectors
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "exporters:\\n\\s+- clickhouse\\n\\s+- spanmetrics\\n\\s+- servicegraph"

  - it: mounts the rendered config where --config points
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config=/conf/relay.yaml
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: otel-collector

  - it: may read kubelet stats for system metrics
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes/stats]
              verbs: [get]

  - it: mounts the ServiceAccount token the kubelet authenticates
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: sends kubelet stats down the metrics pipeline to ClickHouse
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "endpoint: https://\\$\\{env:K8S_NODE_IP\\}:10250"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "receivers:\\n\\s+- otlp\\n\\s+- kubeletstats\\n\\s+- spanmetrics"

  - it: adds no extra receivers by default
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "syslog"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "logs:\\n(\\s+\\S.*\\n)*?\\s+receivers:\\n\\s+- otlp\\n\\s+metrics:"

  - it: appends an extra receiver to a default pipeline without restating it
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      collector:
        extraReceivers:
          syslog:
            tcp:
              listen_address: ${env:MY_POD_IP}:54527
        extraPipelines:
          logs:
            receivers:
              - syslog
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "receivers:\\n(.*\\n)*  syslog:\\n    tcp:\\n      listen_address: \\$\\{env:MY_POD_IP\\}:54527\\nservice:"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "logs:\\n(\\s+\\S.*\\n)*?\\s+receivers:\\n\\s+- otlp\\n\\s+- syslog\\n\\s+metrics:"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "traces:\\n(\\s+\\S.*\\n)*?\\s+receivers:\\n\\s+- otlp\\n\\s+telemetry:"

  - it: has no bearer token auth by default
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "bearertokenauth|auth:|OTLP_BEARER_TOKEN"

  - it: never creates the bearer token Secret
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: kind
          value: Secret
          skipEmptyTemplates: true

  - it: checks a bearer token from the environment on both OTLP protocols when auth is enabled
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      collector:
        auth:
          enabled: true
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "extensions:\\n  bearertokenauth:\\n    token: \\$\\{env:OTLP_BEARER_TOKEN\\}\\n  health_check:"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "grpc:\\n        auth:\\n          authenticator: bearertokenauth\\n        endpoint: 0.0.0.0:4317\\n      http:\\n        auth:\\n          authenticator: bearertokenauth\\n        endpoint: 0.0.0.0:4318\\n"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "service:\\n  extensions:\\n  - bearertokenauth\\n  - health_check\\n"
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "token: [^$]"

  - it: runs no agent by default, so the gateway scrapes kubeletstats and verifies the kubelet certificate
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: kind
          value: DaemonSet
          skipEmptyTemplates: true
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "kubeletstats:\\n(\\s+\\S.*\\n)*?\\s+insecure_skip_verify: false\\n"
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "receivers:\\n\\s+- otlp\\n\\s+- kubeletstats\\n\\s+- spanmetrics"
        documentSelector:
          path: kind
          value: ConfigMap

  - it: moves kubeletstats from the gateway to a DaemonSet agent when the agent is enabled
    set:
      collector:
        agent:
          enabled: true
      daemonset:
        enabled: true
    asserts:
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "kubeletstats"
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "receivers:\\n\\s+- otlp\\n\\s+- spanmetrics\\n\\s+- servicegraph"
        documentSelector:
          path: kind
          value: ConfigMap
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config=env:OTELCOL_AGENT_CONFIG
        documentSelector:
          path: kind
          value: DaemonSet
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "receivers:\\n  kubeletstats:\\n(\\s+\\S.*\\n)*?\\s+insecure_skip_verify: false\\n(.*\\n)*\\s+receivers:\\n\\s+- kubeletstats\\n"
        documentSelector:
          path: kind
          value: DaemonSet
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "spanmetrics|servicegraph|otlp"
        documentSelector:
          path: kind
          value: DaemonSet

  - it: gives the agent its own selector, off the otel-collector Service, and its own memory
    set:
      collector:
        agent:
          enabled: true
      daemonset:
        enabled: true
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: otel-collector-agent
            app.kubernetes.io/instance: otel-collector
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

  - it: lets an environment skip kubelet certificate verification in the agent
    set:
      collector:
        agent:
          enabled: true
          kubelet:
            insecureSkipVerify: true
      daemonset:
        enabled: true
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "insecure_skip_verify: true"

  - it: fails when the agent and the DaemonSet are not enabled together
    set:
      collector:
        agent:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "collector.agent.enabled and daemonset.enabled must be set together"

  - it: renders no Ingress unless exposure is enabled
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: kind
          value: Ingress
          skipEmptyTemplates: true

  - it: exposes OTLP over HTTP, and only HTTP, on the otlp host when the mesh is kubernetes
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            otlp: otlp.example
      collector:
        auth:
          enabled: true
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules
          value:
            - host: otlp.example
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: otel-collector
                        port:
                          name: otlp-http

  - it: refuses to expose the collector outside the cluster without auth
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            otlp: otlp.example
    asserts:
      - failedTemplate:
          errorPattern: "global.exposure.enabled puts the collector outside the cluster: set collector.auth.enabled"

  - it: exposes the collector with auth on
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            otlp: otlp.example
      collector:
        auth:
          enabled: true
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: Ingress
        documentSelector:
          path: kind
          value: Ingress

  - it: exposes the collector without auth only when a private network is declared
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            otlp: otlp.example
      collector:
        auth:
          allowUnauthenticatedExposure: true
    asserts:
      - notFailedTemplate: {}
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "bearertokenauth"
        documentSelector:
          path: kind
          value: ConfigMap

  - it: reads the ClickHouse password from clickhouse-credentials
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-credentials
                key: password

  - it: reads the ClickHouse password from a Vault-injected file when Vault is on
    set:
      vault.enabled: true
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "password: \\$\\{file:/vault/secrets/clickhouse-credentials-password\\}"
        documentSelector:
          path: kind
          value: ConfigMap
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-clickhouse-credentials-password"]
          value: secret/data/clickhouse-credentials
        documentSelector:
          path: kind
          value: Deployment

  - it: gives the agent the same password file when Vault is on
    set:
      vault.enabled: true
      collector:
        agent:
          enabled: true
      daemonset:
        enabled: true
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "OTELCOL_AGENT_CONFIG")].value
          pattern: "password: \\$\\{file:/vault/secrets/clickhouse-credentials-password\\}"
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-clickhouse-credentials-password"]
          value: secret/data/clickhouse-credentials
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
          any: true

  - it: exports to global.services.clickhouse, and only the exporter endpoint changes
    set:
      global:
        services:
          clickhouse: clickhouse.data.svc.cluster.local:9000
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "endpoint: tcp://clickhouse.data.svc.cluster.local:9000\\?dial_timeout=10s"
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "tcp://clickhouse:9000"

  - it: collects kubelet volume metrics, which the ClickHouse disk alert reads
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "metric_groups: \\[node, pod, container, volume\\]"

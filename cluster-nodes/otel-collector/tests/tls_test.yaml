suite: otel-collector, standalone ClickHouse over TLS
release:
  name: otel-collector
  namespace: observability
set: &standalone
  global.clickhouse.standalone: true
  global.clickhouse.tls.serverName: clickhouse.observability.svc
  global.clickhouse.tls.caConfigMap: platform-ca
  global.clickhouse.tls.serverSecret: clickhouse-tls
  global.services.clickhouse: clickhouse:9440
tests:
  - it: exports to a standalone ClickHouse on 9440 over TLS, verified against the platform's CA and the server name, and still scrapes its Prometheus port
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "endpoint: tcp://clickhouse:9440\\?dial_timeout=10s&secure=true\\n"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "tls:\\n\\s+ca_file: /etc/clickhouse-ca/ca.crt\\n\\s+server_name_override: clickhouse.observability.svc\\n"
      - notMatchRegex:
          path: data["relay.yaml"]
          pattern: "skip_verify=|insecure_skip_verify: true|tls:\\n(\\s+(ca_file|server_name_override): .*\\n)*\\s+insecure"
      - matchRegex:
          path: data["relay.yaml"]
          pattern: "job_name: clickhouse"

  - it: mounts the platform's CA bundle in the gateway
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: clickhouse-ca
            configMap:
              name: platform-ca

  - it: reaches the standalone server only on 9440 and its Prometheus port 9363
    set:
      global.networkPolicy.enabled: true
      global.mesh: kubernetes
    template: templates/networkpolicy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: clickhouse
            ports:
              - port: 9440
                protocol: TCP
              - port: 9363
                protocol: TCP

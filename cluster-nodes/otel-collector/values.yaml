# yaml-language-server: $schema=values.schema.json
# cspell:words bearertokenauth
# relay.yaml is one string template, not a map, so it can append the extras below to the default
# pipelines. That means an environment can no longer deep-merge a single nested key into it:
#   - add a receiver with collector.extraReceivers.<name>, which is appended under receivers:
#   - wire it in with collector.extraPipelines.<traces|metrics|logs>.<receivers|processors|exporters>,
#     whose entries are appended to that default pipeline's list
#   - or set configMaps.main.data.relay.yaml to a whole new string to own the file.
# For example:
#   collector:
#     extraReceivers:
#       syslog:
#         tcp:
#           listen_address: ${env:MY_POD_IP}:54527
#     extraPipelines:
#       logs:
#         receivers: [syslog]
#
# collector.auth.enabled makes the OTLP receiver require a bearer token on both gRPC and HTTP, checked by
# the bearertokenauth extension against ${env:OTLP_BEARER_TOKEN}. The token is never in git: an
# environment that turns auth on pre-creates the Secret otel-collector-auth with key token (or sets
# secrets.auth.create: true with stringData.token, local only) and adds this to the collector's env:
#   deployment:
#     containers:
#       otel-collector:
#         env:
#           OTLP_BEARER_TOKEN:
#             valueFrom:
#               secretKeyRef:
#                 name: otel-collector-auth
#                 key: token
# Clients then send "Authorization: Bearer <token>".
#
# Exposing the collector outside the cluster (global.exposure.enabled) requires auth: the render fails
# unless collector.auth.enabled is set, or collector.auth.allowUnauthenticatedExposure is set for a
# collector that only a private network can reach.
#
# The collector runs as two workloads. The gateway, the Deployment below, receives OTLP, runs the
# spanmetrics and servicegraph connectors (which keep counters in memory, so want a single writer) and
# writes to ClickHouse. The agent, the DaemonSet below, runs only kubeletstats, so every node's kubelet
# is scraped. The agent is off: a Deployment only reaches the kubelet of the node it landed on, which
# is the whole cluster on kind, so until the agent is on the gateway scrapes kubeletstats itself.
# common reads daemonset.enabled literally, so a site turns the agent on with both keys; the render
# fails when they disagree:
#   collector:
#     agent:
#       enabled: true
#   daemonset:
#     enabled: true
# The gateway then drops kubeletstats. The agent's config is the OTELCOL_AGENT_CONFIG env var rather
# than a ConfigMap key, so it adds nothing to the render while it is off.
#
# kubeletstats verifies the kubelet's serving certificate unless agent.kubelet.insecureSkipVerify is
# true. Only values-local.yaml sets it, because kind's kubelet certificate is self-signed.
#
# spanMetrics.cardinalityLimit caps how many distinct dimension combinations (span name, kind, status and
# the dimensions below) the spanmetrics connector tracks. Past it, new combinations are counted together in
# one series with otel.metric.overflow="true", and vmalert's SpanMetricsCardinalityLimitHit fires. It is a
# circuit breaker for span names or routes with IDs in them; the fix is the instrumentation, or a
# transform that applies set_semconv_span_name. 0 means no limit.
collector:
  spanMetrics:
    cardinalityLimit: 5000
  auth:
    enabled: false
    allowUnauthenticatedExposure: false
  extraReceivers: {}
  extraPipelines: {}
  agent:
    enabled: false
    kubelet:
      insecureSkipVerify: false

secrets:
  auth:
    create: false

# The kubeletstats receiver reads CPU, memory, filesystem and network for the node, every pod and
# every container from this node's kubelet, plus each pod volume's capacity and free space (the volume
# group, which kubeletstats leaves off by default), so ClickHouse's disk can be watched. The gateway runs it only while the agent is off
# and rbac.scope is cluster.
configMaps:
  main:
    data:
      relay.yaml: |-
        {{- $collector := .Values.collector | default dict }}
        {{- $pipelines := $collector.extraPipelines | default dict }}
        {{- $auth := dig "auth" "enabled" false $collector }}
        {{- $agent := dig "agent" "enabled" false $collector }}
        {{- if ne $agent (dig "daemonset" "enabled" false .Values.AsMap) }}
        {{- fail "collector.agent.enabled and daemonset.enabled must be set together" }}
        {{- end }}
        {{- $namespaced := eq (dig "rbac" "scope" "cluster" .Values.AsMap) "namespace" }}
        {{- $namespace := include "common.namespace" $ }}
        {{- if and $namespaced $agent }}
        {{- fail "rbac.scope: namespace can't run the agent: kubeletstats reads nodes/stats, which only a ClusterRole grants" }}
        {{- end }}
        {{- $kubelet := not (or $agent $namespaced) }}
        {{- $exposed := and (dig "global" "exposure" "enabled" false .Values.AsMap) (dig "exposure" "host" "" .Values.AsMap) }}
        {{- if and $exposed (not $auth) (not (dig "auth" "allowUnauthenticatedExposure" false $collector)) }}
        {{- fail "global.exposure.enabled puts the collector outside the cluster: set collector.auth.enabled, or collector.auth.allowUnauthenticatedExposure for a private network" }}
        {{- end -}}
        connectors:
          servicegraph:
            latency_histogram_buckets:
            - 10ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2.5s
            - 5s
            store:
              max_items: 10000
              ttl: 5s
          spanmetrics:
            aggregation_cardinality_limit: {{ dig "spanMetrics" "cardinalityLimit" 5000 $collector | int }}
            dimensions:
            - name: http.request.method
            - name: http.response.status_code
            - name: http.route
            exemplars:
              enabled: true
            histogram:
              explicit:
                buckets:
                - 5ms
                - 10ms
                - 25ms
                - 50ms
                - 100ms
                - 250ms
                - 500ms
                - 1s
                - 2.5s
                - 5s
                - 10s
              unit: ms
            metrics_flush_interval: 15s
        exporters:
          clickhouse:
            create_schema: false
            database: otel
            endpoint: tcp://{{ include "common.serviceAddress" (list $ "clickhouse") }}?dial_timeout=10s
            password: {{ if include "common.vaultEnabled" . }}${file:{{ include "common.secretFile" (list . "otel-collector" "CLICKHOUSE_PASSWORD") }}}{{ else }}${env:CLICKHOUSE_PASSWORD}{{ end }}
            retry_on_failure:
              enabled: true
              max_elapsed_time: 5m
            sending_queue:
              enabled: true
            timeout: 10s
            username: otel_writer
        extensions:
          {{- if $auth }}
          bearertokenauth:
            token: ${env:OTLP_BEARER_TOKEN}
          {{- end }}
          health_check:
            endpoint: ${env:MY_POD_IP}:13133
          # Only the replica holding this Lease runs k8s_cluster, so prod's two gateways don't report the
          # cluster twice.
          k8s_leader_elector:
            auth_type: serviceAccount
            lease_name: otel-collector-k8s-cluster
            lease_namespace: {{ .Release.Namespace }}
        processors:
          batch: {}
          # Kubernetes attributes on every span, log and metric, so a service's RED metrics join to its pods'
          # resources. A sender is matched by the k8s.pod.uid or k8s.pod.ip it reports, else by the
          # connection's source IP, which a sidecar hides (it presents 127.0.0.6), so under Istio a sender
          # sets k8s.pod.uid. Runs before batch, which drops the connection.
          k8sattributes:
            auth_type: serviceAccount
            {{- if $namespaced }}
            filter:
              namespace: {{ $namespace }}
            {{- end }}
            extract:
              metadata:
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.pod.uid
              - k8s.deployment.name
              - k8s.statefulset.name
              - k8s.daemonset.name
              - k8s.node.name
            pod_association:
            - sources:
              - from: resource_attribute
                name: k8s.pod.uid
            - sources:
              - from: resource_attribute
                name: k8s.pod.ip
            - sources:
              - from: connection
          memory_limiter:
            check_interval: 5s
            limit_percentage: 80
            spike_limit_percentage: 25
          # Each Kubernetes event as a log of service kubernetes-events: the note as the body, the object it is
          # about and the reason as attributes for LogQL, and WARN for Warning events.
          transform/kubernetes-events:
            error_mode: ignore
            log_statements:
              - set(resource.attributes["service.name"], "kubernetes-events")
              - set(log.cache["event"], log.body["object"])
              - set(log.attributes["k8s.object.kind"], log.cache["event"]["regarding"]["kind"])
              - set(log.attributes["k8s.object.name"], log.cache["event"]["regarding"]["name"])
              - set(log.attributes["k8s.object.namespace"], log.cache["event"]["regarding"]["namespace"])
              - set(log.attributes["k8s.event.reason"], log.cache["event"]["reason"])
              - set(log.attributes["k8s.event.type"], log.cache["event"]["type"])
              - set(log.attributes["k8s.event.controller"], log.cache["event"]["reportingController"])
              - set(log.severity_text, "WARN") where log.cache["event"]["type"] == "Warning"
              - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.cache["event"]["type"] == "Warning"
              - set(log.severity_text, "INFO") where log.cache["event"]["type"] == "Normal"
              - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.cache["event"]["type"] == "Normal"
              - set(log.body, log.cache["event"]["note"]) where log.cache["event"]["note"] != nil
          # Alertmanager's webhook payload, one alert per notification (the history route groups by every
          # label), as a log of service alertmanager with the alert's fields as attributes for LogQL.
          transform/alertmanager:
            error_mode: ignore
            log_statements:
              - set(resource.attributes["service.name"], "alertmanager")
              - set(log.time, log.observed_time)
              - merge_maps(log.cache, ParseJSON(log.body), "upsert")
              - set(log.cache["alert"], log.cache["alerts"][0])
              - set(log.attributes["status"], log.cache["status"])
              - set(log.attributes["receiver"], log.cache["receiver"])
              - set(log.attributes["alertname"], log.cache["alert"]["labels"]["alertname"])
              - set(log.attributes["severity"], log.cache["alert"]["labels"]["severity"])
              - set(log.attributes["alert_service_name"], log.cache["alert"]["labels"]["service_name"])
              - set(log.attributes["fingerprint"], log.cache["alert"]["fingerprint"])
              - set(log.attributes["starts_at"], log.cache["alert"]["startsAt"])
              - set(log.severity_text, "WARN") where log.cache["status"] == "firing"
              - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.cache["status"] == "firing"
              - set(log.severity_text, "INFO") where log.cache["status"] == "resolved"
              - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.cache["status"] == "resolved"
              - set(log.attributes["ends_at"], log.cache["alert"]["endsAt"]) where log.cache["status"] == "resolved"
              - >-
                set(log.attributes["duration_seconds"],
                UnixSeconds(Time(log.cache["alert"]["endsAt"], "%Y-%m-%dT%H:%M:%S.%fZ")) -
                UnixSeconds(Time(log.cache["alert"]["startsAt"], "%Y-%m-%dT%H:%M:%S.%fZ")))
                where log.cache["status"] == "resolved"
        receivers:
          {{- if $kubelet }}
          kubeletstats:
            auth_type: serviceAccount
            collection_interval: 30s
            endpoint: https://${env:K8S_NODE_IP}:10250
            insecure_skip_verify: {{ dig "agent" "kubelet" "insecureSkipVerify" false $collector }}
            metric_groups: [node, pod, container, volume]
          {{- end }}
          # Cluster state from the API server, kube-state-metrics' half: pod phase, container restarts and
          # readiness, workload desired and available replicas, node conditions and allocatable, and every
          # container's requests and limits. Always in the gateway, agent or not.
          k8s_cluster:
            auth_type: serviceAccount
            collection_interval: 30s
            k8s_leader_elector: k8s_leader_elector
            {{- if $namespaced }}
            namespaces: [{{ $namespace }}]
            {{- else }}
            node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
            allocatable_types_to_report: [cpu, memory, ephemeral-storage, pods]
            {{- end }}
            resource_attributes:
              k8s.container.status.last_terminated_reason:
                enabled: true
          # Kubernetes events (scheduling, pulls, OOMKills, probe failures, rollouts), watched as they happen.
          # Like k8s_cluster, only the replica holding the Lease watches, so each event is written once.
          k8sobjects:
            auth_type: serviceAccount
            k8s_leader_elector: k8s_leader_elector
            objects:
              - name: events
                group: events.k8s.io
                mode: watch
                {{- if $namespaced }}
                namespaces: [{{ $namespace }}]
                {{- end }}
          # Alertmanager's own notification counters, per integration, so vmalert can alert when a receiver
          # fails to deliver. Only these two series are kept.
          prometheus/alertmanager:
            config:
              scrape_configs:
                - job_name: alertmanager
                  scrape_interval: 30s
                  static_configs:
                    - targets: ['{{ include "common.serviceAddress" (list $ "alertmanager") | trimPrefix "http://" | trimPrefix "https://" }}']
                  metric_relabel_configs:
                    - source_labels: [__name__]
                      regex: alertmanager_notifications(_failed)?_total
                      action: keep
          # The pipeline's own health, for the Stack health dashboard and vmalert's pipeline rules: this
          # collector's telemetry, every ClickHouse replica's Prometheus endpoint, and Cerberus. Each job keeps
          # only the series a panel or rule reads.
          prometheus/stack:
            config:
              scrape_configs:
                - job_name: otel-collector
                  scrape_interval: 30s
                  static_configs:
                    - targets: ['${env:MY_POD_IP}:8888']
                  metric_relabel_configs:
                    - source_labels: [__name__]
                      regex: otelcol_(receiver_(accepted|refused|failed)_.*|exporter_(sent|send_failed|enqueue_failed)_.*|exporter_queue_(size|capacity)|processor_memory_limiter_refused_.*|process_memory_rss|process_runtime_heap_alloc_bytes)
                      action: keep
                - job_name: clickhouse
                  scrape_interval: 30s
                  kubernetes_sd_configs:
                    - role: pod
                      namespaces:
                        names: ['{{ .Release.Namespace }}']
                      selectors:
                        - role: pod
                          label: clickhouse.altinity.com/chi=otel
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_ip]
                      replacement: $$1:9363
                      target_label: __address__
                    - source_labels: [__meta_kubernetes_pod_name]
                      target_label: k8s_pod_name
                  metric_relabel_configs:
                    - source_labels: [__name__]
                      regex: ClickHouse(ProfileEvents_(InsertQuery|FailedInsertQuery|InsertedRows|InsertedBytes|SelectQuery|FailedSelectQuery)|Metrics_(MemoryTracking|Query|BackgroundMergesAndMutationsPoolTask)|AsyncMetrics_(MaxPartCountForPartition|MemoryResident|CGroupMemoryUsed|CGroupMemoryTotal)|ErrorMetric_(MEMORY_LIMIT_EXCEEDED|TOO_MANY_PARTS))
                      action: keep
                - job_name: cerberus
                  scrape_interval: 30s
                  static_configs:
                    - targets: ['{{ include "common.serviceAddress" (list $ "cerberus") | trimPrefix "http://" | trimPrefix "https://" }}']
                  metric_relabel_configs:
                    - source_labels: [__name__]
                      regex: http_server_request_duration_seconds_(bucket|count|sum)|cerberus_queries_total
                      action: keep
                - job_name: garmr
                  scrape_interval: 30s
                  static_configs:
                    - targets: ['{{ include "common.serviceAddress" (list $ "garmr") | trimPrefix "http://" | trimPrefix "https://" }}']
                  metric_relabel_configs:
                    - source_labels: [__name__]
                      regex: garmr_.+
                      action: keep
          # Alertmanager's history receiver posts every notification here (global.services.alertHistory).
          webhook_event:
            endpoint: 0.0.0.0:8088
            path: /alertmanager
          # OTLP listens on every interface in the pod, not just the pod IP, because
          # kubectl port-forward (make cluster/port-forward) connects to localhost inside the pod.
          otlp:
            protocols:
              grpc:
                {{- if $auth }}
                auth:
                  authenticator: bearertokenauth
                {{- end }}
                endpoint: 0.0.0.0:4317
              http:
                {{- if $auth }}
                auth:
                  authenticator: bearertokenauth
                {{- end }}
                endpoint: 0.0.0.0:4318
          {{- with $collector.extraReceivers }}
          {{- toYaml . | nindent 2 }}
          {{- end }}
        service:
          extensions:
          {{- if $auth }}
          - bearertokenauth
          {{- end }}
          - health_check
          - k8s_leader_elector
          pipelines:
            logs:
              exporters:
              - clickhouse
              {{- range dig "logs" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - k8sattributes
              - batch
              {{- range dig "logs" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              {{- range dig "logs" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
            logs/alertmanager:
              exporters:
              - clickhouse
              processors:
              - memory_limiter
              - transform/alertmanager
              - batch
              receivers:
              - webhook_event
            logs/kubernetes-events:
              exporters:
              - clickhouse
              processors:
              - memory_limiter
              - transform/kubernetes-events
              - batch
              receivers:
              - k8sobjects
            metrics:
              exporters:
              - clickhouse
              {{- range dig "metrics" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - k8sattributes
              - batch
              {{- range dig "metrics" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              {{- if $kubelet }}
              - kubeletstats
              {{- end }}
              - k8s_cluster
              - spanmetrics
              - servicegraph
              - prometheus/alertmanager
              - prometheus/stack
              {{- range dig "metrics" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
            traces:
              exporters:
              - clickhouse
              - spanmetrics
              - servicegraph
              {{- range dig "traces" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - k8sattributes
              - batch
              {{- range dig "traces" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              {{- range dig "traces" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
          telemetry:
            metrics:
              readers:
              - pull:
                  exporter:
                    prometheus:
                      host: ${env:MY_POD_IP}
                      port: 8888

# kubeletstats authenticates to the kubelet with this ServiceAccount's token, in the gateway or the agent,
# and k8sattributes to the API server, where it watches pods, namespaces and (for deployment names)
# replicasets. k8s_cluster lists and watches the workload kinds it reports, and holds its Lease here.
#
# rbac.scope: namespace is for a namespace that forbids cluster-scoped RBAC. No ClusterRole or
# ClusterRoleBinding is rendered; the Role grants namespaceRules, the namespaced part of clusterRules, in
# the release namespace only. relay.yaml follows the same key: k8sattributes, k8s_cluster and k8sobjects
# watch only the release namespace, and kubeletstats is off, because the kubelet's nodes/stats is
# cluster-scoped. The agent needs nodes/stats too, so the render fails if it is on. The README's
# "Collector RBAC: cluster-wide or one namespace" lists what is lost.
serviceAccount:
  automountToken: true

rbac:
  scope: cluster
  clusterRules:
    - apiGroups: [""]
      resources: [nodes/stats]
      verbs: [get]
    - apiGroups: [""]
      resources: [nodes, namespaces]
      verbs: [get, list, watch]
    - &coreRule
      apiGroups: [""]
      resources: [pods, services, replicationcontrollers, resourcequotas]
      verbs: [get, list, watch]
    - &appsRule
      apiGroups: [apps]
      resources: [replicasets, deployments, daemonsets, statefulsets]
      verbs: [get, list, watch]
    - &batchRule
      apiGroups: [batch]
      resources: [jobs, cronjobs]
      verbs: [get, list, watch]
    - &autoscalingRule
      apiGroups: [autoscaling]
      resources: [horizontalpodautoscalers]
      verbs: [get, list, watch]
    - &eventsRule
      apiGroups: [events.k8s.io]
      resources: [events]
      verbs: [list, watch]
  namespaceRules:
    - *coreRule
    - *appsRule
    - *batchRule
    - *autoscalingRule
    - *eventsRule
  rules:
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, list, watch, create, update, patch]

service:
  enabled: true
  ports:
    otlp:
      port: 4317
      appProtocol: grpc
    otlp-http:
      port: 4318
    alertmanager:
      port: 8088
      appProtocol: http

# With global.mesh: kubernetes and global.exposure.enabled, an Ingress routes global.exposure.hosts.otlp
# to OTLP over HTTP. gRPC isn't exposed outside the cluster.
exposure:
  host: otlp
  port: otlp-http

deployment:
  enabled: true
  containers:
    otel-collector:
      image: &image
        repository: otel/opentelemetry-collector-contrib
        tag: "0.161.0"
      args:
        - --config=/conf/relay.yaml
      ports:
        otlp:
          containerPort: 4317
        otlp-http:
          containerPort: 4318
        alertmanager:
          containerPort: 8088
      env:
        MY_POD_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        K8S_NODE_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        GOMEMLIMIT: 204MiB
      secretEnv:
        CLICKHOUSE_PASSWORD:
          secret: clickhouse-writer
          key: password
      livenessProbe: &probe
        httpGet:
          path: /
          port: 13133
      readinessProbe: *probe
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      volumeMounts:
        - name: config
          mountPath: /conf
  volumes:
    config:
      configMap:
        name: '{{ include "common.fullname" . }}'

# The agent: kubeletstats only, one pod per node. Its own name label keeps it off the otel-collector
# Service, since it has no OTLP receiver, and apart from the gateway's selector.
daemonset:
  enabled: false
  selectorLabels:
    app.kubernetes.io/name: otel-collector-agent
  containers:
    otel-collector:
      image: *image
      args:
        - --config=env:OTELCOL_AGENT_CONFIG
      env:
        MY_POD_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        K8S_NODE_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        K8S_NODE_NAME:
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        GOMEMLIMIT: 102MiB
        OTELCOL_AGENT_CONFIG: |-
          exporters:
            clickhouse:
              create_schema: false
              database: otel
              endpoint: tcp://{{ include "common.serviceAddress" (list $ "clickhouse") }}?dial_timeout=10s
              password: {{ if include "common.vaultEnabled" . }}${file:{{ include "common.secretFile" (list . "otel-collector" "CLICKHOUSE_PASSWORD") }}}{{ else }}${env:CLICKHOUSE_PASSWORD}{{ end }}
              retry_on_failure:
                enabled: true
                max_elapsed_time: 5m
              sending_queue:
                enabled: true
              timeout: 10s
              username: otel_writer
          extensions:
            health_check:
              endpoint: ${env:MY_POD_IP}:13133
          processors:
            batch: {}
            # Adds the owning deployment, statefulset or daemonset to pod and container metrics, watching
            # only this node's pods.
            k8sattributes:
              auth_type: serviceAccount
              filter:
                node_from_env_var: K8S_NODE_NAME
              extract:
                metadata:
                - k8s.deployment.name
                - k8s.statefulset.name
                - k8s.daemonset.name
              pod_association:
              - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
          receivers:
            kubeletstats:
              auth_type: serviceAccount
              collection_interval: 30s
              endpoint: https://${env:K8S_NODE_IP}:10250
              insecure_skip_verify: {{ dig "agent" "kubelet" "insecureSkipVerify" false (.Values.collector | default dict) }}
              metric_groups: [node, pod, container, volume]
          service:
            extensions:
            - health_check
            pipelines:
              metrics:
                exporters:
                - clickhouse
                processors:
                - memory_limiter
                - k8sattributes
                - batch
                receivers:
                - kubeletstats
            telemetry:
              metrics:
                readers:
                - pull:
                    exporter:
                      prometheus:
                        host: ${env:MY_POD_IP}
                        port: 8888
      secretEnv:
        CLICKHOUSE_PASSWORD:
          secret: clickhouse-writer
          key: password
      livenessProbe: *probe
      readinessProbe: *probe
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

# With global.networkPolicy.enabled: one policy for the gateway and the agent. Any pod in the cluster may
# send OTLP (which includes the ingress gateway or controller for exposed OTLP), and Alertmanager posts its
# notifications to 8088; the collector reaches Alertmanager on 9093 and Cerberus on 8080 for their metrics,
# ClickHouse on 9000 and its metrics on 9363, each node's kubelet on 10250 for kubeletstats, and the API server for k8sattributes.
networkPolicy:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - '{{ include "common.fullname" . }}'
          - '{{ include "common.fullname" . }}-agent'
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 8088
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: otel
      ports:
        - port: 9000
          protocol: TCP
        - port: 9363
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cerberus
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garmr
      ports:
        - port: 8080
          protocol: TCP
    - ports:
        - port: 10250
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
          protocol: TCP

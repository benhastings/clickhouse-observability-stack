# cspell:words bearertokenauth
# relay.yaml is one string template, not a map, so it can append the extras below to the default
# pipelines. That means an environment can no longer deep-merge a single nested key into it:
#   - add a receiver with collector.extraReceivers.<name>, which is appended under receivers:
#   - wire it in with collector.extraPipelines.<traces|metrics|logs>.<receivers|processors|exporters>,
#     whose entries are appended to that default pipeline's list
#   - or set configMaps.main.data.relay.yaml to a whole new string to own the file.
# For example:
#   collector:
#     extraReceivers:
#       syslog:
#         tcp:
#           listen_address: ${env:MY_POD_IP}:54527
#     extraPipelines:
#       logs:
#         receivers: [syslog]
#
# collector.auth.enabled makes the OTLP receiver require a bearer token on both gRPC and HTTP, checked by
# the bearertokenauth extension against ${env:OTLP_BEARER_TOKEN}. The token is never in git: an
# environment that turns auth on pre-creates the Secret otel-collector-auth with key token (or sets
# secrets.auth.create: true with stringData.token, local only) and adds this to the collector's env:
#   deployment:
#     containers:
#       otel-collector:
#         env:
#           OTLP_BEARER_TOKEN:
#             valueFrom:
#               secretKeyRef:
#                 name: otel-collector-auth
#                 key: token
# Clients then send "Authorization: Bearer <token>".
collector:
  auth:
    enabled: false
  extraReceivers: {}
  extraPipelines: {}

secrets:
  auth:
    create: false

# The kubeletstats receiver reads CPU, memory, filesystem and network for the node, every pod and
# every container from this node's kubelet. A Deployment only reaches its own node, which is the
# whole cluster on kind; a multi-node cluster needs a DaemonSet of collectors for it. The kubelet's
# serving certificate is self-signed on kind, hence insecure_skip_verify.
configMaps:
  main:
    data:
      relay.yaml: |-
        {{- $collector := .Values.collector | default dict }}
        {{- $pipelines := $collector.extraPipelines | default dict }}
        {{- $auth := dig "auth" "enabled" false $collector -}}
        connectors:
          servicegraph:
            latency_histogram_buckets:
            - 10ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2.5s
            - 5s
            store:
              max_items: 10000
              ttl: 5s
          spanmetrics:
            dimensions:
            - name: http.request.method
            - name: http.response.status_code
            - name: http.route
            exemplars:
              enabled: true
            histogram:
              explicit:
                buckets:
                - 5ms
                - 10ms
                - 25ms
                - 50ms
                - 100ms
                - 250ms
                - 500ms
                - 1s
                - 2.5s
                - 5s
                - 10s
              unit: ms
            metrics_flush_interval: 15s
        exporters:
          clickhouse:
            create_schema: false
            database: otel
            endpoint: tcp://clickhouse:9000?dial_timeout=10s
            password: ${env:CLICKHOUSE_PASSWORD}
            retry_on_failure:
              enabled: true
              max_elapsed_time: 5m
            sending_queue:
              enabled: true
            timeout: 10s
            username: otel
        extensions:
          {{- if $auth }}
          bearertokenauth:
            token: ${env:OTLP_BEARER_TOKEN}
          {{- end }}
          health_check:
            endpoint: ${env:MY_POD_IP}:13133
        processors:
          batch: {}
          memory_limiter:
            check_interval: 5s
            limit_percentage: 80
            spike_limit_percentage: 25
        receivers:
          kubeletstats:
            auth_type: serviceAccount
            collection_interval: 30s
            endpoint: https://${env:K8S_NODE_IP}:10250
            insecure_skip_verify: true
          otlp:
            protocols:
              grpc:
                {{- if $auth }}
                auth:
                  authenticator: bearertokenauth
                {{- end }}
                endpoint: ${env:MY_POD_IP}:4317
              http:
                {{- if $auth }}
                auth:
                  authenticator: bearertokenauth
                {{- end }}
                endpoint: ${env:MY_POD_IP}:4318
          {{- with $collector.extraReceivers }}
          {{- toYaml . | nindent 2 }}
          {{- end }}
        service:
          extensions:
          {{- if $auth }}
          - bearertokenauth
          {{- end }}
          - health_check
          pipelines:
            logs:
              exporters:
              - clickhouse
              {{- range dig "logs" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - batch
              {{- range dig "logs" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              {{- range dig "logs" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
            metrics:
              exporters:
              - clickhouse
              {{- range dig "metrics" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - batch
              {{- range dig "metrics" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              - kubeletstats
              - spanmetrics
              - servicegraph
              {{- range dig "metrics" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
            traces:
              exporters:
              - clickhouse
              - spanmetrics
              - servicegraph
              {{- range dig "traces" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - batch
              {{- range dig "traces" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              {{- range dig "traces" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
          telemetry:
            metrics:
              readers:
              - pull:
                  exporter:
                    prometheus:
                      host: ${env:MY_POD_IP}
                      port: 8888

# kubeletstats authenticates to the kubelet with this ServiceAccount's token.
serviceAccount:
  automountToken: true

rbac:
  clusterRules:
    - apiGroups: [""]
      resources: [nodes/stats]
      verbs: [get]

service:
  enabled: true
  ports:
    otlp:
      port: 4317
      appProtocol: grpc
    otlp-http:
      port: 4318

deployment:
  enabled: true
  containers:
    otel-collector:
      image:
        repository: otel/opentelemetry-collector-contrib
        tag: "0.161.0"
      args:
        - --config=/conf/relay.yaml
      ports:
        otlp:
          containerPort: 4317
        otlp-http:
          containerPort: 4318
      env:
        MY_POD_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        K8S_NODE_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        GOMEMLIMIT: 204MiB
        CLICKHOUSE_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: password
      livenessProbe:
        httpGet:
          path: /
          port: 13133
      readinessProbe:
        httpGet:
          path: /
          port: 13133
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      volumeMounts:
        - name: config
          mountPath: /conf
  volumes:
    config:
      configMap:
        name: '{{ include "common.fullname" . }}'

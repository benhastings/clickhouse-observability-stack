# cspell:words bearertokenauth
# relay.yaml is one string template, not a map, so it can append the extras below to the default
# pipelines. That means an environment can no longer deep-merge a single nested key into it:
#   - add a receiver with collector.extraReceivers.<name>, which is appended under receivers:
#   - wire it in with collector.extraPipelines.<traces|metrics|logs>.<receivers|processors|exporters>,
#     whose entries are appended to that default pipeline's list
#   - or set configMaps.main.data.relay.yaml to a whole new string to own the file.
# For example:
#   collector:
#     extraReceivers:
#       syslog:
#         tcp:
#           listen_address: ${env:MY_POD_IP}:54527
#     extraPipelines:
#       logs:
#         receivers: [syslog]
#
# collector.auth.enabled makes the OTLP receiver require a bearer token on both gRPC and HTTP, checked by
# the bearertokenauth extension against ${env:OTLP_BEARER_TOKEN}. The token is never in git: an
# environment that turns auth on pre-creates the Secret otel-collector-auth with key token (or sets
# secrets.auth.create: true with stringData.token, local only) and adds this to the collector's env:
#   deployment:
#     containers:
#       otel-collector:
#         env:
#           OTLP_BEARER_TOKEN:
#             valueFrom:
#               secretKeyRef:
#                 name: otel-collector-auth
#                 key: token
# Clients then send "Authorization: Bearer <token>".
#
# Exposing the collector outside the cluster (global.exposure.enabled) requires auth: the render fails
# unless collector.auth.enabled is set, or collector.auth.allowUnauthenticatedExposure is set for a
# collector that only a private network can reach.
#
# The collector runs as two workloads. The gateway, the Deployment below, receives OTLP, runs the
# spanmetrics and servicegraph connectors (which keep counters in memory, so want a single writer) and
# writes to ClickHouse. The agent, the DaemonSet below, runs only kubeletstats, so every node's kubelet
# is scraped. The agent is off: a Deployment only reaches the kubelet of the node it landed on, which
# is the whole cluster on kind, so until the agent is on the gateway scrapes kubeletstats itself.
# common reads daemonset.enabled literally, so a site turns the agent on with both keys; the render
# fails when they disagree:
#   collector:
#     agent:
#       enabled: true
#   daemonset:
#     enabled: true
# The gateway then drops kubeletstats. The agent's config is the OTELCOL_AGENT_CONFIG env var rather
# than a ConfigMap key, so it adds nothing to the render while it is off.
#
# kubeletstats verifies the kubelet's serving certificate unless agent.kubelet.insecureSkipVerify is
# true. Only values-local.yaml sets it, because kind's kubelet certificate is self-signed.
collector:
  auth:
    enabled: false
    allowUnauthenticatedExposure: false
  extraReceivers: {}
  extraPipelines: {}
  agent:
    enabled: false
    kubelet:
      insecureSkipVerify: false

secrets:
  auth:
    create: false

# The kubeletstats receiver reads CPU, memory, filesystem and network for the node, every pod and
# every container from this node's kubelet. The gateway runs it only while the agent is off.
configMaps:
  main:
    data:
      relay.yaml: |-
        {{- $collector := .Values.collector | default dict }}
        {{- $pipelines := $collector.extraPipelines | default dict }}
        {{- $auth := dig "auth" "enabled" false $collector }}
        {{- $agent := dig "agent" "enabled" false $collector }}
        {{- if ne $agent (dig "daemonset" "enabled" false .Values.AsMap) }}
        {{- fail "collector.agent.enabled and daemonset.enabled must be set together" }}
        {{- end }}
        {{- $exposed := and (dig "global" "exposure" "enabled" false .Values.AsMap) (dig "exposure" "host" "" .Values.AsMap) }}
        {{- if and $exposed (not $auth) (not (dig "auth" "allowUnauthenticatedExposure" false $collector)) }}
        {{- fail "global.exposure.enabled puts the collector outside the cluster: set collector.auth.enabled, or collector.auth.allowUnauthenticatedExposure for a private network" }}
        {{- end -}}
        connectors:
          servicegraph:
            latency_histogram_buckets:
            - 10ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2.5s
            - 5s
            store:
              max_items: 10000
              ttl: 5s
          spanmetrics:
            dimensions:
            - name: http.request.method
            - name: http.response.status_code
            - name: http.route
            exemplars:
              enabled: true
            histogram:
              explicit:
                buckets:
                - 5ms
                - 10ms
                - 25ms
                - 50ms
                - 100ms
                - 250ms
                - 500ms
                - 1s
                - 2.5s
                - 5s
                - 10s
              unit: ms
            metrics_flush_interval: 15s
        exporters:
          clickhouse:
            create_schema: false
            database: otel
            endpoint: tcp://clickhouse:9000?dial_timeout=10s
            password: ${env:CLICKHOUSE_PASSWORD}
            retry_on_failure:
              enabled: true
              max_elapsed_time: 5m
            sending_queue:
              enabled: true
            timeout: 10s
            username: otel
        extensions:
          {{- if $auth }}
          bearertokenauth:
            token: ${env:OTLP_BEARER_TOKEN}
          {{- end }}
          health_check:
            endpoint: ${env:MY_POD_IP}:13133
        processors:
          batch: {}
          memory_limiter:
            check_interval: 5s
            limit_percentage: 80
            spike_limit_percentage: 25
        receivers:
          {{- if not $agent }}
          kubeletstats:
            auth_type: serviceAccount
            collection_interval: 30s
            endpoint: https://${env:K8S_NODE_IP}:10250
            insecure_skip_verify: {{ dig "agent" "kubelet" "insecureSkipVerify" false $collector }}
          {{- end }}
          # OTLP listens on every interface in the pod, not just the pod IP, because
          # kubectl port-forward (make cluster/port-forward) connects to localhost inside the pod.
          otlp:
            protocols:
              grpc:
                {{- if $auth }}
                auth:
                  authenticator: bearertokenauth
                {{- end }}
                endpoint: 0.0.0.0:4317
              http:
                {{- if $auth }}
                auth:
                  authenticator: bearertokenauth
                {{- end }}
                endpoint: 0.0.0.0:4318
          {{- with $collector.extraReceivers }}
          {{- toYaml . | nindent 2 }}
          {{- end }}
        service:
          extensions:
          {{- if $auth }}
          - bearertokenauth
          {{- end }}
          - health_check
          pipelines:
            logs:
              exporters:
              - clickhouse
              {{- range dig "logs" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - batch
              {{- range dig "logs" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              {{- range dig "logs" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
            metrics:
              exporters:
              - clickhouse
              {{- range dig "metrics" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - batch
              {{- range dig "metrics" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              {{- if not $agent }}
              - kubeletstats
              {{- end }}
              - spanmetrics
              - servicegraph
              {{- range dig "metrics" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
            traces:
              exporters:
              - clickhouse
              - spanmetrics
              - servicegraph
              {{- range dig "traces" "exporters" list $pipelines }}
              - {{ . }}
              {{- end }}
              processors:
              - memory_limiter
              - batch
              {{- range dig "traces" "processors" list $pipelines }}
              - {{ . }}
              {{- end }}
              receivers:
              - otlp
              {{- range dig "traces" "receivers" list $pipelines }}
              - {{ . }}
              {{- end }}
          telemetry:
            metrics:
              readers:
              - pull:
                  exporter:
                    prometheus:
                      host: ${env:MY_POD_IP}
                      port: 8888

# kubeletstats authenticates to the kubelet with this ServiceAccount's token, in the gateway or the agent.
serviceAccount:
  automountToken: true

rbac:
  clusterRules:
    - apiGroups: [""]
      resources: [nodes/stats]
      verbs: [get]

service:
  enabled: true
  ports:
    otlp:
      port: 4317
      appProtocol: grpc
    otlp-http:
      port: 4318

# With global.mesh: kubernetes and global.exposure.enabled, an Ingress routes global.exposure.hosts.otlp
# to OTLP over HTTP. gRPC isn't exposed outside the cluster.
exposure:
  host: otlp
  port: otlp-http

deployment:
  enabled: true
  containers:
    otel-collector:
      image: &image
        repository: otel/opentelemetry-collector-contrib
        tag: "0.161.0"
      args:
        - --config=/conf/relay.yaml
      ports:
        otlp:
          containerPort: 4317
        otlp-http:
          containerPort: 4318
      env:
        MY_POD_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        K8S_NODE_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        GOMEMLIMIT: 204MiB
        CLICKHOUSE_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: password
      livenessProbe: &probe
        httpGet:
          path: /
          port: 13133
      readinessProbe: *probe
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      volumeMounts:
        - name: config
          mountPath: /conf
  volumes:
    config:
      configMap:
        name: '{{ include "common.fullname" . }}'

# The agent: kubeletstats only, one pod per node. Its own name label keeps it off the otel-collector
# Service, since it has no OTLP receiver, and apart from the gateway's selector.
daemonset:
  enabled: false
  selectorLabels:
    app.kubernetes.io/name: otel-collector-agent
  containers:
    otel-collector:
      image: *image
      args:
        - --config=env:OTELCOL_AGENT_CONFIG
      env:
        MY_POD_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        K8S_NODE_IP:
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        GOMEMLIMIT: 102MiB
        CLICKHOUSE_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: clickhouse-credentials
              key: password
        OTELCOL_AGENT_CONFIG: |-
          exporters:
            clickhouse:
              create_schema: false
              database: otel
              endpoint: tcp://clickhouse:9000?dial_timeout=10s
              password: ${env:CLICKHOUSE_PASSWORD}
              retry_on_failure:
                enabled: true
                max_elapsed_time: 5m
              sending_queue:
                enabled: true
              timeout: 10s
              username: otel
          extensions:
            health_check:
              endpoint: ${env:MY_POD_IP}:13133
          processors:
            batch: {}
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
          receivers:
            kubeletstats:
              auth_type: serviceAccount
              collection_interval: 30s
              endpoint: https://${env:K8S_NODE_IP}:10250
              insecure_skip_verify: {{ dig "agent" "kubelet" "insecureSkipVerify" false (.Values.collector | default dict) }}
          service:
            extensions:
            - health_check
            pipelines:
              metrics:
                exporters:
                - clickhouse
                processors:
                - memory_limiter
                - batch
                receivers:
                - kubeletstats
            telemetry:
              metrics:
                readers:
                - pull:
                    exporter:
                      prometheus:
                        host: ${env:MY_POD_IP}
                        port: 8888
      livenessProbe: *probe
      readinessProbe: *probe
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

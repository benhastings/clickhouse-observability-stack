# yaml-language-server: $schema=values.schema.json
# Keeps silences and the notification log across pod restarts, so a restart neither drops a silence nor
# sends again what was already sent. Off by default, so the pod uses an emptyDir and no PersistentVolumeClaim
# exists. When on, objects.data renders the claim and the data volume below mounts it at /alertmanager.
persistence:
  enabled: false
  size: 256Mi
  storageClassName: ""

# alertmanager.yml. Every alert goes to the default receiver, which has no integrations: it is grouped,
# shown in the UI and API, and sent nowhere. An environment adds receivers by replacing route and receivers
# under applications.alertmanager.values (lists replace whole). A receiver outside the cluster also needs
# an egress rule under networkPolicy.egress when global.networkPolicy.enabled.
configMaps:
  config:
    data:
      alertmanager.yml:
        route:
          receiver: default
          group_by: [alertname, service_name]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        receivers:
          - name: default

service:
  enabled: true
  ports:
    http:
      port: 9093
      targetPort: http
      appProtocol: http

# A Deployment can't take volumeClaimTemplates, so the claim is its own object. The string renders to
# nothing, and common skips it, unless persistence.enabled; '--{{ "-" }}' keeps it a plain YAML scalar.
objects:
  data: '--{{ "-" }}{{ if .Values.persistence.enabled }}{{ tpl (.Files.Get "files/data-pvc.yaml.tpl") . }}{{ end }}'

deployment:
  enabled: true
  # One replica, so the two pods of a rolling update never both hold the claim or both notify.
  strategy:
    type: Recreate
  podSecurityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    alertmanager:
      image:
        repository: quay.io/prometheus/alertmanager
        tag: "v0.34.1"
      args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        # One replica, so no gossip cluster: with an empty address Alertmanager doesn't listen on 9094.
        - --cluster.listen-address=
      ports:
        http:
          containerPort: 9093
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /-/ready
          port: http
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: data
          mountPath: /alertmanager
  volumes:
    config:
      configMap:
        name: '{{ include "common.fullname" . }}-config'
    # An emptyDir unless persistence.enabled, then the claim that objects.data renders.
    data: |-
      {{- if .Values.persistence.enabled }}
      persistentVolumeClaim:
        claimName: {{ include "common.fullname" . }}-data
      {{- else }}
      emptyDir: {}
      {{- end }}

# With global.networkPolicy.enabled: only Grafana reaches Alertmanager, and Alertmanager reaches nothing but
# DNS until a receiver needs it.
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9093
          protocol: TCP

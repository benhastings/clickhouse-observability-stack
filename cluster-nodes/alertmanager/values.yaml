# yaml-language-server: $schema=values.schema.json
# Keeps silences and the notification log across pod restarts, so a restart neither drops a silence nor
# sends again what was already sent. Off by default, so the pod uses an emptyDir and no PersistentVolumeClaim
# exists. When on, objects.data renders the claim and the data volume below mounts it at /alertmanager.
persistence:
  enabled: false
  size: 256Mi
  storageClassName: ""

# alertmanager.yml. Every alert goes to the default receiver, which has no integrations: it is grouped,
# shown in the UI and API, and sent nowhere. Every alert also goes to the history receiver first, which
# posts each notification to the collector, so it is kept in otel_logs as a log of service alertmanager.
# History groups by every label ('...'), so each notification is one alert, and its continue: true lets the
# alert carry on to the routes after it; the last route catches whatever is left for default.
#
# An environment adds receivers by replacing route and receivers under applications.alertmanager.values.
# Lists replace whole, so keep the history route first in route.routes and the history receiver in
# receivers. A receiver outside the cluster also needs an egress rule under networkPolicy.egress when
# global.networkPolicy.enabled.
configMaps:
  config:
    data:
      alertmanager.yml:
        route:
          receiver: default
          group_by: [alertname, service_name]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: history
              group_by: ['...']
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 168h
              continue: true
            # An alert that matched a route above is not sent to this route's own receiver, so the last route
            # sends everything that got this far to default.
            - receiver: default
        receivers:
          - name: default
          - name: history
            webhook_configs:
              - url: '{{ include "common.serviceAddress" (list $ "alertHistory") }}'
                send_resolved: true
                max_alerts: 1

service:
  enabled: true
  ports:
    http:
      port: 9093
      targetPort: http
      appProtocol: http

# A Deployment can't take volumeClaimTemplates, so the claim is its own object. The string renders to
# nothing, and common skips it, unless persistence.enabled; '--{{ "-" }}' keeps it a plain YAML scalar.
objects:
  data: '--{{ "-" }}{{ if .Values.persistence.enabled }}{{ tpl (.Files.Get "files/data-pvc.yaml.tpl") . }}{{ end }}'

deployment:
  enabled: true
  # One replica, so the two pods of a rolling update never both hold the claim or both notify.
  strategy:
    type: Recreate
  podSecurityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    alertmanager:
      image:
        repository: quay.io/prometheus/alertmanager
        tag: "v0.34.1"
      args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        # One replica, so no gossip cluster: with an empty address Alertmanager doesn't listen on 9094.
        - --cluster.listen-address=
      ports:
        http:
          containerPort: 9093
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /-/ready
          port: http
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: data
          mountPath: /alertmanager
  volumes:
    config:
      configMap:
        name: '{{ include "common.fullname" . }}-config'
    # An emptyDir unless persistence.enabled, then the claim that objects.data renders.
    data: |-
      {{- if .Values.persistence.enabled }}
      persistentVolumeClaim:
        claimName: {{ include "common.fullname" . }}-data
      {{- else }}
      emptyDir: {}
      {{- end }}

# With global.networkPolicy.enabled: only the rule evaluators, Grafana and vmalert, reach Alertmanager, and
# Alertmanager reaches only the collector, for the history receiver, until another receiver needs more.
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [grafana, vmalert]
      ports:
        - port: 9093
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 8088
          protocol: TCP

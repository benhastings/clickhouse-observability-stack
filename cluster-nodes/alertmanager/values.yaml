# yaml-language-server: $schema=values.schema.json
# Keeps silences and the notification log across pod restarts, so a restart neither drops a silence nor
# sends again what was already sent. Off by default, so the pod uses an emptyDir and no PersistentVolumeClaim
# exists. When on, objects.data renders the claim and the data volume below mounts it at /alertmanager.
persistence:
  enabled: false
  size: 256Mi
  storageClassName: ""

# Where alerts go, after the stack's own routes, which files/alertmanager.yml.tpl always puts first: history
# (every notification kept in otel_logs), heartbeat (vmalert's Watchdog, for a dead man's switch), garmr with
# garmr.enabled and, with slack.enabled, Slack. Everything else goes to the default receiver, which has no integrations: it is grouped,
# shown in the UI and API, and sent nowhere. An environment adds receivers under receivers and routes under
# route.routes (lists replace whole); a receiver outside the cluster also needs an egress rule under
# networkPolicy.egress when global.networkPolicy.enabled.
route:
  receiver: default
  group_by: [alertname, service_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes: []
receivers:
  - name: default

# Every alert but the Watchdog also goes to garmr serve (the garmr node), which keeps an incident per alert group in
# ClickHouse and, with its own slack.enabled, a Slack thread each. Turn Alertmanager's slack off when garmr's is on.
garmr:
  enabled: true

# One Slack thread per alert group: the first notification posts a message, later ones (more alerts firing,
# resolved) reply in its thread, and the message itself is kept current. Needs a Slack app's bot token
# (chat:write, invited to the channel) in the Secret alertmanager-slack, key app-token, which is never
# created here, and an Alertmanager with post_updates_to_thread: released after v0.34.1, so until then an
# environment that turns this on also sets the image (make dev/slack does). Every alert but the Watchdog
# goes to Slack; the stack's AlertmanagerNotificationsFailing for Slack itself goes to route.receiver.
slack:
  enabled: false
  channel: ""

secrets:
  slack:
    create: false

configMaps:
  config:
    data:
      alertmanager.yml: '{{ tpl (.Files.Get "files/alertmanager.yml.tpl") . }}'
  # Message templates, loaded as they are (not templated): {{ ... }} in them is Alertmanager's.
  templates:
    files: files/templates/*.tmpl

service:
  enabled: true
  ports:
    http:
      port: 9093
      targetPort: http
      appProtocol: http

# A Deployment can't take volumeClaimTemplates, so the claim is its own object. The string renders to
# nothing, and common skips it, unless persistence.enabled; '--{{ "-" }}' keeps it a plain YAML scalar.
objects:
  data: '--{{ "-" }}{{ if .Values.persistence.enabled }}{{ tpl (.Files.Get "files/data-pvc.yaml.tpl") . }}{{ end }}'

deployment:
  enabled: true
  # One replica, so the two pods of a rolling update never both hold the claim or both notify.
  strategy:
    type: Recreate
  podSecurityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    alertmanager:
      image:
        repository: quay.io/prometheus/alertmanager
        tag: "v0.34.1"
      args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        # One replica, so no gossip cluster: with an empty address Alertmanager doesn't listen on 9094.
        - --cluster.listen-address=
      ports:
        http:
          containerPort: 9093
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /-/ready
          port: http
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: data
          mountPath: /alertmanager
        - name: templates
          mountPath: /etc/alertmanager/templates
          readOnly: true
        - name: slack
          mountPath: /etc/alertmanager/slack
          readOnly: true
  volumes:
    config:
      configMap:
        name: '{{ include "common.fullname" . }}-config'
    templates:
      configMap:
        name: '{{ include "common.fullname" . }}-templates'
    # The Slack token when slack.enabled, otherwise empty.
    slack: |-
      {{- if .Values.slack.enabled }}
      secret:
        secretName: {{ include "common.fullname" . }}-slack
      {{- else }}
      emptyDir: {}
      {{- end }}
    # An emptyDir unless persistence.enabled, then the claim that objects.data renders.
    data: |-
      {{- if .Values.persistence.enabled }}
      persistentVolumeClaim:
        claimName: {{ include "common.fullname" . }}-data
      {{- else }}
      emptyDir: {}
      {{- end }}

# With global.networkPolicy.enabled: only the rule evaluators (Grafana and vmalert) and the collector, which
# scrapes its metrics, reach Alertmanager, and garmr, for silences. Alertmanager reaches the collector for the
# history receiver, garmr with garmr.enabled and, with slack.enabled, Slack's API on 443; another receiver outside the cluster adds its own rule.
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [grafana, vmalert, otel-collector, garmr]
      ports:
        - port: 9093
          protocol: TCP
  egress: |-
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 8088
          protocol: TCP
    {{- if .Values.garmr.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garmr
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    {{- if .Values.slack.enabled }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}

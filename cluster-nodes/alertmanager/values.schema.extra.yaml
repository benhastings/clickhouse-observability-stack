# This node's own top-level keys; make generate merges them with helm-templates/common/schema/node.schema.yaml.
properties:
  persistence:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      size: {type: string}
      storageClassName: {type: string}
  route:
    type: object
    required: [receiver]
    properties:
      receiver: {type: string}
      routes: {type: array, items: {type: object}}
  receivers:
    type: array
    items:
      type: object
      required: [name]
      properties:
        name: {type: string}
  slack:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      channel: {type: string}

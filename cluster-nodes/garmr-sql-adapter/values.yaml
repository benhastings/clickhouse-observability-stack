# yaml-language-server: $schema=values.schema.json
# garmr sql-adapter serves /api/v1/query and /api/v1/query_range to vmalert and answers each query by running it
# as ClickHouse SQL, as otel_reader and with readonly=2. The rule contract (a value column, every other column a
# label, {time:DateTime64(3, 'UTC')} bound by the server) is in https://github.com/benhastings/garmr.
configMaps:
  env:
    data:
      CLICKHOUSE_ADDR: '{{ include "common.serviceAddress" (list $ "clickhouse") }}'
      CLICKHOUSE_DATABASE: otel
      CLICKHOUSE_USER: otel_reader
      # An external ClickHouse (global.clickhouse.external) over TLS, verified against the platform's CA bundle and
      # the certificate's name; empty leaves TLS off. garmr reads these from the release that adds ClickHouse TLS
      # (benhastings/garmr), so against an external ClickHouse an older image fails to connect rather than falling
      # back to plaintext.
      CLICKHOUSE_TLS_ENABLED: '{{ if include "common.clickhouseExternal" . }}true{{ else }}false{{ end }}'
      CLICKHOUSE_TLS_CA_FILE: '{{ if include "common.clickhouseExternal" . }}{{ include "common.clickhouseCA" . }}{{ end }}'
      CLICKHOUSE_TLS_SERVER_NAME: '{{ if include "common.clickhouseExternal" . }}{{ .Values.global.clickhouse.tls.serverName }}{{ end }}'
      GARMR_LISTEN_ADDRESS: ":8080"
      GARMR_LOG_FORMAT: json

service:
  enabled: true
  ports:
    http:
      port: 8080
      targetPort: http
      appProtocol: http

deployment:
  enabled: true
  podSecurityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    garmr:
      image:
        repository: ghcr.io/benhastings/garmr
        # The tag and the digest it was published with, so a re-pushed tag can't change what runs.
        tag: "v0.1.0@sha256:e431bf6619f97f280a2e1cb606bf124da0287331de4f207752ef1099febe07b4"
      args:
        - sql-adapter
      ports:
        http:
          containerPort: 8080
      env:
        GOMEMLIMIT: 50331648B
      secretEnv:
        CLICKHOUSE_PASSWORD:
          secret: clickhouse-reader
          key: password
          vault:
            env: CLICKHOUSE_PASSWORD_FILE
      # The external ClickHouse's CA bundle, at CLICKHOUSE_TLS_CA_FILE (global.clickhouse.external only).
      clickhouseCA: true
      envFrom:
        - configMapRef:
            name: '{{ include "common.fullname" . }}-env'
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      # Ready once ClickHouse answers a ping.
      readinessProbe:
        httpGet:
          path: /-/ready
          port: http
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true

# With global.networkPolicy.enabled: only vmalert queries the adapter, and the adapter reaches only ClickHouse.
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
      ports:
        - port: 8080
          protocol: TCP
  # ClickHouse: the operator's pods, or with global.clickhouse.external the service owner's endpoint.
  egress: |-
    {{- include "common.clickhouseEgress" (list . (list 9000)) }}

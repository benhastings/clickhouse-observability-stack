secrets:
  admin:
    create: false

configMaps:
  config:
    data:
      grafana.ini: |
        [analytics]
        check_for_updates = true
        [log]
        mode = console
        [paths]
        data = /var/lib/grafana/
        logs = /var/log/grafana
        plugins = /var/lib/grafana/plugins
        provisioning = /etc/grafana/provisioning
        [plugins]
        ; Only the Drilldown apps, pinned. Grafana adds its default preinstall list
        ; to these; everything on it that isn't bundled in the image is disabled.
        preinstall = grafana-metricsdrilldown-app@2.5.1,grafana-lokiexplore-app@2.6.0,grafana-exploretraces-app@2.2.1
        preinstall_auto_update = false
        disable_plugins = grafana-pyroscope-app,grafana-advisor-app
        [unified_storage]
        index_path = /var/lib/grafana-search/bleve
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus (Cerberus)
            uid: cerberus-prometheus
            type: prometheus
            access: proxy
            url: http://cerberus:8080
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 15s
              exemplarTraceIdDestinations:
                - name: trace_id
                  datasourceUid: cerberus-tempo
          - name: Loki (Cerberus)
            uid: cerberus-loki
            type: loki
            access: proxy
            url: http://cerberus:8080
            editable: false
            jsonData:
              # Every demo log carries the trace_id of the span it was written in, as structured
              # metadata; this turns it into a link to that trace.
              derivedFields:
                - name: TraceID
                  matcherType: label
                  matcherRegex: trace_id
                  datasourceUid: cerberus-tempo
                  url: "$${__value.raw}"
                  urlDisplayLabel: View trace
          - name: Tempo (Cerberus)
            uid: cerberus-tempo
            type: tempo
            access: proxy
            url: http://cerberus:8080
            editable: false
            jsonData:
              serviceMap:
                datasourceUid: cerberus-prometheus
              nodeGraph:
                enabled: true
              tracesToMetrics:
                datasourceUid: cerberus-prometheus
                spanStartTimeShift: "-5m"
                spanEndTimeShift: "5m"
                tags:
                  - key: service.name
                    value: service_name
                queries:
                  - name: Request rate
                    query: sum(rate(traces_span_metrics_calls{$$__tags}[5m]))
                  - name: p95 latency (ms)
                    query: histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_bucket{$$__tags}[5m])))
              # Match on the trace_id log attribute rather than filterByTraceID, which searches
              # the log line for the ID.
              tracesToLogsV2:
                datasourceUid: cerberus-loki
                spanStartTimeShift: "-5m"
                spanEndTimeShift: "5m"
                tags:
                  - key: service.name
                    value: service_name
                customQuery: true
                query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
      dashboards.yaml:
        apiVersion: 1
        providers:
          - name: dashboards
            orgId: 1
            type: file
            folder: Cerberus
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards
  dashboards:
    files: dashboards/*.json

service:
  enabled: true
  ports:
    http:
      port: 80
      targetPort: grafana

objects:
  # Keeps downloaded plugins across restarts. Grafana's database stays in an
  # emptyDir: dashboards live in dashboards/, not in Grafana.
  plugins:
    apiVersion: v1
    kind: PersistentVolumeClaim
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

deployment:
  enabled: true
  # The plugins volume is ReadWriteOnce: stop the old pod before starting the new.
  strategy:
    type: Recreate
  podSecurityContext:
    fsGroup: 472
    runAsGroup: 472
    runAsNonRoot: true
    runAsUser: 472
  containers:
    grafana:
      image:
        repository: docker.io/grafana/grafana
        tag: 13.2.2-distroless
      ports:
        grafana:
          containerPort: 3000
      env:
        GF_SECURITY_ADMIN_USER:
          valueFrom:
            secretKeyRef:
              name: '{{ include "common.fullname" . }}-admin'
              key: admin-user
        GF_SECURITY_ADMIN_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: '{{ include "common.fullname" . }}-admin'
              key: admin-password
        GF_PATHS_DATA: /var/lib/grafana/
        GF_PATHS_LOGS: /var/log/grafana
        GF_PATHS_PLUGINS: /var/lib/grafana/plugins
        GF_PATHS_PROVISIONING: /etc/grafana/provisioning
        GF_UNIFIED_STORAGE_INDEX_PATH: /var/lib/grafana-search/bleve
        GOMEMLIMIT: 345MiB
      # Startup is slow on a small machine; liveness only counts once it's up.
      startupProbe:
        httpGet:
          path: /api/health
          port: grafana
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      livenessProbe:
        httpGet:
          path: /api/health
          port: grafana
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /api/health
          port: grafana
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 384Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: storage
          mountPath: /var/lib/grafana
        - name: plugins
          mountPath: /var/lib/grafana/plugins
        - name: search
          mountPath: /var/lib/grafana-search
  volumes:
    tmp:
      emptyDir: {}
    # Grafana's database is thrown away on restart, and it is small (about 2 MB),
    # so keep it in memory: on a slow disk its 1,400-odd startup migrations take
    # minutes. Plugins sit on their own claim, mounted inside it.
    storage:
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    plugins:
      persistentVolumeClaim:
        claimName: '{{ include "common.fullname" . }}-plugins'
    search:
      emptyDir: {}
    config:
      configMap:
        name: '{{ include "common.fullname" . }}-config'
    dashboards:
      configMap:
        name: '{{ include "common.fullname" . }}-dashboards'

# yaml-language-server: $schema=values.schema.json
# Keeps Grafana's database, users and UI-made changes across pod restarts. Off by default, so the pod
# uses an emptyDir and no PersistentVolumeClaim exists. When on, objects.data renders the claim and the
# storage volume below mounts it at /var/lib/grafana. An empty storageClassName uses the cluster default.
persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""

secrets:
  admin:
    create: false
    # With global.externalSecrets.enabled, synced from <remotePath>/grafana-admin.
    external:
      keys: [admin-user, admin-password]
  # grafana-oauth, key client-secret: the generic OAuth client secret. Never created here; an
  # environment that turns OAuth on pre-creates it (or stores it in Vault) and declares it once:
  #   deployment:
  #     containers:
  #       grafana:
  #         secretEnv:
  #           GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
  #             secret: grafana-oauth
  #             key: client-secret
  # grafana.ini then reads it with $__env{...}, or with $__file{...} when vault.enabled.
  oauth:
    create: false

# Sign-in through any OpenID Connect provider, rendered into grafana.ini below. Off by default;
# an environment turns it on and sets the URLs. Keycloak is the worked example, with
# <realm> standing in for the realm name:
#   authUrl:  https://keycloak.example.com/realms/<realm>/protocol/openid-connect/auth
#   tokenUrl: https://keycloak.example.com/realms/<realm>/protocol/openid-connect/token
#   apiUrl:   https://keycloak.example.com/realms/<realm>/protocol/openid-connect/userinfo
# rootUrl is Grafana's public URL, which the redirect back from the provider must match. Left empty, it is
# the Grafana host under global.exposure (https with a TLS credential, http without). The client
# secret is not set here and never goes in git; see secrets.oauth above.
auth:
  # Hides the username and password form on the login page. Requires genericOauth.enabled, or the
  # render fails. The admin user and its secret are unchanged.
  disableLoginForm: false
  # How long a session lasts before signing in again, for example 7d. Empty keeps Grafana's 30d.
  loginMaximumLifetimeDuration: ""
  genericOauth:
    enabled: false
    rootUrl: ""
    name: Keycloak
    clientId: ""
    authUrl: ""
    tokenUrl: ""
    apiUrl: ""
    scopes: openid email profile
    allowSignUp: true
    # Keycloak realm roles grafana-admin and grafana-editor map to Admin and Editor; anyone else is a Viewer.
    roleAttributePath: "contains(realm_access.roles[*], 'grafana-admin') && 'Admin' || contains(realm_access.roles[*], 'grafana-editor') && 'Editor' || 'Viewer'"
    loginAttributePath: preferred_username
    nameAttributePath: name
    # Empty uses the token's email claim, Grafana's default.
    emailAttributePath: ""
    # A JMESPath to the user's groups, for example groups with Keycloak's group membership mapper. Empty
    # leaves groups unread; roleAttributePath can still test them.
    groupsAttributePath: ""
    # Sends a signed-out user straight to the provider instead of Grafana's login page.
    autoLogin: false
    # Renews the access token with the provider's refresh token, so a session outlives one access token.
    # Some providers issue one only with offline_access in scopes; Keycloak issues one by default.
    useRefreshToken: true
    # A ConfigMap with the CA that signed the provider's certificate, for a provider on a private CA. It is
    # mounted at /etc/grafana/oauth-ca and set as tls_client_ca. Certificate verification is never skipped.
    tlsCaConfigMap: ""
    tlsCaKey: ca.crt

# Put plugins on the grafana-plugins claim; see deployment.volumes.plugins.
pluginsClaim: false

# Starter alert rules, off by default. When on, objects.alerts renders the grafana-alerts ConfigMap,
# which Grafana provisions from /etc/grafana/provisioning/alerting:
#   - errorRatio: the share of server spans that end in an error, per service_name matching serviceName
#   - the collector receiving no spans for 15 minutes
#   - clickhouseDisk: a ClickHouse data volume filling up, from kubeletstats volume metrics. kubelet
#     reports those for CSI-backed volumes; kind's local-path (hostPath) volumes have none, so on kind the
#     rule stays in No Data. vmalert's ClickHouseDiskFilling and ClickHouseDiskFull read ClickHouse's own
#     system.disks instead, in every environment
# Every rule notifies the stack's Alertmanager (global.services.alertmanager) through a contact point named
# stack-alertmanager, so Grafana's alerts are grouped, silenced and routed with vmalert's, on the labels
# severity and service_name. contactPoint replaces it with another Grafana integration, for example
# {name: on-call, type: webhook, settings: {url: https://...}}; keep secrets such as a token out of git
# (Grafana reads $__env{...} and $__file{...} in settings).
alerts:
  enabled: false
  errorRatio:
    serviceName: .+
    threshold: 0.05
    for: 10m
  clickhouseDisk:
    enabled: true
    threshold: 0.85
  contactPoint: {}

configMaps:
  config:
    data:
      grafana.ini: |
        [analytics]
        check_for_updates = true
        [log]
        mode = console
        [paths]
        data = /var/lib/grafana/
        logs = /var/log/grafana
        plugins = /var/lib/grafana/plugins
        provisioning = /etc/grafana/provisioning
        [plugins]
        ; Only the Drilldown apps, pinned. Grafana adds its default preinstall list
        ; to these; everything on it that isn't bundled in the image is disabled.
        preinstall = grafana-metricsdrilldown-app@2.5.1,grafana-lokiexplore-app@2.6.0,grafana-exploretraces-app@2.2.1
        preinstall_auto_update = false
        disable_plugins = grafana-pyroscope-app,grafana-advisor-app
        [unified_storage]
        index_path = /var/lib/grafana-search/bleve
        {{- if or .Values.auth.disableLoginForm .Values.auth.loginMaximumLifetimeDuration }}
        [auth]
        {{- if .Values.auth.disableLoginForm }}
        {{- if not .Values.auth.genericOauth.enabled }}{{ fail "auth.disableLoginForm requires auth.genericOauth.enabled, or nobody can sign in" }}{{ end }}
        disable_login_form = true
        {{- end }}
        {{- with .Values.auth.loginMaximumLifetimeDuration }}
        login_maximum_lifetime_duration = {{ . }}
        {{- end }}
        {{- end }}
        {{- with .Values.auth.genericOauth }}{{ if .enabled }}
        {{- $x := (include "common.values" $ | fromYaml).global.exposure | default dict }}
        {{- $rootUrl := .rootUrl }}
        {{- if and (not $rootUrl) $x.enabled }}
        {{- with index ($x.hosts | default dict) $.Values.exposure.host }}
        {{- $rootUrl = printf "%s://%s/" (ternary "https" "http" (not (empty (dig "tls" "credentialName" "" $x)))) . }}
        {{- end }}
        {{- end }}
        [server]
        root_url = {{ required "auth.genericOauth.rootUrl is required when auth.genericOauth.enabled and global.exposure gives Grafana no host" $rootUrl }}
        [auth.generic_oauth]
        enabled = true
        name = {{ required "auth.genericOauth.name is required when auth.genericOauth.enabled" .name }}
        client_id = {{ required "auth.genericOauth.clientId is required when auth.genericOauth.enabled" .clientId }}
        {{- $grafana := $.Values.deployment.containers.grafana }}
        {{- if hasKey ($grafana.secretEnv | default dict) "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET" }}
        {{- if (include "common.values" $ | fromYaml).vault.enabled }}
        client_secret = $__file{{ "{" }}{{ include "common.secretFile" (list $ "grafana" "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET") }}{{ "}" }}
        {{- else }}
        client_secret = $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
        {{- end }}
        {{- else if hasKey ($grafana.env | default dict) "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET" }}
        client_secret = $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
        {{- end }}
        scopes = {{ .scopes }}
        auth_url = {{ required "auth.genericOauth.authUrl is required when auth.genericOauth.enabled" .authUrl }}
        token_url = {{ required "auth.genericOauth.tokenUrl is required when auth.genericOauth.enabled" .tokenUrl }}
        api_url = {{ required "auth.genericOauth.apiUrl is required when auth.genericOauth.enabled" .apiUrl }}
        allow_sign_up = {{ .allowSignUp }}
        role_attribute_path = {{ .roleAttributePath }}
        login_attribute_path = {{ .loginAttributePath }}
        name_attribute_path = {{ .nameAttributePath }}
        {{- with .emailAttributePath }}
        email_attribute_path = {{ . }}
        {{- end }}
        {{- with .groupsAttributePath }}
        groups_attribute_path = {{ . }}
        {{- end }}
        auto_login = {{ .autoLogin }}
        use_refresh_token = {{ .useRefreshToken }}
        tls_skip_verify_insecure = false
        {{- with .tlsCaConfigMap }}
        tls_client_ca = /etc/grafana/oauth-ca/{{ $.Values.auth.genericOauth.tlsCaKey }}
        {{- end }}
        {{- end }}{{ end }}
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus (Cerberus)
            uid: cerberus-prometheus
            type: prometheus
            access: proxy
            url: '{{ include "common.serviceAddress" (list $ "cerberus") }}'
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 15s
              exemplarTraceIdDestinations:
                - name: trace_id
                  datasourceUid: cerberus-tempo
          - name: Loki (Cerberus)
            uid: cerberus-loki
            type: loki
            access: proxy
            url: '{{ include "common.serviceAddress" (list $ "cerberus") }}'
            editable: false
            jsonData:
              # Every demo log carries the trace_id of the span it was written in, as structured
              # metadata; this turns it into a link to that trace.
              derivedFields:
                - name: TraceID
                  matcherType: label
                  matcherRegex: trace_id
                  datasourceUid: cerberus-tempo
                  url: "$${__value.raw}"
                  urlDisplayLabel: View trace
          # Read-only: Grafana's alerting UI lists the alerts and silences in the stack's Alertmanager,
          # vmalert's included. Grafana's own rules reach it through the stack-alertmanager contact point.
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            access: proxy
            url: '{{ include "common.serviceAddress" (list $ "alertmanager") }}'
            editable: false
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
          - name: Tempo (Cerberus)
            uid: cerberus-tempo
            type: tempo
            access: proxy
            url: '{{ include "common.serviceAddress" (list $ "cerberus") }}'
            editable: false
            jsonData:
              serviceMap:
                datasourceUid: cerberus-prometheus
              nodeGraph:
                enabled: true
              tracesToMetrics:
                datasourceUid: cerberus-prometheus
                spanStartTimeShift: "-5m"
                spanEndTimeShift: "5m"
                tags:
                  - key: service.name
                    value: service_name
                queries:
                  - name: Request rate
                    query: sum(rate(traces_span_metrics_calls{$$__tags}[5m]))
                  - name: p95 latency (ms)
                    query: histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_bucket{$$__tags}[5m])))
              # Match on the trace_id log attribute rather than filterByTraceID, which searches
              # the log line for the ID.
              tracesToLogsV2:
                datasourceUid: cerberus-loki
                spanStartTimeShift: "-5m"
                spanEndTimeShift: "5m"
                tags:
                  - key: service.name
                    value: service_name
                customQuery: true
                query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
      dashboards.yaml:
        apiVersion: 1
        providers:
          - name: dashboards
            orgId: 1
            type: file
            folder: Cerberus
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards
  dashboards:
    files: dashboards/*.json

# A Deployment can't take volumeClaimTemplates, so the claim is its own object. The string renders to
# nothing, and common skips it, unless persistence.enabled; '--{{ "-" }}' keeps it a plain YAML scalar.
objects:
  data: '--{{ "-" }}{{ if .Values.persistence.enabled }}{{ tpl (.Files.Get "files/data-pvc.yaml.tpl") . }}{{ end }}'
  alerts: '--{{ "-" }}{{ if .Values.alerts.enabled }}{{ tpl (.Files.Get "files/alerts.yaml.tpl") . }}{{ end }}'

service:
  enabled: true
  ports:
    http:
      port: 80
      targetPort: grafana

# With global.mesh: kubernetes and global.exposure.enabled, an Ingress routes global.exposure.hosts.grafana
# to Grafana.
exposure:
  host: grafana
  port: http

deployment:
  enabled: true
  podSecurityContext:
    fsGroup: 472
    runAsGroup: 472
    runAsNonRoot: true
    runAsUser: 472
  containers:
    grafana:
      image:
        repository: docker.io/grafana/grafana
        tag: 13.2.2-distroless
      ports:
        grafana:
          containerPort: 3000
      env:
        GF_PATHS_DATA: /var/lib/grafana/
        GF_PATHS_LOGS: /var/log/grafana
        GF_PATHS_PLUGINS: /var/lib/grafana/plugins
        GF_PATHS_PROVISIONING: /etc/grafana/provisioning
        GF_UNIFIED_STORAGE_INDEX_PATH: /var/lib/grafana-search/bleve
        GOMEMLIMIT: 920MiB  # about 90% of the limit
      secretEnv:
        GF_SECURITY_ADMIN_USER:
          secret: '{{ include "common.fullname" . }}-admin'
          key: admin-user
          vault:
            env: GF_SECURITY_ADMIN_USER__FILE
        GF_SECURITY_ADMIN_PASSWORD:
          secret: '{{ include "common.fullname" . }}-admin'
          key: admin-password
          vault:
            env: GF_SECURITY_ADMIN_PASSWORD__FILE
      livenessProbe:
        httpGet:
          path: /api/health
          port: grafana
        initialDelaySeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /api/health
          port: grafana
      # The Drilldown apps query through Grafana's server: opening Metrics Drilldown
      # OOM-killed Grafana at 384Mi. Measured peak with all three apps in use was
      # 679Mi, so the limit leaves about 50% headroom.
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: storage
          mountPath: /var/lib/grafana
        - name: plugins
          mountPath: /var/lib/grafana/plugins
        - name: search
          mountPath: /var/lib/grafana-search
        - name: alerts
          mountPath: /etc/grafana/provisioning/alerting
        - name: oauth-ca
          mountPath: /etc/grafana/oauth-ca
          readOnly: true
  volumes:
    tmp:
      emptyDir: {}
    # An emptyDir unless persistence.enabled, then the claim that objects.data renders.
    storage: |-
      {{- if .Values.persistence.enabled }}
      persistentVolumeClaim:
        claimName: {{ include "common.fullname" . }}-data
      {{- else }}
      emptyDir: {}
      {{- end }}
    search:
      emptyDir: {}
    # Its own volume so an environment can keep plugins without keeping the
    # database: the grafana-plugins claim when pluginsClaim is set (the
    # environment creates it under objects.plugins), otherwise an emptyDir.
    plugins: |-
      {{- if .Values.pluginsClaim }}
      persistentVolumeClaim:
        claimName: {{ include "common.fullname" . }}-plugins
      {{- else }}
      emptyDir: {}
      {{- end }}
    config:
      configMap:
        name: '{{ include "common.fullname" . }}-config'
    dashboards:
      configMap:
        name: '{{ include "common.fullname" . }}-dashboards'
    # The OAuth provider's CA when auth.genericOauth.tlsCaConfigMap names one, otherwise empty.
    oauth-ca: |-
      {{- with .Values.auth.genericOauth.tlsCaConfigMap }}
      configMap:
        name: {{ . }}
      {{- else }}
      emptyDir: {}
      {{- end }}
    # Optional, so the pod starts with an empty alerting directory while alerts are off.
    alerts:
      configMap:
        name: '{{ include "common.fullname" . }}-alerts'
        optional: true

# With global.networkPolicy.enabled: users reach Grafana through the exposure namespaces (the ingress
# gateway or controller; kubectl port-forward isn't subject to NetworkPolicy), and Grafana reaches Cerberus,
# Alertmanager and, on 443, the OAuth provider and grafana.com for its pinned plugins, both outside the cluster.
networkPolicy:
  ingress: |-
    {{- with dig "global" "networkPolicy" "exposureNamespaces" list .Values.AsMap }}
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ toJson . }}
      ports:
        - port: 3000
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cerberus
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP

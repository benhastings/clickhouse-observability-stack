secrets:
  admin:
    create: false
  # grafana-oauth, key client-secret: the generic OAuth client secret. Never created here; an
  # environment that turns OAuth on pre-creates it and adds this to the grafana container's env:
  #   GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
  #     valueFrom:
  #       secretKeyRef:
  #         name: grafana-oauth
  #         key: client-secret
  # grafana.ini then reads it with $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}.
  oauth:
    create: false

# Sign-in through any OpenID Connect provider, rendered into grafana.ini below. Off by default;
# an environment turns it on and sets the URLs. Keycloak is the worked example, with
# <realm> standing in for the realm name:
#   authUrl:  https://keycloak.example.com/realms/<realm>/protocol/openid-connect/auth
#   tokenUrl: https://keycloak.example.com/realms/<realm>/protocol/openid-connect/token
#   apiUrl:   https://keycloak.example.com/realms/<realm>/protocol/openid-connect/userinfo
# rootUrl is Grafana's public URL, which the redirect back from the provider must match. The client
# secret is not set here and never goes in git; see secrets.oauth above.
auth:
  genericOauth:
    enabled: false
    rootUrl: ""
    name: Keycloak
    clientId: ""
    authUrl: ""
    tokenUrl: ""
    apiUrl: ""
    scopes: openid email profile
    allowSignUp: true
    # Keycloak realm roles grafana-admin and grafana-editor map to Admin and Editor; anyone else is a Viewer.
    roleAttributePath: "contains(realm_access.roles[*], 'grafana-admin') && 'Admin' || contains(realm_access.roles[*], 'grafana-editor') && 'Editor' || 'Viewer'"
    loginAttributePath: preferred_username
    nameAttributePath: name

configMaps:
  config:
    data:
      grafana.ini: |
        [analytics]
        check_for_updates = true
        [log]
        mode = console
        [paths]
        data = /var/lib/grafana/
        logs = /var/log/grafana
        plugins = /var/lib/grafana/plugins
        provisioning = /etc/grafana/provisioning
        [plugins]
        preinstall_auto_update = false
        preinstall_disabled = true
        [unified_storage]
        index_path = /var/lib/grafana-search/bleve
        {{- with .Values.auth.genericOauth }}{{ if .enabled }}
        [server]
        root_url = {{ required "auth.genericOauth.rootUrl is required when auth.genericOauth.enabled" .rootUrl }}
        [auth.generic_oauth]
        enabled = true
        name = {{ required "auth.genericOauth.name is required when auth.genericOauth.enabled" .name }}
        client_id = {{ required "auth.genericOauth.clientId is required when auth.genericOauth.enabled" .clientId }}
        {{- if hasKey $.Values.deployment.containers.grafana.env "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET" }}
        client_secret = $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
        {{- end }}
        scopes = {{ .scopes }}
        auth_url = {{ required "auth.genericOauth.authUrl is required when auth.genericOauth.enabled" .authUrl }}
        token_url = {{ required "auth.genericOauth.tokenUrl is required when auth.genericOauth.enabled" .tokenUrl }}
        api_url = {{ required "auth.genericOauth.apiUrl is required when auth.genericOauth.enabled" .apiUrl }}
        allow_sign_up = {{ .allowSignUp }}
        role_attribute_path = {{ .roleAttributePath }}
        login_attribute_path = {{ .loginAttributePath }}
        name_attribute_path = {{ .nameAttributePath }}
        {{- end }}{{ end }}
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus (Cerberus)
            uid: cerberus-prometheus
            type: prometheus
            access: proxy
            url: http://cerberus:8080
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 15s
              exemplarTraceIdDestinations:
                - name: trace_id
                  datasourceUid: cerberus-tempo
          - name: Loki (Cerberus)
            uid: cerberus-loki
            type: loki
            access: proxy
            url: http://cerberus:8080
            editable: false
            jsonData:
              # Every demo log carries the trace_id of the span it was written in, as structured
              # metadata; this turns it into a link to that trace.
              derivedFields:
                - name: TraceID
                  matcherType: label
                  matcherRegex: trace_id
                  datasourceUid: cerberus-tempo
                  url: "$${__value.raw}"
                  urlDisplayLabel: View trace
          - name: Tempo (Cerberus)
            uid: cerberus-tempo
            type: tempo
            access: proxy
            url: http://cerberus:8080
            editable: false
            jsonData:
              serviceMap:
                datasourceUid: cerberus-prometheus
              nodeGraph:
                enabled: true
              tracesToMetrics:
                datasourceUid: cerberus-prometheus
                spanStartTimeShift: "-5m"
                spanEndTimeShift: "5m"
                tags:
                  - key: service.name
                    value: service_name
                queries:
                  - name: Request rate
                    query: sum(rate(traces_span_metrics_calls{$$__tags}[5m]))
                  - name: p95 latency (ms)
                    query: histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_bucket{$$__tags}[5m])))
              # Match on the trace_id log attribute rather than filterByTraceID, which searches
              # the log line for the ID.
              tracesToLogsV2:
                datasourceUid: cerberus-loki
                spanStartTimeShift: "-5m"
                spanEndTimeShift: "5m"
                tags:
                  - key: service.name
                    value: service_name
                customQuery: true
                query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
      dashboards.yaml:
        apiVersion: 1
        providers:
          - name: dashboards
            orgId: 1
            type: file
            folder: Cerberus
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards
  dashboards:
    files: dashboards/*.json

service:
  enabled: true
  ports:
    http:
      port: 80
      targetPort: grafana

deployment:
  enabled: true
  podSecurityContext:
    fsGroup: 472
    runAsGroup: 472
    runAsNonRoot: true
    runAsUser: 472
  containers:
    grafana:
      image:
        repository: docker.io/grafana/grafana
        tag: 13.2.2-distroless
      ports:
        grafana:
          containerPort: 3000
      env:
        GF_SECURITY_ADMIN_USER:
          valueFrom:
            secretKeyRef:
              name: '{{ include "common.fullname" . }}-admin'
              key: admin-user
        GF_SECURITY_ADMIN_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: '{{ include "common.fullname" . }}-admin'
              key: admin-password
        GF_PATHS_DATA: /var/lib/grafana/
        GF_PATHS_LOGS: /var/log/grafana
        GF_PATHS_PLUGINS: /var/lib/grafana/plugins
        GF_PATHS_PROVISIONING: /etc/grafana/provisioning
        GF_UNIFIED_STORAGE_INDEX_PATH: /var/lib/grafana-search/bleve
        GOMEMLIMIT: 345MiB
      livenessProbe:
        httpGet:
          path: /api/health
          port: grafana
        initialDelaySeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /api/health
          port: grafana
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 384Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: storage
          mountPath: /var/lib/grafana
        - name: search
          mountPath: /var/lib/grafana-search
  volumes:
    tmp:
      emptyDir: {}
    storage:
      emptyDir: {}
    search:
      emptyDir: {}
    config:
      configMap:
        name: '{{ include "common.fullname" . }}-config'
    dashboards:
      configMap:
        name: '{{ include "common.fullname" . }}-dashboards'

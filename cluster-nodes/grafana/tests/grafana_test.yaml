suite: grafana
templates:
  - templates/common.yaml
release:
  name: grafana
  namespace: observability
tests:
  - it: points every datasource at Cerberus
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "uid: cerberus-prometheus"
      - notMatchRegex:
          path: data["datasources.yaml"]
          pattern: "url: https?://([^c]|c[^e])"

  - it: provisions the span-metrics dashboard from files
    documentSelector:
      path: metadata.name
      value: grafana-dashboards
    asserts:
      - exists:
          path: data["span-metrics.json"]

  - it: reads the admin login from grafana-admin
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: admin-password

  - it: listens on grafana:80
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: grafana

  - it: preinstalls only the pinned Drilldown apps
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "(?m)^preinstall = grafana-metricsdrilldown-app@[0-9.]+,grafana-lokiexplore-app@[0-9.]+,grafana-exploretraces-app@[0-9.]+$"
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "(?m)^disable_plugins = grafana-pyroscope-app,grafana-advisor-app$"
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: "preinstall_disabled"

  - it: keeps plugins on the grafana-plugins claim and recreates the pod to release it
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: plugins
            persistentVolumeClaim:
              claimName: grafana-plugins
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: plugins
            mountPath: /var/lib/grafana/plugins
      - equal:
          path: spec.strategy.type
          value: Recreate
      - exists:
          path: spec.template.spec.containers[0].startupProbe

  - it: claims a small volume for plugins
    documentSelector:
      path: metadata.name
      value: grafana-plugins
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

suite: grafana
release:
  name: grafana
  namespace: observability
tests:
  - it: points every query datasource at Cerberus, and the Alertmanager one at alertmanager:9093
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "uid: cerberus-prometheus"
      - notMatchRegex:
          path: data["datasources.yaml"]
          pattern: "url: https?://([^ac]|c[^e]|a[^l])"
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "type: alertmanager\\n  uid: alertmanager\\n  url: 'http://alertmanager:9093'"
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "handleGrafanaManagedAlerts: false"

  - it: reaches Cerberus and Alertmanager when network policies are on
    set:
      global.networkPolicy.enabled: true
    template: templates/networkpolicy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: alertmanager
            ports:
              - port: 9093
                protocol: TCP

  - it: provisions the span-metrics dashboard from files
    documentSelector:
      path: metadata.name
      value: grafana-dashboards
    asserts:
      - exists:
          path: data["span-metrics.json"]

  - it: reads the admin login from grafana-admin
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: admin-password

  - it: reads the admin login from Vault-injected files when Vault is on
    set:
      vault.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-grafana-admin-admin-password"]
          value: secret/data/grafana-admin
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_SECURITY_ADMIN_PASSWORD__FILE
            value: /vault/secrets/grafana-admin-admin-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_SECURITY_ADMIN_USER__FILE
            value: /vault/secrets/grafana-admin-admin-user

  - it: listens on grafana:80
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: grafana

  - it: leaves generic OAuth out of grafana.ini by default
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: auth\.generic_oauth

  - it: renders generic OAuth into grafana.ini when enabled
    documentSelector:
      path: metadata.name
      value: grafana-config
    set:
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\[auth\.generic_oauth\]\nenabled = true$'
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^auth_url = https://keycloak\.example\.com/realms/demo/protocol/openid-connect/auth$'
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "(?m)^role_attribute_path = contains\\(realm_access\\.roles\\[\\*\\], 'grafana-admin'\\) && 'Admin' \\|\\| contains\\(realm_access\\.roles\\[\\*\\], 'grafana-editor'\\) && 'Editor' \\|\\| 'Viewer'$"
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^login_attribute_path = preferred_username$'

  - it: fails the render when generic OAuth is enabled without an auth URL
    set:
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
    asserts:
      - failedTemplate:
          errorPattern: auth.genericOauth.authUrl is required

  - it: fails the render when generic OAuth is enabled without a root URL
    set:
      auth.genericOauth:
        enabled: true
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
    asserts:
      - failedTemplate:
          errorPattern: auth.genericOauth.rootUrl is required

  - it: leaves root_url, client_secret and the OAuth secret env out by default
    asserts:
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: (root_url|client_secret)
        documentSelector:
          path: metadata.name
          value: grafana-config
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          any: true
        documentSelector:
          path: kind
          value: Deployment

  - it: reads the OAuth client secret from grafana-oauth through the environment
    set:
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
      deployment.containers.grafana.env.GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: grafana-oauth
            key: client-secret
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\[server\]\nroot_url = https://grafana\.example\.com/$'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^client_secret = \$__env\{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET\}$'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^client_secret = [^$]'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: grafana-oauth
                key: client-secret
        documentSelector:
          path: kind
          value: Deployment
      - hasDocuments:
          count: 0
        documentSelector:
          path: kind
          value: Secret
          skipEmptyTemplates: true

  - it: leaves disable_login_form out of grafana.ini by default
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: disable_login_form

  - it: hides the login form when asked and OAuth is enabled
    documentSelector:
      path: metadata.name
      value: grafana-config
    set:
      auth.disableLoginForm: true
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\[auth\]\ndisable_login_form = true$'

  - it: refuses to hide the login form without OAuth
    set:
      auth.disableLoginForm: true
    asserts:
      - failedTemplate:
          errorPattern: auth.disableLoginForm requires auth.genericOauth.enabled

  - it: signs in automatically, refreshes tokens and reads email and groups when asked
    documentSelector:
      path: metadata.name
      value: grafana-config
    set:
      auth.disableLoginForm: true
      auth.loginMaximumLifetimeDuration: 7d
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
        emailAttributePath: upn
        groupsAttributePath: groups
        autoLogin: true
        useRefreshToken: true
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\[auth\]\ndisable_login_form = true\nlogin_maximum_lifetime_duration = 7d$'
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^email_attribute_path = upn\ngroups_attribute_path = groups\nauto_login = true\nuse_refresh_token = true$'

  - it: leaves auto login off, refreshes tokens and sets no email, groups or lifetime by default
    documentSelector:
      path: metadata.name
      value: grafana-config
    set:
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^auto_login = false\nuse_refresh_token = true$'
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: email_attribute_path|groups_attribute_path|login_maximum_lifetime_duration|^\[auth\]$

  - it: takes the root URL from the exposed Grafana host when rootUrl is empty
    documentSelector:
      path: metadata.name
      value: grafana-config
    set:
      global:
        exposure:
          enabled: true
          hosts:
            grafana: grafana.example
          tls:
            credentialName: observability-tls
      auth.genericOauth:
        enabled: true
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\[server\]\nroot_url = https://grafana\.example/$'

  - it: routes the grafana host to the Service through an Istio VirtualService
    set:
      global:
        mesh: istio
        exposure:
          enabled: true
          hosts:
            grafana: grafana.example
          gateway:
            name: shared
            namespace: istio-ingress
    asserts:
      - hasDocuments:
          count: 1
        template: templates/gateway.yaml
      - equal:
          path: spec
          value:
            hosts:
              - grafana.example
            gateways:
              - istio-ingress/shared
            http:
              - route:
                  - destination:
                      host: grafana.observability.svc.cluster.local
                      port:
                        number: 80
        template: templates/gateway.yaml

  - it: has no PersistentVolumeClaim and mounts an emptyDir at /var/lib/grafana by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/objects.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage
            emptyDir: {}
        documentSelector:
          path: kind
          value: Deployment

  - it: renders a claim of the requested size when persistence is enabled
    set:
      persistence:
        enabled: true
        size: 5Gi
        storageClassName: fast
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal:
          path: metadata.name
          value: grafana-data
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: spec.storageClassName
          value: fast

  - it: leaves the storage class to the cluster when none is set
    set:
      persistence.enabled: true
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - notExists:
          path: spec.storageClassName
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: mounts the claim at /var/lib/grafana when persistence is enabled
    set:
      persistence.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage
            persistentVolumeClaim:
              claimName: grafana-data
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: storage
            mountPath: /var/lib/grafana
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: storage
            emptyDir: {}

  - it: exposes Grafana on the grafana host when the mesh is kubernetes
    set:
      global:
        mesh: kubernetes
        exposure:
          enabled: true
          hosts:
            grafana: grafana.example
    documentSelector:
      path: kind
      value: Ingress
    asserts:
      - equal:
          path: spec.rules
          value:
            - host: grafana.example
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: grafana
                        port:
                          name: http

  - it: points every datasource at global.services.cerberus
    set:
      global:
        services:
          cerberus: http://cerberus.query.svc.cluster.local:8080
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "(?s)url: 'http://cerberus.query.svc.cluster.local:8080'.*url: 'http://cerberus.query.svc.cluster.local:8080'.*url: 'http://cerberus.query.svc.cluster.local:8080'"
      - notMatchRegex:
          path: data["datasources.yaml"]
          pattern: "http://cerberus:8080"

  - it: renders no alert rules by default
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: metadata.name
          value: grafana-alerts
          skipEmptyTemplates: true

  - it: provisions the starter alert rules against cerberus-prometheus when alerts are on
    set:
      alerts:
        enabled: true
        errorRatio:
          serviceName: checkout|payments
          threshold: 0.2
    documentSelector:
      path: metadata.name
      value: grafana-alerts
    asserts:
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: "datasourceUid: cerberus-prometheus"
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: 'title: Span error ratio above 0.2'
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: 'service_name=~"checkout\|payments"'
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: "evaluator: \\{type: gt, params: \\[0.2\\]\\}"
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: "uid: stack-collector-no-spans"
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: "uid: stack-clickhouse-disk"

  - it: sends every rule to the stack's Alertmanager when no contact point is set
    set:
      alerts.enabled: true
    documentSelector:
      path: metadata.name
      value: grafana-alerts
    asserts:
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: "contactPoints:\\n  - orgId: 1\\n    name: \"stack-alertmanager\"\\n    receivers:\\n      - uid: observability-stack-contact\\n        type: \"prometheus-alertmanager\"\\n        settings:\\n          url: http://alertmanager:9093"
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: "(?s)notification_settings:\\n\\s+receiver: \"stack-alertmanager\".*notification_settings:\\n\\s+receiver: \"stack-alertmanager\".*notification_settings:\\n\\s+receiver: \"stack-alertmanager\""

  - it: routes every rule to the contact point when one is set
    set:
      alerts:
        enabled: true
        clickhouseDisk:
          enabled: false
        contactPoint:
          name: on-call
          type: webhook
          settings:
            url: https://hooks.example/alerts
    documentSelector:
      path: metadata.name
      value: grafana-alerts
    asserts:
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: "contactPoints:\\n  - orgId: 1\\n    name: \"on-call\""
      - matchRegex:
          path: data["alerts.yaml"]
          pattern: "(?s)notification_settings:\\n\\s+receiver: \"on-call\".*notification_settings:\\n\\s+receiver: \"on-call\""
      - notMatchRegex:
          path: data["alerts.yaml"]
          pattern: "stack-clickhouse-disk"

  - it: mounts the alert rules optionally, so Grafana starts while alerts are off
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: alerts
            configMap:
              name: grafana-alerts
              optional: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: alerts
            mountPath: /etc/grafana/provisioning/alerting

  - it: reads a secretEnv OAuth client secret through $__env with Vault off
    set:
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
      deployment.containers.grafana.secretEnv.GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secret: grafana-oauth
        key: client-secret
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^client_secret = \$__env\{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET\}$'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: grafana-oauth
                key: client-secret
        documentSelector:
          path: kind
          value: Deployment

  - it: reads the OAuth client secret from the Vault agent's file with Vault on
    set:
      vault.enabled: true
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
      deployment.containers.grafana.secretEnv.GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secret: grafana-oauth
        key: client-secret
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^client_secret = \$__file\{/vault/secrets/grafana-oauth-client-secret\}$'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - exists:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-grafana-oauth-client-secret"]
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: grafana-oauth
                key: client-secret
        documentSelector:
          path: kind
          value: Deployment

  # The production shape together: Vault for the client secret, the provider's private CA, and the
  # VirtualService on a shared Gateway whose host is also the root URL the provider redirects back to.
  - it: renders Vault-on OAuth with a private CA behind a VirtualService on the same host
    set:
      vault.enabled: true
      global:
        mesh: istio
        exposure:
          enabled: true
          hosts:
            grafana: grafana.example
          gateway:
            name: shared
            namespace: istio-ingress
          tls:
            credentialName: observability-tls
      auth.genericOauth:
        enabled: true
        clientId: grafana
        authUrl: https://sso.example/realms/platform/protocol/openid-connect/auth
        tokenUrl: https://sso.example/realms/platform/protocol/openid-connect/token
        apiUrl: https://sso.example/realms/platform/protocol/openid-connect/userinfo
        autoLogin: true
        tlsCaConfigMap: platform-ca
      deployment.containers.grafana.secretEnv.GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secret: grafana-oauth
        key: client-secret
    asserts:
      - equal:
          path: spec.hosts
          value: [grafana.example]
        template: templates/gateway.yaml
      - equal:
          path: spec.gateways
          value: [istio-ingress/shared]
        template: templates/gateway.yaml
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\[server\]\nroot_url = https://grafana\.example/\n\[auth\.generic_oauth\]\nenabled = true$'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^client_secret = \$__file\{/vault/secrets/grafana-oauth-client-secret\}$'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^auto_login = true\nuse_refresh_token = true\ntls_skip_verify_insecure = false\ntls_client_ca = /etc/grafana/oauth-ca/ca.crt$'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-grafana-oauth-client-secret"]
          value: secret/data/grafana-oauth
        documentSelector:
          path: kind
          value: Deployment
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[*].name
          pattern: ^GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET$
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth-ca
            configMap:
              name: platform-ca
        documentSelector:
          path: kind
          value: Deployment
      - hasDocuments:
          count: 0
        template: templates/secret.yaml

  - it: trusts the OAuth provider's CA from a ConfigMap and never skips verification
    set:
      auth.genericOauth:
        enabled: true
        rootUrl: https://grafana.example.com/
        clientId: grafana
        authUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/auth
        tokenUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/token
        apiUrl: https://keycloak.example.com/realms/demo/protocol/openid-connect/userinfo
        tlsCaConfigMap: keycloak-ca
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^tls_skip_verify_insecure = false\ntls_client_ca = /etc/grafana/oauth-ca/ca.crt$'
        documentSelector:
          path: metadata.name
          value: grafana-config
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth-ca
            configMap:
              name: keycloak-ca
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: oauth-ca
            mountPath: /etc/grafana/oauth-ca
            readOnly: true
        documentSelector:
          path: kind
          value: Deployment

  - it: mounts an empty oauth-ca directory and sets no CA when none is given
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth-ca
            emptyDir: {}

# yaml-language-server: $schema=values.schema.json
# garmr serve takes Alertmanager's webhook and keeps one incident per alert group in ClickHouse (the garmr
# database, which the clickhouse node's schema Job creates with clickhouse.garmr), with what the telemetry knows
# about the failing service attached. It writes as otel_garmr. The design is in
# https://github.com/benhastings/garmr/blob/main/docs/design.md.

# One Slack thread per incident, with Acknowledge, Silence 1h and Resolve buttons over Socket Mode, so nothing
# reaches in from Slack. Needs a Slack app's bot token (chat:write, invited to the channel) and app-level token
# (connections:write), in the Secret garmr-slack, keys bot-token and app-token, which is never in git: make
# dev/garmr-slack creates it on kind. channel is the channel's ID.
slack:
  enabled: false
  channel: ""

configMaps:
  env:
    data:
      CLICKHOUSE_ADDR: '{{ include "common.serviceAddress" (list $ "clickhouse") }}'
      CLICKHOUSE_USER: otel_garmr
      GARMR_DATABASE: garmr
      GARMR_ALERTMANAGER_URL: '{{ include "common.serviceAddress" (list $ "alertmanager") }}'
      # A link to a trace for the failing-trace enrichment, {trace_id} replaced; an environment sets it to its
      # Grafana. Empty prints the trace ID alone.
      GARMR_TRACE_URL: ""
      GARMR_LISTEN_ADDRESS: ":8080"
      GARMR_LOG_FORMAT: json
      SLACK_CHANNEL: '{{ if .Values.slack.enabled }}{{ required "slack.channel is required when slack.enabled" .Values.slack.channel }}{{ end }}'
      SLACK_BOT_TOKEN_FILE: '{{ if .Values.slack.enabled }}/etc/garmr/slack/bot-token{{ end }}'
      SLACK_APP_TOKEN_FILE: '{{ if .Values.slack.enabled }}/etc/garmr/slack/app-token{{ end }}'

service:
  enabled: true
  ports:
    http:
      port: 8080
      targetPort: http
      appProtocol: http

deployment:
  enabled: true
  podSecurityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    garmr:
      image:
        repository: ghcr.io/benhastings/garmr
        # The tag and the digest it was published with, so a re-pushed tag can't change what runs.
        tag: "v0.2.0"
      args:
        - serve
      ports:
        http:
          containerPort: 8080
      env:
        GOMEMLIMIT: 50331648B
      secretEnv:
        CLICKHOUSE_PASSWORD:
          secret: clickhouse-garmr
          key: password
          vault:
            env: CLICKHOUSE_PASSWORD_FILE
      envFrom:
        - configMapRef:
            name: '{{ include "common.fullname" . }}-env'
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      # Ready once ClickHouse answers a ping and, with slack.enabled, Slack's Socket Mode is connected.
      readinessProbe:
        httpGet:
          path: /-/ready
          port: http
        periodSeconds: 5
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: slack
          mountPath: /etc/garmr/slack
          readOnly: true
  volumes:
    # The Slack tokens when slack.enabled, otherwise empty.
    slack: |-
      {{- if .Values.slack.enabled }}
      secret:
        secretName: {{ include "common.fullname" . }}-slack
      {{- else }}
      emptyDir: {}
      {{- end }}

# With global.networkPolicy.enabled: only Alertmanager posts to garmr, and the collector scrapes its metrics.
# garmr reaches ClickHouse, Alertmanager for silences and, with slack.enabled, Slack's API and Socket Mode on 443.
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [alertmanager, otel-collector]
      ports:
        - port: 8080
          protocol: TCP
  egress: |-
    - to:
        - podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: otel
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
          protocol: TCP
    {{- if .Values.slack.enabled }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}

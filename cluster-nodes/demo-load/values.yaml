deployment:
  enabled: true
  containers:
    # Each request is a checkout that calls payments; every log is written inside a span of
    # that request, so logs and traces link both ways. See the generator's README for the
    # span tree and the wide-event attributes.
    correlated-telemetrygen:
      image:
        repository: ghcr.io/brandonapol/correlated-telemetrygen
        tag: v0.1.0
      args:
        - --rate=2
        - --error-ratio=0.25
        - --environment=local
      env:
        K8S_POD_NAME:
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        OTEL_EXPORTER_OTLP_ENDPOINT: 'http://{{ include "common.serviceAddress" (list $ "otlpGrpc") }}'
        OTEL_RESOURCE_ATTRIBUTES: k8s.pod.name=$(K8S_POD_NAME)
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi

# With global.networkPolicy.enabled: the demo load only sends OTLP to the collector.
networkPolicy:
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 4317
          protocol: TCP

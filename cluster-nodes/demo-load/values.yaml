# yaml-language-server: $schema=values.schema.json
deployment:
  enabled: true
  containers:
    # Each request is a checkout that calls payments; every log is written inside a span of
    # that request, so logs and traces link both ways. See the generator's README for the
    # span tree and the wide-event attributes. The image is the benhastings fork, which adds
    # scheduled incidents (brandonapol/correlated-telemetrygen#17 offers them upstream).
    #
    # Fifteen minutes after the generator starts, and every hour after that, the payment gateway
    # fails 90% of charges for ten minutes instead of 25%: an anomaly for the alert rules to find
    # and then see recover. The anomaly rules need a few minutes of normal first, as their baseline.
    # scripts/e2e.bash waits for the first one.
    correlated-telemetrygen:
      image:
        repository: ghcr.io/benhastings/correlated-telemetrygen
        tag: v0.2.0
      args:
        - --rate=2
        - --error-ratio=0.25
        - --environment=local
        - --incident-kind=errors
        - --incident-after=15m
        - --incident-duration=10m
        - --incident-every=1h
      env:
        K8S_POD_NAME:
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # k8s.pod.uid lets the collector's k8sattributes find this pod even when a sidecar hides its IP.
        K8S_POD_UID:
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        OTEL_EXPORTER_OTLP_ENDPOINT: 'http://{{ include "common.serviceAddress" (list $ "otlpGrpc") }}'
        OTEL_RESOURCE_ATTRIBUTES: k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID)
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi

# With global.networkPolicy.enabled: the demo load only sends OTLP to the collector.
networkPolicy:
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 4317
          protocol: TCP

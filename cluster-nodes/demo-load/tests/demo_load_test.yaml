suite: demo-load
release:
  name: demo-load
  namespace: observability
tests:
  - it: runs the correlated generator
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/benhastings/correlated-telemetrygen:v0.2.0

  - it: injects an hourly payments error incident, the first fifteen minutes in
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --incident-kind=errors
      - contains:
          path: spec.template.spec.containers[0].args
          content: --incident-after=15m
      - contains:
          path: spec.template.spec.containers[0].args
          content: --incident-duration=10m
      - contains:
          path: spec.template.spec.containers[0].args
          content: --incident-every=1h

  - it: sends to the collector Service
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4317

  - it: defines the pod name before the resource attributes that expand it
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: K8S_POD_NAME
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
            value: k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID)

  - it: sends to global.services.otlpGrpc
    set:
      global:
        services:
          otlpGrpc: otel-collector.ingest.svc.cluster.local:4317
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector.ingest.svc.cluster.local:4317

suite: cerberus
release:
  name: cerberus
  namespace: observability
tests:
  - it: looks metadata back as far as the metrics retention, from global.retention like ClickHouse's TTLs
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: data.CERBERUS_PROM_METADATA_LOOKBACK
          value: 90d

  - it: follows an environment's metrics retention, so the two can't drift apart
    set:
      global.retention.metrics: 45
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: data.CERBERUS_PROM_METADATA_LOOKBACK
          value: 45d

  - it: serves the query APIs on cerberus:8080, where Grafana points
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: cerberus
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: reads the ClickHouse password from clickhouse-reader
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CERBERUS_CH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-reader
                key: password
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: cerberus-env

  - it: reads the ClickHouse password from /etc/cerberus/cerberus.yaml when Vault is on
    set:
      vault.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-cerberus.yaml"]
          value: secret/data/clickhouse-reader
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/secret-volume-path-cerberus.yaml"]
          value: /etc/cerberus
      - matchRegex:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-template-cerberus.yaml"]
          pattern: "clickhouse:\\n  password: "
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CERBERUS_CH_PASSWORD
          any: true

  - it: queries as the read-only otel_reader and leaves the schema to the clickhouse node
    documentSelector:
      path: metadata.name
      value: cerberus-env
    asserts:
      - equal:
          path: data.CERBERUS_CH_USERNAME
          value: otel_reader
      - equal:
          path: data.CERBERUS_AUTO_CREATE_SCHEMA
          value: "false"
      - equal:
          path: data.CERBERUS_AUTO_CREATE_DATABASE
          value: "false"
      - equal:
          path: data.CERBERUS_CH_ADDR
          value: clickhouse:9000

  - it: reaches ClickHouse at global.services.clickhouse
    set:
      global:
        services:
          clickhouse: clickhouse.data.svc.cluster.local:9000
    documentSelector:
      path: metadata.name
      value: cerberus-env
    asserts:
      - equal:
          path: data.CERBERUS_CH_ADDR
          value: clickhouse.data.svc.cluster.local:9000

  - it: lets only Grafana query Cerberus, and the collector scrape it, when network policies are on
    set:
      global:
        networkPolicy:
          enabled: true
    documentSelector:
      path: kind
      value: NetworkPolicy
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [grafana, otel-collector]

  - it: reaches an external ClickHouse over TLS, verified against the platform's CA bundle and the server name
    set:
      global.clickhouse.external: true
      global.clickhouse.tls.serverName: clickhouse.paas.example
      global.clickhouse.tls.caConfigMap: platform-ca
      global.services.clickhouse: clickhouse.paas.example:9440
      global.networkPolicy.enabled: true
      global.mesh: kubernetes
    asserts:
      - equal:
          path: data.CERBERUS_CH_TLS_ENABLED
          value: "true"
        template: templates/configmap.yaml
      - equal:
          path: data.CERBERUS_CH_TLS_CA_FILE
          value: /etc/clickhouse-ca/ca.crt
        template: templates/configmap.yaml
      - equal:
          path: data.CERBERUS_CH_TLS_SERVER_NAME
          value: clickhouse.paas.example
        template: templates/configmap.yaml
      - notExists:
          path: data.CERBERUS_CH_TLS_INSECURE_SKIP_VERIFY
        template: templates/configmap.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: clickhouse-ca
            mountPath: /etc/clickhouse-ca
            readOnly: true
        template: templates/deployment.yaml
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 9440
                protocol: TCP
        template: templates/networkpolicy.yaml

  - it: leaves TLS off for the in-cluster ClickHouse
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data.CERBERUS_CH_TLS_ENABLED
          value: "false"
      - equal:
          path: data.CERBERUS_CH_TLS_CA_FILE
          value: ""

  - it: reaches a standalone ClickHouse only over verified TLS on 9440, with no plaintext port in its NetworkPolicy
    set:
      global.clickhouse.standalone: true
      global.clickhouse.tls.serverName: clickhouse.observability.svc
      global.clickhouse.tls.caConfigMap: platform-ca
      global.clickhouse.tls.serverSecret: clickhouse-tls
      global.services.clickhouse: clickhouse:9440
      global.networkPolicy.enabled: true
      global.mesh: kubernetes
    asserts:
      - equal:
          path: data.CERBERUS_CH_TLS_ENABLED
          value: "true"
        template: templates/configmap.yaml
      - equal:
          path: data.CERBERUS_CH_TLS_CA_FILE
          value: /etc/clickhouse-ca/ca.crt
        template: templates/configmap.yaml
      - equal:
          path: data.CERBERUS_CH_TLS_SERVER_NAME
          value: clickhouse.observability.svc
        template: templates/configmap.yaml
      - notExists:
          path: data.CERBERUS_CH_TLS_INSECURE_SKIP_VERIFY
        template: templates/configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: clickhouse-ca
            configMap:
              name: platform-ca
        template: templates/deployment.yaml
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: clickhouse
            ports:
              - port: 9440
                protocol: TCP
        template: templates/networkpolicy.yaml

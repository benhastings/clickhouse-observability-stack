suite: cerberus
release:
  name: cerberus
  namespace: observability
tests:
  - it: serves the query APIs on cerberus:8080, where Grafana points
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: cerberus
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: reads the ClickHouse password from clickhouse-reader
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CERBERUS_CH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-reader
                key: password
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: cerberus-env

  - it: reads the ClickHouse password from /etc/cerberus/cerberus.yaml when Vault is on
    set:
      vault.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-secret-cerberus.yaml"]
          value: secret/data/clickhouse-reader
      - equal:
          path: spec.template.metadata.annotations["vault.hashicorp.com/secret-volume-path-cerberus.yaml"]
          value: /etc/cerberus
      - matchRegex:
          path: spec.template.metadata.annotations["vault.hashicorp.com/agent-inject-template-cerberus.yaml"]
          pattern: "clickhouse:\\n  password: "
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CERBERUS_CH_PASSWORD
          any: true

  - it: queries as the read-only otel_reader and leaves the schema to the clickhouse node
    documentSelector:
      path: metadata.name
      value: cerberus-env
    asserts:
      - equal:
          path: data.CERBERUS_CH_USERNAME
          value: otel_reader
      - equal:
          path: data.CERBERUS_AUTO_CREATE_SCHEMA
          value: "false"
      - equal:
          path: data.CERBERUS_AUTO_CREATE_DATABASE
          value: "false"
      - equal:
          path: data.CERBERUS_CH_ADDR
          value: clickhouse:9000

  - it: reaches ClickHouse at global.services.clickhouse
    set:
      global:
        services:
          clickhouse: clickhouse.data.svc.cluster.local:9000
    documentSelector:
      path: metadata.name
      value: cerberus-env
    asserts:
      - equal:
          path: data.CERBERUS_CH_ADDR
          value: clickhouse.data.svc.cluster.local:9000

  - it: lets only Grafana's pods query Cerberus when network policies are on
    set:
      global:
        networkPolicy:
          enabled: true
    documentSelector:
      path: kind
      value: NetworkPolicy
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: grafana

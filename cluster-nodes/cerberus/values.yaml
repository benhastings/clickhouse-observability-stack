# yaml-language-server: $schema=values.schema.json
configMaps:
  env:
    data:
      # Over TLS (an external or standalone ClickHouse), HTTPS on 8443 instead of the native protocol: a stopgap,
      # because Cerberus v1.22 always installs its own dialer, which clickhouse-go uses instead of its TLS dial, so
      # CERBERUS_CH_TLS_ENABLED does nothing on the native protocol. Its HTTP transport keeps TLS on that dialer.
      CERBERUS_CH_ADDR: '{{ if include "common.clickhouseTLS" . }}{{ include "common.clickhouseHTTPSAddress" . }}{{ else }}{{ include "common.serviceAddress" (list $ "clickhouse") }}{{ end }}'
      CERBERUS_CH_DATABASE: otel
      CERBERUS_CH_USERNAME: otel_reader
      CERBERUS_CH_PROTOCOL: '{{ if include "common.clickhouseTLS" . }}http{{ else }}native{{ end }}'
      CERBERUS_CH_DIAL_TIMEOUT: 10s
      # An external ClickHouse (global.clickhouse.external) over TLS, verified against the platform's CA bundle and
      # the certificate's name. Empty values leave TLS off; there is no insecure option to set.
      CERBERUS_CH_TLS_ENABLED: '{{ if include "common.clickhouseTLS" . }}true{{ else }}false{{ end }}'
      CERBERUS_CH_TLS_CA_FILE: '{{ if include "common.clickhouseTLS" . }}{{ include "common.clickhouseCA" . }}{{ end }}'
      CERBERUS_CH_TLS_SERVER_NAME: '{{ if include "common.clickhouseTLS" . }}{{ .Values.global.clickhouse.tls.serverName }}{{ end }}'
      CERBERUS_OTLP_METRICS_ENABLED: "true"
      CERBERUS_OTLP_LOGS_ENABLED: "true"
      CERBERUS_OTLP_TRACES_ENABLED: "true"
      # The clickhouse node's schema Job creates the tables; otel_reader may only SELECT.
      CERBERUS_AUTO_CREATE_SCHEMA: "false"
      CERBERUS_AUTO_CREATE_DATABASE: "false"
      CERBERUS_ADMIT_PROM: "true"
      CERBERUS_ADMIT_LOKI: "true"
      CERBERUS_ADMIT_TEMPO: "true"
      CERBERUS_ADMIT_TAIL: "true"
      CERBERUS_ADMIT_DISABLED: "false"
      CERBERUS_CH_OPTIMIZATIONS: auto
      CERBERUS_QUERY_MAX_SAMPLES: "5000000"
      CERBERUS_HTTP_ADDR: ":8080"
      CERBERUS_LOG_LEVEL: info
      CERBERUS_LOG_FORMAT: json
      # Grafana's metric and label pickers ask Cerberus without a time range, and Cerberus then looks back this
      # far: the metrics retention, from the same global.retention ClickHouse's TTLs use, so they stay aligned.
      CERBERUS_PROM_METADATA_LOOKBACK: '{{ include "common.retentionDays" (list . "metrics") }}d'

service:
  ports:
    http:
      port: 8080
      targetPort: http
      appProtocol: http

deployment:
  podSecurityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsUser: 65532
  containers:
    cerberus:
      image:
        repository: ghcr.io/tsouza/cerberus
        tag: "1.22.0"
      ports:
        http:
          containerPort: 8080
      env:
        # 80% of the memory limit, so Go collects before the kernel kills it.
        GOMEMLIMIT: 1717986918B
      secretEnv:
        CERBERUS_CH_PASSWORD:
          secret: clickhouse-reader
          key: password
          vault:
            file: /etc/cerberus/cerberus.yaml
            yamlKey: clickhouse.password
      # The external ClickHouse's CA bundle, at CERBERUS_CH_TLS_CA_FILE (global.clickhouse.external only).
      clickhouseCA: true
      envFrom:
        - configMapRef:
            name: '{{ include "common.fullname" . }}-env'
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 10
      readinessProbe:
        httpGet:
          path: /readyz
          port: http
        initialDelaySeconds: 2
        periodSeconds: 3
        failureThreshold: 5
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 2Gi
  # Two, so a rollout or a lost node never leaves Grafana without a query path.
  replicas: 2

# With global.networkPolicy.enabled: only Grafana queries Cerberus, and the collector scrapes its metrics;
# Cerberus reaches only ClickHouse.
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [grafana, otel-collector]
      ports:
        - port: 8080
          protocol: TCP
  # ClickHouse: the operator's pods, or with global.clickhouse.external the service owner's endpoint.
  egress: |-
    {{- include "common.clickhouseEgress" (list . (ternary (list 8123) (list 9000 8123) (include "common.clickhouseTLS" . | eq "true"))) }}

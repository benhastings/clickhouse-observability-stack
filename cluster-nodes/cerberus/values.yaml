# yaml-language-server: $schema=values.schema.json
configMaps:
  env:
    data:
      CERBERUS_CH_ADDR: '{{ include "common.serviceAddress" (list $ "clickhouse") }}'
      CERBERUS_CH_DATABASE: otel
      CERBERUS_CH_USERNAME: otel_reader
      CERBERUS_CH_PROTOCOL: native
      CERBERUS_CH_DIAL_TIMEOUT: 10s
      # An external ClickHouse (global.clickhouse.external) over TLS, verified against the platform's CA bundle and
      # the certificate's name. Empty values leave TLS off; there is no insecure option to set.
      CERBERUS_CH_TLS_ENABLED: '{{ if include "common.clickhouseExternal" . }}true{{ else }}false{{ end }}'
      CERBERUS_CH_TLS_CA_FILE: '{{ if include "common.clickhouseExternal" . }}{{ include "common.clickhouseCA" . }}{{ end }}'
      CERBERUS_CH_TLS_SERVER_NAME: '{{ if include "common.clickhouseExternal" . }}{{ .Values.global.clickhouse.tls.serverName }}{{ end }}'
      CERBERUS_OTLP_METRICS_ENABLED: "true"
      CERBERUS_OTLP_LOGS_ENABLED: "true"
      CERBERUS_OTLP_TRACES_ENABLED: "true"
      # The clickhouse node's schema Job creates the tables; otel_reader may only SELECT.
      CERBERUS_AUTO_CREATE_SCHEMA: "false"
      CERBERUS_AUTO_CREATE_DATABASE: "false"
      CERBERUS_ADMIT_PROM: "true"
      CERBERUS_ADMIT_LOKI: "true"
      CERBERUS_ADMIT_TEMPO: "true"
      CERBERUS_ADMIT_TAIL: "true"
      CERBERUS_ADMIT_DISABLED: "false"
      CERBERUS_CH_OPTIMIZATIONS: auto
      CERBERUS_QUERY_MAX_SAMPLES: "5000000"
      CERBERUS_HTTP_ADDR: ":8080"
      CERBERUS_LOG_LEVEL: info
      CERBERUS_LOG_FORMAT: json

service:
  enabled: true
  ports:
    http:
      port: 8080
      targetPort: http
      appProtocol: http

deployment:
  enabled: true
  podSecurityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    cerberus:
      image:
        repository: ghcr.io/tsouza/cerberus
        tag: "1.22.0"
      ports:
        http:
          containerPort: 8080
      env:
        GOMEMLIMIT: 322122547B
      secretEnv:
        CERBERUS_CH_PASSWORD:
          secret: clickhouse-reader
          key: password
          vault:
            file: /etc/cerberus/cerberus.yaml
            yamlKey: clickhouse.password
      # The external ClickHouse's CA bundle, at CERBERUS_CH_TLS_CA_FILE (global.clickhouse.external only).
      clickhouseCA: true
      envFrom:
        - configMapRef:
            name: '{{ include "common.fullname" . }}-env'
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /readyz
          port: http
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 5
        failureThreshold: 5
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 384Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true

# With global.networkPolicy.enabled: only Grafana queries Cerberus, and the collector scrapes its metrics;
# Cerberus reaches only ClickHouse.
networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [grafana, otel-collector]
      ports:
        - port: 8080
          protocol: TCP
  # ClickHouse: the operator's pods, or with global.clickhouse.external the service owner's endpoint.
  egress: |-
    {{- include "common.clickhouseEgress" (list . (list 9000 8123)) }}

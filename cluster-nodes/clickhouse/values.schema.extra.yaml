# This node's own top-level keys; make generate merges them with helm-templates/common/schema/node.schema.yaml.
properties:
  clickhouse:
    type: object
    additionalProperties: false
    properties:
      shards: {type: integer, minimum: 1}
      replicas: {type: integer, minimum: 1}
      storage: {type: string}
      storageClassName: {type: string}
      image: {$ref: "#/definitions/image"}
      resources: {type: object}
      lowMemory: {type: boolean}
      analyst:
        type: object
        additionalProperties: false
        properties:
          maxMemoryUsage: {type: integer, minimum: 1}
          maxExecutionTime: {type: integer, minimum: 1}
          maxRowsToRead: {type: integer, minimum: 1}
          maxConcurrentQueries: {type: integer, minimum: 1}
          priority: {type: integer, minimum: 0}
          quota:
            type: object
            additionalProperties: false
            properties:
              queries: {type: integer, minimum: 0}
              readRows: {type: integer, minimum: 0}
              executionTime: {type: integer, minimum: 0}
      schema:
        type: object
        additionalProperties: false
        properties:
          ttlDays:
            type: object
            additionalProperties: false
            properties:
              logs: {type: integer, minimum: 1}
              metrics: {type: integer, minimum: 1}
              traces: {type: integer, minimum: 1}
          backoffLimit: {type: integer, minimum: 0}
          activeDeadlineSeconds: {type: integer, minimum: 1}
          resources: {type: object}
      baselines:
        type: object
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          weeks: {type: integer, minimum: 1, maximum: 52}
          signals:
            type: array
            items:
              enum: [requests_per_minute, error_ratio, latency_p95_ms, error_logs_per_minute]
      slo:
        type: object
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          windowDays: {type: integer, minimum: 1, maximum: 90}
          default: {$ref: "#/definitions/sloObjective"}
          services:
            type: object
            additionalProperties: {$ref: "#/definitions/sloObjective"}
      backup:
        type: object
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          schedule: {type: string}
          bucket: {type: string}
          path: {type: string}
          endpoint: {type: string}
          region: {type: string}
          forcePathStyle: {type: boolean}
          keep: {type: integer, minimum: 0}
          image: {$ref: "#/definitions/image"}
          resources: {type: object}
definitions:
  sloObjective:
    type: object
    additionalProperties: false
    properties:
      availability: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
      latency:
        type: object
        additionalProperties: false
        properties:
          thresholdMs: {type: number, exclusiveMinimum: 0}
          objective: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}

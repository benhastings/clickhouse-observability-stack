serviceAccount:
  create: false

secrets:
  credentials:
    create: false
    stringData:
      username: otel

# The ClickHouseInstallation's size. files/installation.yaml.tpl renders the Installation from these keys,
# so an environment sets only the keys it changes. lowMemory: false drops the laptop tuning (the
# max_threads and max_memory_usage profiles and config.d/low_memory.xml). An empty storageClassName
# uses the cluster's default StorageClass.
clickhouse:
  shards: 1
  replicas: 1
  storage: 2Gi
  storageClassName: ""
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.9.5.2"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  lowMemory: true

# The Installation is a Go template in files/ because a map in values can't leave out a key, and
# lowMemory and storageClassName need to. The leading "---" keeps this string unquoted through
# toYaml, so common's tpl renders it as YAML. To set something the clickhouse keys don't cover, set
# objects.installation to a whole ClickHouseInstallation map; it replaces the rendered one.
objects:
  installation: '--{{ "-" }}{{ tpl (.Files.Get "files/installation.yaml.tpl") . }}'

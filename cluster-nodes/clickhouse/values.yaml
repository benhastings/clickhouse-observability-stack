# yaml-language-server: $schema=values.schema.json
serviceAccount:
  create: false

# One ClickHouse user per job, each with its own Secret (keys username and password), so a leaked password
# reaches only what that user may do. files/installation.yaml.tpl defines the users and their grants:
#   clickhouse-admin   otel_admin, every privilege; only the schema Job and the backup CronJob use it
#   clickhouse-writer  otel_writer, INSERT on otel.*; the collector
#   clickhouse-reader  otel_reader, SELECT on otel.*; Cerberus
#   clickhouse-analyst otel_analyst, SELECT on otel.*, otel_baseline.*, otel_features.*, otel_slo.*, INSERT on otel_ml.*;
#                      notebooks and jobs, under clickhouse.analyst's limits
#   clickhouse-garmr   otel_garmr, with clickhouse.garmr: SELECT, INSERT, ALTER UPDATE and ALTER DELETE on
#                      garmr.*, SELECT on otel.*, otel_features.*, otel_baseline.*; garmr serve
# With global.externalSecrets.enabled, each is synced from <remotePath>/<its name>.
secrets:
  admin:
    create: false
    stringData:
      username: otel_admin
    external:
      keys: [username, password]
  writer:
    create: false
    stringData:
      username: otel_writer
    external:
      keys: [username, password]
  reader:
    create: false
    stringData:
      username: otel_reader
    external:
      keys: [username, password]
  analyst:
    create: false
    stringData:
      username: otel_analyst
    external:
      keys: [username, password]
  garmr:
    create: false
    stringData:
      username: otel_garmr
    external:
      keys: [username, password]
  # The backup CronJob's S3 credentials, keys access_key and secret_key. Never created here: an environment
  # that turns on clickhouse.backup pre-creates clickhouse-backup or sets create: true with its own stringData.
  backup:
    create: false

# The ClickHouseInstallation's size. files/installation.yaml.tpl renders the Installation from these keys,
# so an environment sets only the keys it changes. lowMemory: false drops the laptop tuning (the
# max_threads and max_memory_usage profiles and config.d/low_memory.xml). An empty storageClassName
# uses the cluster's default StorageClass.
clickhouse:
  shards: 1
  replicas: 1
  storage: 2Gi
  storageClassName: ""
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.9.5.2"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # ClickHouse checks its memory cap (90% of this, files/installation.yaml.tpl) against its resident memory,
    # which carries about 460 MiB of its own binary and what jemalloc keeps resident. 1 Gi left too little
    # room after a few hours of uptime (#206); the cgroup itself stays near 460 MiB.
    # Plus 128 MiB for the embedded Keeper (clickhouse.keeper), which counts against the same cap.
    limits:
      memory: 1664Mi
  lowMemory: true
  # otel_analyst's settings profile and hourly quota, so a notebook can't starve ingestion or Grafana. Each
  # limit is also a constraint: the analyst may lower it for a session but not raise it. priority runs its
  # queries after everyone else's (the other users are at 0, and a higher number runs later).
  analyst:
    maxMemoryUsage: 268435456
    maxExecutionTime: 60
    maxRowsToRead: 200000000
    maxConcurrentQueries: 2
    priority: 10
    quota:
      queries: 600
      readRows: 2000000000
      executionTime: 1800
  # The otel database's tables are files/schema.sql.tpl, applied as otel_admin by a Job that runs whenever
  # the rendered SQL changes. ttlDays is the retention per signal, in days. The Job connects to one server
  # through the clickhouse Service, so with more than one shard or replica the tables exist on one of them:
  # see "Before using this beyond a laptop" in the README.
  schema:
    ttlDays:
      logs: 7
      metrics: 7
      traces: 7
    backoffLimit: 3
    activeDeadlineSeconds: 900
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # A Keeper inside the ClickHouse server, for KeeperMap tables. One server only: more shards or replicas fail the
  # render, and need a ClickHouseKeeperInstallation.
  keeper:
    embedded: true
  # garmr's tables (files/garmr.sql, the garmr node's schema) and its user otel_garmr. Needs keeper.
  garmr:
    enabled: true
  # Anomaly baselines, computed by refreshable views in the otel_baseline database (see files/schema.sql.tpl):
  # the hour-of-week median and MAD of each signal per service over the last weeks, written back as
  # baseline:<signal>:median, :mad and :samples gauge series. signals is the allowlist of what gets one.
  baselines:
    enabled: true
    weeks: 4
    signals:
      - requests_per_minute
      - error_ratio
      - latency_p95_ms
      - error_logs_per_minute
  # Service level objectives, computed by ClickHouse in the otel_slo database (see files/schema.sql.tpl) from
  # each service's server spans: availability is the share not in error, latency the share no slower than
  # latency.thresholdMs. default applies to every service, and services.<name> overrides any of its keys:
  #
  #   services:
  #     checkout: {availability: 0.999, latency: {thresholdMs: 300}}
  #
  # windowDays is the window the error budget is measured over.
  slo:
    enabled: true
    windowDays: 28
    default:
      availability: 0.95
      latency:
        thresholdMs: 1000
        objective: 0.95
    services: {}
  # An optional nightly clickhouse-backup run against the otel cluster, uploading to S3-compatible storage.
  # It uses ClickHouse's own BACKUP ... TO S3 (embedded mode with no backup disk), so the job needs only the
  # clickhouse:9000 Service, not the data volume. keep is how many remote backups to retain; older ones are
  # deleted after each upload. common renders a stray document for an objects entry whose template is
  # empty, so turning this on takes two keys in the environment's applications.clickhouse.values:
  #
  #   clickhouse:
  #     backup:
  #       enabled: true
  #       bucket: <bucket>
  #       endpoint: https://<s3-endpoint>
  #   objects:
  #     backup: '--{{ "-" }}{{ tpl (.Files.Get "files/backup.yaml.tpl") . }}'
  #
  # and a clickhouse-backup Secret with access_key and secret_key (see secrets.backup).
  #
  # Restore is manual. List the remote backups, then restore one by name; each runs a one-off Job from the
  # CronJob, so it uses the same bucket, path and credentials (<backup-name> is a placeholder):
  #
  #   kubectl -n observability create job clickhouse-backup-list --from=cronjob/clickhouse-backup \
  #     --dry-run=client -o json | jq '.spec.template.spec.containers[0].args = ["list", "remote"]' \
  #     | kubectl create -f -
  #   kubectl -n observability logs job/clickhouse-backup-list
  #   kubectl -n observability create job clickhouse-restore --from=cronjob/clickhouse-backup \
  #     --dry-run=client -o json \
  #     | jq '.spec.template.spec.containers[0].args = ["restore_remote", "--rm", "<backup-name>"]' \
  #     | kubectl create -f -
  backup:
    enabled: false
    schedule: "0 3 * * *"
    bucket: ""
    path: otel
    endpoint: ""
    region: us-east-1
    forcePathStyle: true
    keep: 7
    image:
      repository: altinity/clickhouse-backup
      tag: "2.8.1"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

# The Installation is a Go template in files/ because a map in values can't leave out a key, and
# lowMemory and storageClassName need to. The leading "---" keeps this string unquoted through
# toYaml, so common's tpl renders it as YAML. To set something the clickhouse keys don't cover, set
# objects.installation to a whole ClickHouseInstallation map; it replaces the rendered one.
objects:
  installation: '--{{ "-" }}{{ tpl (.Files.Get "files/installation.yaml.tpl") . }}'
  schema: '--{{ "-" }}{{ tpl (.Files.Get "files/schema-job.yaml.tpl") . }}'

# The SQL the schema Job applies, rendered with the TTLs.
configMaps:
  schema:
    data:
      schema.sql: '{{ tpl (.Files.Get "files/schema.sql.tpl") . }}'

# With global.networkPolicy.enabled: a policy for the ClickHouse pods the operator creates, selected by the
# operator's own label. The collector, Cerberus, garmr sql-adapter, garmr serve, the schema Job and the backup job reach the native and HTTP ports, the
# operator reaches them from its namespace (global.networkPolicy.namespaces.operator, its pods selected by
# global.clickhouseOperator.podLabels, which a shared operator may label differently), the collector scrapes the
# Prometheus port, and replicas reach each other on the interserver port.
networkPolicy:
  podSelector:
    matchLabels:
      clickhouse.altinity.com/chi: otel
  ingress: |-
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [otel-collector, otel-collector-agent, cerberus, garmr-sql-adapter, garmr, clickhouse-schema, clickhouse-backup]
      ports:
        - port: 9000
          protocol: TCP
        - port: 8123
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ dig "global" "networkPolicy" "namespaces" "operator" "clickhouse-operator" .Values.AsMap }}
          podSelector:
            matchLabels:
              {{- dig "global" "clickhouseOperator" "podLabels" (dict "app.kubernetes.io/name" "clickhouse-operator") .Values.AsMap | toYaml | nindent 10 }}
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: otel
      ports:
        - port: 9009
          protocol: TCP
  egress: |-
    - to:
        - podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: otel
      ports:
        - port: 9000
          protocol: TCP
        - port: 9009
          protocol: TCP
    {{- if .Values.clickhouse.backup.enabled }}
    # BACKUP ... TO S3 runs inside ClickHouse.
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}

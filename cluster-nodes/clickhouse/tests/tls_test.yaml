suite: clickhouse standalone, TLS only
release:
  name: clickhouse
  namespace: observability
set: &standalone
  global.clickhouse.standalone: true
  global.clickhouse.tls.serverName: clickhouse.observability.svc
  global.clickhouse.tls.caConfigMap: platform-ca
  global.clickhouse.tls.serverSecret: clickhouse-tls
  global.services.clickhouse: clickhouse:9440
tests:
  - it: listens for the native protocol only on 9440 and HTTP only on 8443, with every plaintext listener but Prometheus removed
    template: templates/objects.yaml
    documentSelector:
      path: metadata.name
      value: clickhouse-server
    asserts:
      - matchRegex:
          path: data["listen.xml"]
          pattern: <tcp_port_secure>9440</tcp_port_secure>
      - matchRegex:
          path: data["listen.xml"]
          pattern: <https_port>8443</https_port>
      - matchRegex:
          path: data["listen.xml"]
          pattern: <tcp_port remove="1"/>\s*<http_port remove="1"/>\s*<mysql_port remove="1"/>\s*<postgresql_port remove="1"/>\s*<interserver_http_port remove="1"/>
      - notMatchRegex:
          path: data["listen.xml"]
          pattern: <(tcp_port|http_port)>
      - matchRegex:
          path: data["listen.xml"]
          pattern: <certificateFile>/etc/clickhouse-server/tls/tls.crt</certificateFile>\s*<privateKeyFile>/etc/clickhouse-server/tls/tls.key</privateKeyFile>

  - it: serves the certificate from the platform's kubernetes.io/tls Secret, and no plaintext container port but 9363
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: tcp-https
              containerPort: 8443
              protocol: TCP
            - name: tcp-native
              containerPort: 9440
              protocol: TCP
            - name: http-metrics
              containerPort: 9363
              protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls
            mountPath: /etc/clickhouse-server/tls
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: clickhouse-tls
              defaultMode: 0440
              items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: admits clients only on 9440, Cerberus on 8443 and the collector on 9363, with no plaintext native or HTTP port
    set:
      global.networkPolicy.enabled: true
      global.mesh: kubernetes
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: clickhouse
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: [otel-collector, otel-collector-agent, cerberus, garmr-sql-adapter, garmr, grafana, clickhouse-schema, clickhouse-backup]
              ports:
                - port: 9440
                  protocol: TCP
            # Cerberus speaks HTTPS: v1.22 can't dial native TLS (README: A standalone ClickHouse).
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: cerberus
              ports:
                - port: 8443
                  protocol: TCP
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: otel-collector
              ports:
                - port: 9363
                  protocol: TCP

  - it: applies the schema over verified TLS on 9440
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PORT
            value: "9440"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_TLS_SERVER_NAME
            value: clickhouse.observability.svc
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: --secure --tls-sni-override
      - contains:
          path: spec.template.spec.volumes
          content:
            name: clickhouse-ca
            configMap:
              name: platform-ca

  - it: backs up over verified TLS, dialling the certificate's name on 9440
    set:
      clickhouse.backup.enabled: true
      clickhouse.backup.bucket: backups
      objects.backup: '--{{ "-" }}{{ tpl (.Files.Get "files/backup.yaml.tpl") . }}'
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: clickhouse.observability.svc
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PORT
            value: "9440"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_SECURE
            value: "true"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_SKIP_VERIFY
            value: "false"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_TLS_CA
            value: /etc/clickhouse-ca/ca.crt
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: clickhouse-ca
            configMap:
              name: platform-ca

  - it: fails without the server's certificate Secret
    set:
      global.clickhouse.tls.serverSecret: ""
    template: templates/objects.yaml
    asserts:
      - failedTemplate:
          errorPattern: global.clickhouse.tls.serverSecret is empty

  - it: fails when clients would dial the plaintext native port
    set:
      global.services.clickhouse: clickhouse:9000
    template: templates/objects.yaml
    asserts:
      - failedTemplate:
          errorPattern: a standalone ClickHouse serves the native protocol only over TLS, on 9440

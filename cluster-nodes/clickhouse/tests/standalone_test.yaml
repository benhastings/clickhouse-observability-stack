suite: clickhouse standalone
release:
  name: clickhouse
  namespace: observability
set:
  global.clickhouse.standalone: true
  global.clickhouse.tls.serverName: clickhouse
  global.clickhouse.tls.caConfigMap: platform-ca
  global.clickhouse.tls.serverSecret: clickhouse-tls
  global.services.clickhouse: clickhouse:9440
tests:
  - it: renders no ClickHouseInstallation and nothing cluster-scoped, only namespaced objects
    template: templates/objects.yaml
    asserts:
      - containsDocument:
          kind: ClickHouseInstallation
          apiVersion: clickhouse.altinity.com/v1
        not: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: clickhouse
          namespace: observability
          any: true
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: clickhouse
          namespace: observability
          any: true
      - containsDocument:
          kind: PersistentVolumeClaim
          apiVersion: v1
          name: clickhouse-data
          namespace: observability
          any: true
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: clickhouse-server
          namespace: observability
          any: true

  - it: still renders the ClickHouseInstallation and no Deployment without standalone
    set:
      global.clickhouse.standalone: false
    template: templates/objects.yaml
    asserts:
      - containsDocument:
          kind: ClickHouseInstallation
          apiVersion: clickhouse.altinity.com/v1
          any: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
        not: true
      - containsDocument:
          kind: PersistentVolumeClaim
          apiVersion: v1
        not: true

  - it: runs one server with Recreate, since its volume is ReadWriteOnce
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy
          value:
            type: Recreate
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: clickhouse
      - equal:
          path: spec.template.spec.volumes[?(@.name == "data")].persistentVolumeClaim.claimName
          value: clickhouse-data
      - equal:
          path: spec.template.spec.containers[0].image
          value: clickhouse/clickhouse-server:26.9.5.2

  - it: waits for the server with startup and readiness probes on /ping, over HTTPS
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet
          value:
            path: /ping
            port: tcp-https
            scheme: HTTPS
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /ping
            port: tcp-https
            scheme: HTTPS

  - it: runs as the clickhouse user with a read-only root filesystem and no service account token
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 101
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 101
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: keeps the data volume on prune, on deleting the Application and on helm uninstall
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
            helm.sh/resource-policy: keep
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]
      - equal:
          path: spec.resources.requests.storage
          value: 320Gi
      - notExists:
          path: spec.storageClassName

  - it: serves only clickhouse:9440 and :8443, over TLS, named tcp-* so Istio treats them as opaque TCP
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: tcp-https
              port: 8443
              targetPort: tcp-https
              protocol: TCP
            - name: tcp-native
              port: 9440
              targetPort: tcp-native
              protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: clickhouse

  - it: reads each user's password from its own Secret into the environment, never into the config
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD_OTEL_WRITER
            valueFrom:
              secretKeyRef:
                name: clickhouse-writer
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD_OTEL_ADMIN
            valueFrom:
              secretKeyRef:
                name: clickhouse-admin
                key: password
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 5

  - it: defines the users, grants, profiles and quotas in server config, with passwords from the environment
    template: templates/objects.yaml
    documentSelector:
      path: metadata.name
      value: clickhouse-server
    asserts:
      - matchRegex:
          path: data["users.xml"]
          pattern: '<otel_writer>\s*<password from_env="CLICKHOUSE_PASSWORD_OTEL_WRITER"/>'
      - matchRegex:
          path: data["users.xml"]
          pattern: '<otel_writer>(.|\n)*<query>GRANT INSERT ON otel\.\*</query>\s*</grants>\s*</otel_writer>'
      - matchRegex:
          path: data["users.xml"]
          pattern: '<otel_analyst>(.|\n)*<profile>analyst</profile>\s*<quota>analyst</quota>'
      - matchRegex:
          path: data["users.xml"]
          pattern: '<otel_garmr>(.|\n)*<query>GRANT SELECT, INSERT, ALTER UPDATE, ALTER DELETE ON garmr\.\*</query>'
      - matchRegex:
          path: data["users.xml"]
          pattern: '<otel_admin>\s*<password from_env="CLICKHOUSE_PASSWORD_OTEL_ADMIN"/>\s*<networks>\s*<ip>0\.0\.0\.0/0</ip>\s*<ip>::/0</ip>\s*</networks>\s*<profile>default</profile>\s*<quota>default</quota>\s*</otel_admin>'
      - matchRegex:
          path: data["users.xml"]
          pattern: '<max_memory_usage>\s*<max>2147483648</max>\s*</max_memory_usage>'
      - matchRegex:
          path: data["users.xml"]
          pattern: '<priority>\s*<min>10</min>\s*</priority>'
      - matchRegex:
          path: data["users.xml"]
          pattern: '<read_rows>100000000000</read_rows>'

  - it: answers the image's default user, which has no password, only on localhost
    template: templates/objects.yaml
    documentSelector:
      path: metadata.name
      value: clickhouse-server
    asserts:
      - matchRegex:
          path: data["users.xml"]
          pattern: '<default>\s*<networks replace="replace">\s*<ip>::1</ip>\s*<ip>127\.0\.0\.1</ip>\s*</networks>\s*</default>'

  - it: shares the Prometheus, Keeper and laptop config files with the ClickHouseInstallation
    set:
      clickhouse.lowMemory: true
    template: templates/objects.yaml
    documentSelector:
      path: metadata.name
      value: clickhouse-server
    asserts:
      - matchRegex:
          path: data["prometheus.xml"]
          pattern: '<port>9363</port>'
      - matchRegex:
          path: data["keeper.xml"]
          pattern: '<keeper_map_path_prefix>/keeper_map_tables</keeper_map_path_prefix>'
      - matchRegex:
          path: data["low_memory.xml"]
          pattern: '<max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>'
      - matchRegex:
          path: data["listen.xml"]
          pattern: '<tcp_port_secure>9440</tcp_port_secure>'
      - matchRegex:
          path: data["users.xml"]
          pattern: '<default>\s*<max_memory_usage>536870912</max_memory_usage>\s*<max_threads>2</max_threads>\s*</default>'

  - it: rolls the server when its configuration changes
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: '^[0-9a-f]{64}$'

  - it: applies the schema to the Deployment through the clickhouse Service, as on the other paths
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: clickhouse
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PORT
            value: "9440"

  - it: backs the standalone server up with the same CronJob, through the clickhouse Service
    set:
      clickhouse.backup.enabled: true
      clickhouse.backup.bucket: example-bucket
      objects.backup: '--{{ "-" }}{{ tpl (.Files.Get "files/backup.yaml.tpl") . }}'
    template: templates/objects.yaml
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: clickhouse

  - it: selects the Deployment's pods, and drops the operator and interserver rules, when network policies are on
    set:
      global.networkPolicy.enabled: true
      global.mesh: kubernetes
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      - lengthEqual:
          path: spec.ingress
          count: 3
      - notMatchRegex:
          path: spec.ingress[0].from[0].podSelector.matchExpressions[0].key
          pattern: clickhouse.altinity.com

  - it: refuses more than one server
    set:
      clickhouse.replicas: 2
      clickhouse.keeper.embedded: false
      clickhouse.garmr.enabled: false
    template: templates/objects.yaml
    asserts:
      - failedTemplate:
          errorPattern: global.clickhouse.standalone runs one server

  - it: refuses vault.enabled, as with the operator, because the server reads passwords only from Secrets
    set:
      global.vault.enabled: true
    template: templates/objects.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'vault.enabled is true, but the ClickHouse server reads its users'' passwords only from the Kubernetes Secrets'

suite: clickhouse
release:
  name: clickhouse
  namespace: observability
tests:
  - it: keeps the installation named otel so its Service and pods keep their names
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: metadata.name
          value: otel
      - equal:
          path: metadata.namespace
          value: observability
      - equal:
          path: spec.templates.serviceTemplates[0].generateName
          value: clickhouse

  - it: gives the collector an insert-only user and Cerberus and vmalert's adapter a read-only one, each with its own Secret
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.configuration.users["otel_writer/grants/query"]
          value: [GRANT INSERT ON otel.*]
      - equal:
          path: spec.configuration.users["otel_reader/grants/query"]
          value: [GRANT SELECT ON otel.*, GRANT SELECT ON otel_baseline.*, GRANT SELECT ON otel_slo.*, GRANT SELECT ON system.view_refreshes, GRANT SELECT ON system.disks]
      - notExists:
          path: spec.configuration.users["otel_admin/grants/query"]
      - equal:
          path: spec.configuration.users["otel_admin/password"].valueFrom.secretKeyRef
          value:
            name: clickhouse-admin
            key: password
      - equal:
          path: spec.configuration.users["otel_writer/password"].valueFrom.secretKeyRef
          value:
            name: clickhouse-writer
            key: password
      - equal:
          path: spec.configuration.users["otel_reader/password"].valueFrom.secretKeyRef
          value:
            name: clickhouse-reader
            key: password
      - notExists:
          path: spec.configuration.users["otel/password"]

  - it: applies the schema as otel_admin from a Job named for the SQL it runs
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^clickhouse-schema-[0-9a-f]{8}$
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: clickhouse-schema
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_USER
            value: otel_admin
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-admin
                key: password
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: clickhouse-schema

  - it: renders the retention per signal into the schema
    set:
      clickhouse.schema.ttlDays.logs: 3
      clickhouse.schema.ttlDays.traces: 30
    documentSelector:
      path: metadata.name
      value: clickhouse-schema
    asserts:
      - matchRegex:
          path: data["schema.sql"]
          pattern: ALTER TABLE otel.otel_logs MODIFY TTL toDateTime\(Timestamp\) \+ toIntervalDay\(3\);
      - matchRegex:
          path: data["schema.sql"]
          pattern: ALTER TABLE otel.otel_traces MODIFY TTL toDateTime\(Timestamp\) \+ toIntervalDay\(30\);
      - matchRegex:
          path: data["schema.sql"]
          pattern: ALTER TABLE otel.otel_metrics_sum MODIFY TTL toDateTime\(TimeUnix\) \+ toIntervalDay\(7\);
      - matchRegex:
          path: data["schema.sql"]
          pattern: MODIFY SQL SECURITY DEFINER DEFINER = otel_admin;

  - it: computes anomaly baselines in otel_baseline as otel_admin, for the allowlisted signals only
    set:
      clickhouse.baselines.weeks: 6
      clickhouse.baselines.signals: [error_ratio, latency_p95_ms]
    documentSelector:
      path: metadata.name
      value: clickhouse-schema
    asserts:
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE MATERIALIZED VIEW IF NOT EXISTS otel_baseline.signal_1m_mv\\nREFRESH EVERY 1 MINUTE APPEND TO otel_baseline.signal_1m\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "WHERE Signal IN \\('error_ratio', 'latency_p95_ms'\\);"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE MATERIALIZED VIEW IF NOT EXISTS otel_baseline.baseline_mv\\nREFRESH EVERY 1 HOUR TO otel_baseline.baseline\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "WHERE Minute >= now\\(\\) - toIntervalWeek\\(6\\)"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "TTL Minute \\+ toIntervalWeek\\(7\\)"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "REFRESH EVERY 1 HOUR DEPENDS ON otel_baseline.baseline_mv APPEND TO otel.otel_metrics_gauge"

  - it: gives the anomaly rules parameterized views that run as otel_admin
    documentSelector:
      path: metadata.name
      value: clickhouse-schema
    asserts:
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE VIEW IF NOT EXISTS otel_baseline.current\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE VIEW IF NOT EXISTS otel_baseline.expected\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE VIEW IF NOT EXISTS otel_baseline.anomaly\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "if\\(s.Samples >= 120, 'hour_of_week', 'last_hour'\\) AS source"

  - it: creates no baseline objects when baselines are off
    set:
      clickhouse.baselines.enabled: false
    documentSelector:
      path: metadata.name
      value: clickhouse-schema
    asserts:
      - notMatchRegex:
          path: data["schema.sql"]
          pattern: otel_baseline

  - it: renders the SLO objectives from values, a service override merged over the default
    set:
      clickhouse.slo.windowDays: 30
      clickhouse.slo.default: {availability: 0.99, latency: {thresholdMs: 500, objective: 0.9}}
      clickhouse.slo.services:
        payments: {availability: 0.7}
        web: {latency: {thresholdMs: 250}}
    documentSelector:
      path: metadata.name
      value: clickhouse-schema
    asserts:
      - matchRegex:
          path: data["schema.sql"]
          pattern: "\\('', 0.99, 500, 0.9\\),\\n    \\('payments', 0.7, 500, 0.9\\),\\n    \\('web', 0.99, 250, 0.9\\)\\);"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE MATERIALIZED VIEW IF NOT EXISTS otel_slo.sli_1m_mv\\nREFRESH EVERY 1 MINUTE APPEND TO otel_slo.sli_1m\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE OR REPLACE VIEW otel_slo.sli\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "FROM otel_slo.sli\\(at = \\{at:DateTime64\\(3, 'UTC'\\)\\}, minutes = 43200\\);"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "ALTER TABLE otel_slo.sli_1m MODIFY TTL Minute \\+ toIntervalDay\\(37\\);"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "REFRESH EVERY 1 MINUTE DEPENDS ON otel_slo.sli_1m_mv APPEND TO otel.otel_metrics_gauge\\nDEFINER = otel_admin"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "UNION ALL SELECT '30d', \\* FROM otel_slo.sli\\(at = now\\(\\), minutes = 43200\\)"

  - it: builds the trace_summary and log_templates feature tables, each kept as long as its signal
    set:
      clickhouse.schema.ttlDays: {traces: 21, logs: 14, metrics: 30}
    documentSelector:
      path: metadata.name
      value: clickhouse-schema
    asserts:
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE DATABASE IF NOT EXISTS otel_features;"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "ALTER TABLE otel_features.trace_summary MODIFY TTL toDateTime\\(Start\\) \\+ toIntervalDay\\(21\\);"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "ALTER TABLE otel_features.log_templates MODIFY TTL Minute \\+ toIntervalDay\\(14\\);"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE MATERIALIZED VIEW IF NOT EXISTS otel_features.trace_summary_mv\\nREFRESH EVERY 1 MINUTE APPEND TO otel_features.trace_summary\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE MATERIALIZED VIEW IF NOT EXISTS otel_features.log_templates_mv\\nREFRESH EVERY 1 MINUTE APPEND TO otel_features.log_templates\\nDEFINER = otel_admin SQL SECURITY DEFINER"

  - it: publishes each score in otel_ml.scores as an ml:<model>:<signal> gauge series, kept as long as metrics
    set:
      clickhouse.schema.ttlDays: {traces: 21, logs: 14, metrics: 30}
    documentSelector:
      path: metadata.name
      value: clickhouse-schema
    asserts:
      - matchRegex:
          path: data["schema.sql"]
          pattern: "ALTER TABLE otel_ml.scores MODIFY TTL toDateTime\\(Time\\) \\+ toIntervalDay\\(30\\);"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "CREATE MATERIALIZED VIEW IF NOT EXISTS otel_ml.scores_series_mv TO otel.otel_metrics_gauge\\nDEFINER = otel_admin SQL SECURITY DEFINER"
      - matchRegex:
          path: data["schema.sql"]
          pattern: "'ml:' \\|\\| Model \\|\\| ':' \\|\\| Signal AS MetricName"

  - it: creates no SLO objects when SLOs are off
    set:
      clickhouse.slo.enabled: false
    documentSelector:
      path: metadata.name
      value: clickhouse-schema
    asserts:
      - notMatchRegex:
          path: data["schema.sql"]
          pattern: otel_slo

  - it: gives the schema Job a native Istio sidecar, so it can finish
    set:
      global.mesh: istio
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/nativeSidecar"]
          value: "true"

  - it: asks for no sidecar on the schema Job without Istio
    set:
      global.mesh: kubernetes
    documentSelector:
      path: kind
      value: Job
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: expects the credentials Secret to exist unless an environment creates it
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
        not: true

  - it: creates clickhouse-writer when an environment supplies it
    set:
      secrets.writer.create: true
      secrets.writer.stringData.password: example
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - equal:
          path: metadata.name
          value: clickhouse-writer
      - equal:
          path: stringData
          value:
            username: otel_writer
            password: example

  - it: renders the default installation as one shard of one replica with the low-memory tuning
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.configuration.clusters[0].layout
          value:
            shardsCount: 1
            replicasCount: 1
      - matchRegex:
          path: spec.configuration.files["config.d/low_memory.xml"]
          pattern: "<max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>\\n\\s+<memory_worker_dynamic_hard_limit>false</memory_worker_dynamic_hard_limit>"
      - equal:
          path: spec.configuration.profiles["default/max_threads"]
          value: 2
      - equal:
          path: spec.configuration.profiles["analyst/max_threads"]
          value: 2
      - notExists:
          path: spec.templates.volumeClaimTemplates[0].spec.storageClassName

  - it: serves Prometheus metrics, events, asynchronous metrics and errors on 9363
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - matchRegex:
          path: spec.configuration.files["config.d/prometheus.xml"]
          pattern: "<port>9363</port>\\n\\s+<metrics>true</metrics>\\n\\s+<events>true</events>\\n\\s+<asynchronous_metrics>true</asynchronous_metrics>\\n\\s+<errors>true</errors>"

  - it: lets the collector scrape the Prometheus port when network policies are on
    set:
      global.networkPolicy.enabled: true
    documentSelector:
      path: kind
      value: NetworkPolicy
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: otel-collector
            ports:
              - port: 9363
                protocol: TCP

  - it: sets replicasCount from clickhouse.replicas alone
    set:
      clickhouse.replicas: 3
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.configuration.clusters[0].layout.replicasCount
          value: 3
      - equal:
          path: spec.configuration.clusters[0].layout.shardsCount
          value: 1

  - it: drops the low-memory profiles and file when clickhouse.lowMemory is false
    set:
      clickhouse.lowMemory: false
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - notExists:
          path: spec.configuration.files["config.d/low_memory.xml"]
      - exists:
          path: spec.configuration.files["config.d/prometheus.xml"]
      - notExists:
          path: spec.configuration.profiles["default/max_memory_usage"]
      - notExists:
          path: spec.configuration.profiles["default/max_threads"]
      - equal:
          path: spec.configuration.profiles["analyst/max_memory_usage"]
          value: 268435456

  - it: gives notebooks and jobs an analyst user that reads the telemetry and writes only to otel_ml
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.configuration.users["otel_analyst/grants/query"]
          value: [GRANT SELECT ON otel.*, GRANT SELECT ON otel_baseline.*, GRANT SELECT ON otel_features.*, GRANT SELECT ON otel_slo.*, GRANT INSERT ON otel_ml.*]
      - equal:
          path: spec.configuration.users["otel_analyst/password"].valueFrom.secretKeyRef
          value:
            name: clickhouse-analyst
            key: password
      - equal:
          path: spec.configuration.users["otel_analyst/profile"]
          value: analyst
      - equal:
          path: spec.configuration.users["otel_analyst/quota"]
          value: analyst
      - equal:
          path: spec.configuration.users["otel_reader/profile"]
          value: default

  - it: caps the analyst's queries with limits it may lower but not raise, and runs them after everyone else's
    set:
      clickhouse.analyst.maxMemoryUsage: 2147483648
      clickhouse.analyst.quota.readRows: 100000000000
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - notExists:
          path: spec.configuration.profiles["analyst/profile"]
      - equal:
          path: spec.configuration.profiles["analyst/max_memory_usage"]
          value: 2147483648
      - equal:
          path: spec.configuration.profiles["analyst/constraints/max_memory_usage/max"]
          value: 2147483648
      - equal:
          path: spec.configuration.profiles["analyst/constraints/max_execution_time/max"]
          value: 60
      - equal:
          path: spec.configuration.profiles["analyst/constraints/max_rows_to_read/max"]
          value: 200000000
      - equal:
          path: spec.configuration.profiles["analyst/constraints/max_concurrent_queries_for_user/max"]
          value: 2
      - equal:
          path: spec.configuration.profiles["analyst/priority"]
          value: 10
      - equal:
          path: spec.configuration.profiles["analyst/constraints/priority/min"]
          value: 10
      - equal:
          path: spec.configuration.quotas
          value:
            analyst/interval/duration: 3600
            analyst/interval/queries: 600
            analyst/interval/read_rows: 100000000000
            analyst/interval/execution_time: 1800

  - it: never creates the analyst's Secret
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml

  - it: sizes the pod and volume from the clickhouse keys
    set:
      clickhouse.storage: 200Gi
      clickhouse.storageClassName: fast
      clickhouse.resources.limits.memory: 8Gi
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.templates.volumeClaimTemplates[0].spec.storageClassName
          value: fast
      - equal:
          path: spec.templates.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 200Gi
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0]
          value:
            name: clickhouse
            image: clickhouse/clickhouse-server:26.9.5.2
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 8Gi

  - it: renders no backup CronJob and no backup Secret by default
    asserts:
      - hasDocuments:
          count: 2
        template: templates/objects.yaml
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - containsDocument:
          kind: CronJob
          apiVersion: batch/v1
        not: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
        not: true

  - it: runs clickhouse-backup on a schedule when backup is enabled
    set:
      clickhouse.backup.enabled: true
      clickhouse.backup.bucket: example-bucket
      clickhouse.backup.schedule: "15 2 * * *"
      clickhouse.backup.keep: 3
      objects.backup: '--{{ "-" }}{{ tpl (.Files.Get "files/backup.yaml.tpl") . }}'
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: metadata.name
          value: clickhouse-backup
      - equal:
          path: spec.schedule
          value: "15 2 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: altinity/clickhouse-backup:2.8.1
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: ':[0-9]+\.[0-9]+\.[0-9]+$'
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: [create_remote]
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.cpu
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: clickhouse
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_BUCKET
            value: example-bucket
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: BACKUPS_TO_KEEP_REMOTE
            value: "3"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: clickhouse-backup
                key: secret_key
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickhouse-admin
                key: password

  - it: keeps the backup credentials out of the chart even when backup is enabled
    set:
      clickhouse.backup.enabled: true
      clickhouse.backup.bucket: example-bucket
      objects.backup: '--{{ "-" }}{{ tpl (.Files.Get "files/backup.yaml.tpl") . }}'
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
        not: true

  - it: refuses objects.backup without clickhouse.backup.enabled
    set:
      objects.backup: '--{{ "-" }}{{ tpl (.Files.Get "files/backup.yaml.tpl") . }}'
    asserts:
      - failedTemplate:
          errorPattern: clickhouse.backup.enabled is false

  - it: pulls the ClickHouse server through global.imageRegistry, with the global pull secrets
    set:
      global:
        imageRegistry: registry.example/mirror
        imagePullSecrets:
          - mirror-pull
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: registry.example/mirror/clickhouse/clickhouse-server:26.9.5.2
      - equal:
          path: spec.templates.podTemplates[0].spec.imagePullSecrets
          value:
            - name: mirror-pull

  - it: pulls the ClickHouse server image as written when no registry is set
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: clickhouse/clickhouse-server:26.9.5.2
      - notExists:
          path: spec.templates.podTemplates[0].spec.imagePullSecrets

  - it: materializes each user's Secret with External Secrets, and the installation still reads it by name
    set:
      global:
        externalSecrets:
          enabled: true
          secretStoreRef:
            name: vault-backend
    asserts:
      - hasDocuments:
          count: 4
        template: templates/externalsecret.yaml
      - equal:
          path: spec.target.name
          value: clickhouse-analyst
        documentSelector:
          path: metadata.name
          value: clickhouse-analyst
        template: templates/externalsecret.yaml
      - equal:
          path: spec.target.name
          value: clickhouse-writer
        documentSelector:
          path: metadata.name
          value: clickhouse-writer
        template: templates/externalsecret.yaml
      - equal:
          path: spec.data[0].secretKey
          value: username
        documentSelector:
          path: metadata.name
          value: clickhouse-writer
        template: templates/externalsecret.yaml
      - equal:
          path: spec.data[1].secretKey
          value: password
        documentSelector:
          path: metadata.name
          value: clickhouse-writer
        template: templates/externalsecret.yaml
      - equal:
          path: spec.configuration.users["otel_writer/password"].valueFrom.secretKeyRef
          value:
            name: clickhouse-writer
            key: password
        documentSelector:
          path: kind
          value: ClickHouseInstallation

  - it: selects the operator-created ClickHouse pods by the operator's label when network policies are on
    set:
      global:
        networkPolicy:
          enabled: true
    documentSelector:
      path: kind
      value: NetworkPolicy
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            clickhouse.altinity.com/chi: otel
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchExpressions[0].values
          value: [otel-collector, otel-collector-agent, cerberus, garmr-sql-adapter, clickhouse-schema, clickhouse-backup]

  - it: asks for the Istio sidecar on the operator-created ClickHouse pods when the mesh is istio
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].metadata.labels["sidecar.istio.io/inject"]
          value: "true"

  - it: leaves the ClickHouse pods alone when the mesh is kubernetes
    set:
      global:
        mesh: kubernetes
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - notExists:
          path: spec.templates.podTemplates[0].metadata

  - it: keeps the operator's HTTP port out of the ClickHouse sidecar under istio
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].metadata.annotations["traffic.sidecar.istio.io/excludeInboundPorts"]
          value: "8123"

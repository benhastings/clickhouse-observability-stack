# The anomaly rules in ../rules/anomaly.yaml, written in PromQL over the span metrics, as a reference: what each
# rule means, and something to compare the ClickHouse version with. vmalert doesn't load this file (its
# datasource speaks SQL); scripts/e2e.bash evaluates the recent error-ratio rule through Cerberus while the
# injected incident is under way and checks it agrees with ErrorRatioAnomaly.
#
# Two baselines, as in otel_baseline.expected:
#   recent    the hour before the last 5 minutes, sampled each minute: what a new service or a new install has
#   seasonal  the same hour last week, the classic rule; ClickHouse uses the hour-of-week over 4 weeks instead
# ErrorLogAnomaly has no PromQL form: logs are LogQL. PromQL has no median absolute deviation, so these use the mean and standard deviation; the ClickHouse rules use
# the median and MAD, which a past incident doesn't drag along.
groups:
  - name: anomaly-reference-recent
    rules:
      - alert: RequestRateAnomaly
        expr: |
          abs(
            sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[5m])) * 60
            - avg_over_time((sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[1m])) * 60)[1h:1m] offset 5m)
          )
          / clamp_min(stddev_over_time((sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[1m])) * 60)[1h:1m] offset 5m), 1)
          > 3
        for: 5m
      - alert: ErrorRatioAnomaly
        expr: |
          (
            sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
              / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[5m]))
            - avg_over_time((sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[1m]))
                / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[1m])))[1h:1m] offset 5m)
          )
          / clamp_min(stddev_over_time((sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[1m]))
              / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[1m])))[1h:1m] offset 5m), 0.02)
          > 3
          and sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
              / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[5m])) > 0.05
        for: 5m
      - alert: LatencyAnomaly
        expr: |
          (
            histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_bucket{span_kind="SPAN_KIND_SERVER"}[5m])))
            - avg_over_time(histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_bucket{span_kind="SPAN_KIND_SERVER"}[1m])))[1h:1m] offset 5m)
          )
          / clamp_min(stddev_over_time(histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_bucket{span_kind="SPAN_KIND_SERVER"}[1m])))[1h:1m] offset 5m), 1)
          > 3
        for: 5m
      - alert: TelemetryAbsent
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[1h] offset 5m)) > 0
          unless sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[5m])) > 0
        for: 5m

  - name: anomaly-reference-seasonal
    rules:
      - alert: ErrorRatioAnomaly
        expr: |
          (
            sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
              / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[5m]))
            - avg_over_time((sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
                / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[5m])))[1h:5m] offset 1w)
          )
          / clamp_min(stddev_over_time((sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
              / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[5m])))[1h:5m] offset 1w), 0.02)
          > 3
        for: 5m
      # The same against ClickHouse's hour-of-week baseline series, which is what the PromQL above approximates.
      - alert: ErrorRatioAnomalyFromBaselineSeries
        expr: |
          (
            sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
              / sum by (service_name) (rate(traces_span_metrics_calls{span_kind="SPAN_KIND_SERVER"}[5m]))
            - on (service_name) max by (service_name) (baseline:error_ratio:median)
          )
          / on (service_name) clamp_min(1.4826 * max by (service_name) (baseline:error_ratio:mad), 0.02)
          > 3
        for: 5m

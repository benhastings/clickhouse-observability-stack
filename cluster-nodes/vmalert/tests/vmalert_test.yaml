suite: vmalert
release:
  name: vmalert
  namespace: observability
tests:
  - it: evaluates rules through garmr-sql-adapter:8080 and sends to alertmanager:9093
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -datasource.url=http://garmr-sql-adapter:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: -notifier.url=http://alertmanager:9093

  - it: passes SQL through instead of parsing it as PromQL
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -rule.validateExpressions=false

  - it: loads every rule file from the vmalert-rules ConfigMap
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -rule=/etc/vmalert/rules/*.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: rules
            mountPath: /etc/vmalert/rules
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: rules
            configMap:
              name: vmalert-rules

  - it: ships the anomaly, SLO and stack rules as written, labelled with the keys Alertmanager routes on
    documentSelector:
      path: metadata.name
      value: vmalert-rules
    asserts:
      - matchRegex:
          path: data["anomaly.yaml"]
          pattern: "(?s)alert: RequestRateAnomaly.*alert: ErrorRatioAnomaly.*alert: LatencyAnomaly.*alert: ErrorLogAnomaly.*alert: TelemetryAbsent"
      - matchRegex:
          path: data["anomaly.yaml"]
          pattern: "FROM otel_baseline.anomaly\\(at = \\{time:DateTime64\\(3, 'UTC'\\)\\}\\)"
      - matchRegex:
          path: data["anomaly.yaml"]
          pattern: "\\{\\{ \\$labels.service_name \\}\\}"
      - matchRegex:
          path: data["stack.yaml"]
          pattern: "(?s)alert: Watchdog.*alert: AlertmanagerNotificationsFailing.*alert: BaselineRefreshFailing"
      - matchRegex:
          path: data["stack.yaml"]
          pattern: "(?s)alert: CollectorRefusingData.*alert: CollectorMemoryLimiterRefusing.*alert: CollectorMemoryNearLimit.*alert: CollectorExportFailing.*severity: critical.*alert: CollectorExportQueueFull.*alert: ClickHouseInsertsFailing.*alert: ClickHouseMemoryLimitRejects.*alert: ClickHouseTooManyParts"
      - matchRegex:
          path: data["stack.yaml"]
          pattern: "MetricName LIKE 'otelcol_receiver_refused_%'"
      - matchRegex:
          path: data["stack.yaml"]
          pattern: "w.working_set / l.memory_limit > 0.8"
      - matchRegex:
          path: data["slo.yaml"]
          pattern: "(?s)alert: AvailabilityBudgetBurn.*minutes = 60\\) AS l.*minutes = 5\\) AS s.*> 14.4.*severity: critical.*alert: LatencyBudgetBurn.*minutes = 4320\\) AS l.*minutes = 360\\) AS s.*severity: warning"
      - matchRegex:
          path: data["slo.yaml"]
          pattern: "slo: availability\\n +window: 6h"
      - matchRegex:
          path: data["slo.yaml"]
          pattern: "FROM otel_slo.budget\\(at = \\{time:DateTime64\\(3, 'UTC'\\)\\}\\) WHERE service_name = '%s'\" \\$labels.service_name"
      - notExists:
          path: data["anomaly-reference.yaml"]

  - it: follows global.services when the adapter or Alertmanager move
    set:
      global:
        services:
          sqlAdapter: http://garmr.alerting:8080
          alertmanager: http://alertmanager.alerting:9093
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -datasource.url=http://garmr.alerting:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: -notifier.url=http://alertmanager.alerting:9093

  - it: reaches only the adapter and Alertmanager when network policies are on
    set:
      global.networkPolicy.enabled: true
    template: templates/networkpolicy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: garmr-sql-adapter
            ports:
              - port: 8080
                protocol: TCP
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: alertmanager
            ports:
              - port: 9093
                protocol: TCP

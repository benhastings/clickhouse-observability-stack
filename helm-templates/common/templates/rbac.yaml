{{- $v := include "common.values" . | fromYaml -}}
{{- $name := include "common.fullname" . -}}
{{- if not (has $v.rbac.scope (list "cluster" "namespace")) }}
{{- fail (printf "rbac.scope must be cluster or namespace, not %v" $v.rbac.scope) }}
{{- end }}
{{- $namespaced := eq $v.rbac.scope "namespace" }}
{{- with and (not $namespaced) $v.rbac.clusterRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  {{- include "common.clusterMetadata" (list $ $name) | nindent 2 }}
rules:
  {{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- include "common.clusterMetadata" (list $ $name) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "common.serviceAccountName" $ }}
    namespace: {{ include "common.namespace" $ }}
{{- end }}
{{- $rules := $v.rbac.rules | default list }}
{{- if $namespaced }}
{{- $rules = concat $rules ($v.rbac.namespaceRules | default list) }}
{{- end }}
{{- with $rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- include "common.metadata" (list $ $name) | nindent 2 }}
rules:
  {{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- include "common.metadata" (list $ $name) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "common.serviceAccountName" $ }}
    namespace: {{ include "common.namespace" $ }}
{{- end }}

{{- $v := include "common.values" . | fromYaml -}}
{{- $np := $v.networkPolicy -}}
{{- if and $v.global.networkPolicy.enabled (ne $np.enabled false) }}
{{- $sidecar := include "common.istioSidecar" . }}
{{- $ambient := include "common.istioAmbient" . }}
{{- $ingress := include "common.networkPolicy.rules" (list . $np.ingress) }}
{{- $egress := include "common.networkPolicy.rules" (list . $np.egress) }}
{{- $hboneIn := "" }}
{{- $hboneOut := "" }}
{{- if $ambient }}
{{- $hboneIn = include "common.networkPolicy.hbone" (list . $ingress "from") }}
{{- $hboneOut = include "common.networkPolicy.hbone" (list . $egress "to") }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  {{- include "common.metadata" (list . (include "common.fullname" .)) | nindent 2 }}
spec:
  podSelector:
    {{- if kindIs "string" $np.podSelector }}
    {{- tpl $np.podSelector . | trim | nindent 4 }}
    {{- else if $np.podSelector }}
    {{- tpl (toYaml $np.podSelector) . | nindent 4 }}
    {{- else }}
    matchLabels:
      app.kubernetes.io/name: {{ include "common.fullname" . }}
    {{- end }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or $ingress $sidecar $ambient }}
  ingress:
    {{- with $ingress }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $hboneIn }}
    # Ambient: the same peers over HBONE, which ztunnel delivers on 15008.
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $ambient }}
    # Ambient: kubelet's health probes, which ztunnel rewrites to come from this link-local address.
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
    {{- end }}
    {{- if $sidecar }}
    # The sidecar's health and telemetry ports, which the mesh and kubelet reach.
    - ports:
        - port: 15020
          protocol: TCP
        - port: 15021
          protocol: TCP
        - port: 15090
          protocol: TCP
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if $sidecar }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $v.global.networkPolicy.istioNamespace }}
      ports:
        - port: 15012
          protocol: TCP
        - port: 15017
          protocol: TCP
    {{- end }}
    {{- with $egress }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with $hboneOut }}
    # Ambient: the same peers over HBONE, which ztunnel sends to on 15008.
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}

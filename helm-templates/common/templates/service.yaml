{{- $v := include "common.values" . | fromYaml -}}
{{- $s := $v.service -}}
{{- if include "common.serviceEnabled" . }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "common.metadata" (list . (include "common.fullname" .)) | nindent 2 }}
    {{- $waypoint := dig "istio" "waypoint" dict $v.global }}
    {{- if and (include "common.istioAmbient" .) $waypoint.name }}
    # Ambient: traffic to this Service goes through the platform's waypoint, for L7 policy.
    istio.io/use-waypoint: {{ $waypoint.name }}
    {{- with $waypoint.namespace }}
    istio.io/use-waypoint-namespace: {{ . }}
    {{- end }}
    {{- end }}
  {{- with $s.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $s.type }}
  selector:
    {{- include "common.selectorLabels" . | nindent 4 }}
  ports:
    {{- if not $s.ports }}
    {{- fail "service.enabled is true but service.ports is empty" }}
    {{- end }}
    {{- range $name, $port := $s.ports }}
    {{- if $port }}
    - name: {{ $name }}
      port: {{ $port.port }}
      targetPort: {{ $port.targetPort | default $name }}
      protocol: {{ $port.protocol | default "TCP" }}
      {{- with $port.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
    {{- end }}
{{- end }}

{{- $v := include "common.values" . | fromYaml -}}
{{- /* Sidecars only: under ambient, ztunnel uses mTLS for every connection on its own. */}}
{{- if and (include "common.serviceEnabled" .) (include "common.istioSidecar" .) }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  {{- include "common.metadata" (list . (include "common.fullname" .)) | nindent 2 }}
spec:
  host: {{ printf "%s.%s.svc.cluster.local" (include "common.fullname" .) (include "common.namespace" .) }}
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
{{- end }}

# Synthetic traffic from telemetrygen so the dashboards have data.
# checkout: fast, no errors. payments: slower, with ~25% errors (1 of every 4
# traces/sec comes from the error generator). Plus a trickle of logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-load
  namespace: observability
  labels: { app: demo-load }
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-load }
  template:
    metadata:
      labels: { app: demo-load }
    spec:
      containers:
        - name: checkout-ok
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - traces
            - --otlp-endpoint=otel-collector:4317
            - --otlp-insecure
            - --service=checkout
            - --rate=5
            - --duration=inf
            - --child-spans=2
            - --span-duration=40ms
            - --otlp-attributes=deployment.environment.name="local"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        - name: payments-ok
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - traces
            - --otlp-endpoint=otel-collector:4317
            - --otlp-insecure
            - --service=payments
            - --rate=3
            - --duration=inf
            - --span-duration=350ms
            - --otlp-attributes=deployment.environment.name="local"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        - name: payments-errors
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - traces
            - --otlp-endpoint=otel-collector:4317
            - --otlp-insecure
            - --service=payments
            - --rate=1
            - --duration=inf
            - --span-duration=900ms
            - --status-code=error
            - --otlp-attributes=deployment.environment.name="local"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        - name: logs
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
          args:
            - logs
            - --otlp-endpoint=otel-collector:4317
            - --otlp-insecure
            - --service=checkout
            - --rate=2
            - --duration=inf
            - --body=order placed
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }

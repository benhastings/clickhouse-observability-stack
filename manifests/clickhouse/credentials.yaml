# ClickHouse login used by Cerberus and the OTel Collector.
# LOCAL DEVELOPMENT ONLY: this repo is public, so this password is public too.
# For a real cluster, replace this with a secret from your secret manager
# (External Secrets, Sealed Secrets, ...) and delete this file.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: observability
type: Opaque
stringData:
  username: otel
  password: otel-local-dev

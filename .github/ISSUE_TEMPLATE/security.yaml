name: Security Issue
description: Non-critical security concerns suitable for the public tracker. For vulnerabilities, use a private security advisory instead.
title: "security: "
labels: ["security"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Is this a vulnerability?** If it could be exploited, please [file a private security advisory](https://github.com/benhastings/clickhouse-observability-stack/security/advisories/new) instead of a public issue. Do not post details publicly.

        The ClickHouse password and Grafana's admin/admin in `values-local.yaml` are deliberately public, local-only values — not a finding on their own.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (hardening / defense-in-depth)
        - Medium (exploitable under specific conditions)
        - High (use private advisory instead)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Secrets / credentials
        - RBAC / service accounts
        - Network exposure
        - Container images / supply chain
        - CI / workflows
        - Configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the concern? What could go wrong, and under what conditions?
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix or mitigation
      description: If you have a fix in mind, describe it here.
  - type: input
    id: revision
    attributes:
      label: Revision
      placeholder: "e.g. main @ 99e6a9f"

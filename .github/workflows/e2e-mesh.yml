# The Istio profile of the end-to-end test: kind with Istio, the local environment with global.mesh istio and
# Grafana and OTLP exposed through the ingress gateway, then the usual queries plus the mesh checks, the last
# of them with PeerAuthentication STRICT. It is heavier than the laptop e2e, so it runs on demand and on pull
# requests labelled `mesh`, not on every push.
name: End to end (Istio)
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: e2e-mesh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind-istio:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'mesh')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install tools
        run: |
          make setup/tools/go setup/tools/cluster
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Deploy this commit to kind with Istio and query the stack
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          make test/e2e MESH=istio REVISION="$REVISION"
      - name: Memory the kind node used
        if: always()
        run: |
          docker stats --no-stream --format '{{.Name}}: {{.MemUsage}}' || true
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true

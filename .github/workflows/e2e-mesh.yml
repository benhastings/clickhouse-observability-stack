# The Istio profile of the end-to-end test: kind with Istio, the local environment with global.mesh istio and
# Grafana and OTLP exposed through the ingress gateway, then the usual queries plus the mesh checks, the last
# of them with PeerAuthentication STRICT. It is heavier than the laptop e2e, so it runs on demand and on pull
# requests labelled `mesh`, not on every push.
name: End to end (Istio)
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: e2e-mesh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind-istio:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'mesh')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache tools
        id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/go/bin
            .venv
          # The tool versions are pinned in the Makefile, so it is the key.
          key: tools-e2e-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Install tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          make setup/tools/go setup/tools/cluster setup/tools/python
      - name: Install Node tools
        run: |
          make setup/tools/node
      - name: Put the tools on PATH
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Check's lint, here too, so a lint failure stops the run in seconds instead of after the deploy.
      - name: Lint
        run: |
          make check/lint
      - name: Deploy this commit to kind with Istio and query the stack
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          # The injected incident is the laptop e2e's to check; the mesh changes nothing about it.
          E2E_INCIDENT: "0"
        run: |
          make test/e2e MESH=istio REVISION="$REVISION"
      - name: Memory the kind node used
        if: always()
        run: |
          docker stats --no-stream --format '{{.Name}}: {{.MemUsage}}' || true
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true

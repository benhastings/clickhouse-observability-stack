name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache tools
        id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/go/bin
            .venv
          # The tool versions are pinned in the Makefile, so it is the key.
          key: tools-check-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Install tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          make setup/tools
      - name: Install Node tools
        if: steps.tools.outputs.cache-hit == 'true'
        run: |
          make setup/tools/node
      - name: Put the tools on PATH
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          make check/lint
      - name: Unit tests
        run: |
          make test
      - name: Values schemas are up to date and strict
        run: |
          make check/schema
      - name: Golden renders are up to date
        run: |
          make check/golden
      - name: Validate manifests
        run: |
          make check/manifests
      - name: No credentials in the golden renders
        run: |
          make check/credentials

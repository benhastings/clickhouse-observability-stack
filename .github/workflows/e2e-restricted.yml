# The restricted-namespace profiles of the end-to-end test: kind with Istio, a stand-in platform team
# (scripts/kind-platform.bash: the labelled namespace, the shared Gateway, and either the shared ClickHouse operator for
# restricted or, for standalone, a CA and ClickHouse's certificate made at runtime), then the environment through
# Argo CD and its smoke checks. Both run on demand and on pull requests labelled `restricted`.
name: End to end (restricted)
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: e2e-restricted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind-restricted:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'restricted')
    strategy:
      fail-fast: false
      matrix:
        env: [restricted, standalone]
    name: kind (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache tools
        id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/go/bin
            .venv
          # The tool versions are pinned in the Makefile, so it is the key.
          key: tools-e2e-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Install tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          make setup/tools/go setup/tools/cluster setup/tools/python
      - name: Install Node tools
        run: |
          make setup/tools/node
      - name: Put the tools on PATH
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Check's lint, here too, so a lint failure stops the run in seconds instead of after the deploy.
      - name: Lint
        run: |
          make check/lint
      - name: Deploy this commit to kind as the ${{ matrix.env }} profile and query the stack
        env:
          ENV: ${{ matrix.env }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          make test/e2e ENV="$ENV" REVISION="$REVISION"
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          kubectl -n observability logs deploy/cerberus --all-containers --tail=200 || true
          kubectl -n observability logs deploy/otel-collector --all-containers --tail=200 || true
          kubectl -n observability logs deploy/clickhouse -c clickhouse | grep -E 'Listen|TCPHandler|SSL|certificate|<Error>|<Warning>' | tail -100 || true
          kubectl -n observability exec deploy/clickhouse -c clickhouse -- cat /proc/net/tcp /proc/net/tcp6 | awk '$4 == "0A" {print $2}' || true
          kubectl -n observability get endpointslices -l kubernetes.io/service-name=clickhouse -o wide || true
          kubectl -n observability logs deploy/clickhouse --all-containers --tail=200 || true
          kubectl -n observability logs -l app.kubernetes.io/name=clickhouse-schema --all-containers --tail=200 || true
          kubectl -n clickhouse-operator logs deploy/clickhouse-operator --tail=200 || true

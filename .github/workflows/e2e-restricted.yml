# The restricted-namespace profile of the end-to-end test: kind with Istio, a stand-in platform team (the labelled
# namespace, the shared ClickHouse operator and the shared Gateway, scripts/kind-platform.bash), then the restricted
# environment through Argo CD and its smoke checks. It runs on demand and on pull requests labelled `restricted`.
name: End to end (restricted)
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: e2e-restricted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind-restricted:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'restricted')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install tools
        run: |
          make setup/tools/go setup/tools/cluster
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Deploy this commit to kind as the restricted profile and query the stack
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          make test/e2e ENV=restricted REVISION="$REVISION"
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          kubectl -n observability logs deploy/cerberus --all-containers --tail=200 || true
          kubectl -n observability logs deploy/otel-collector --all-containers --tail=200 || true
          kubectl -n clickhouse-operator logs deploy/clickhouse-operator --tail=200 || true

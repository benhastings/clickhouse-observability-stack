# Chart: grafana-community/grafana
fullnameOverride: grafana        # Service: grafana.observability:80

# LOCAL DEVELOPMENT ONLY: fixed admin login in a public repo.
adminUser: admin
adminPassword: admin

persistence:
  enabled: false                 # dashboards and datasources are provisioned from Git

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

# Loads dashboards from ConfigMaps labelled grafana_dashboard=1
# (see manifests/grafana-dashboards/).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

# All three datasources point at the same Cerberus Service, which answers the
# Prometheus, Loki and Tempo HTTP APIs from ClickHouse.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus (Cerberus)
        uid: cerberus-prometheus
        type: prometheus
        access: proxy
        url: http://cerberus:8080
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
          # Span-metric exemplars carry a trace ID; clicking one opens the trace.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: cerberus-tempo
      - name: Loki (Cerberus)
        uid: cerberus-loki
        type: loki
        access: proxy
        url: http://cerberus:8080
        editable: false
      - name: Tempo (Cerberus)
        uid: cerberus-tempo
        type: tempo
        access: proxy
        url: http://cerberus:8080
        editable: false
        jsonData:
          # Service Graph tab: reads the servicegraph connector's metrics.
          serviceMap:
            datasourceUid: cerberus-prometheus
          nodeGraph:
            enabled: true
          # From a span, jump to its service's span metrics...
          tracesToMetrics:
            datasourceUid: cerberus-prometheus
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - { key: service.name, value: service_name }
            queries:
              - name: Request rate
                query: sum(rate(traces_span_metrics_calls{$$__tags}[5m]))
              - name: p95 latency (ms)
                query: histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_bucket{$$__tags}[5m])))
          # ...or to the logs written during that trace.
          tracesToLogsV2:
            datasourceUid: cerberus-loki
            filterByTraceID: true
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"

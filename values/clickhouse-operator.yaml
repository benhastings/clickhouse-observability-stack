# Chart: altinity/altinity-clickhouse-operator
# CRDs come from the chart's crds/ directory, which Argo CD applies itself, so
# the chart's CRD-install hook job is turned off to avoid managing them twice.
crdHook:
  enabled: false

operator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# The operator's own Prometheus exporter sidecar isn't scraped by anything here.
metrics:
  enabled: false

# Chart: open-telemetry/opentelemetry-collector
fullnameOverride: otel-collector   # Service: otel-collector.observability:4317 (gRPC) / :4318 (HTTP)
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.161.0"      # newer than the chart's default appVersion (0.160.0)

extraEnvs:
  - name: CLICKHOUSE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: clickhouse-credentials
        key: password

# Only OTLP is received; turn off the chart's default Jaeger/Zipkin ports.
ports:
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }

config:
  receivers:
    # Remove the chart's default receivers we don't use.
    jaeger: null
    zipkin: null
    prometheus: null

  connectors:
    # RED metrics from spans: request count and a latency histogram per
    # service / span name / kind / status, plus the dimensions below.
    # Runs in the collector, so it counts every span, even ones a sampler
    # would later drop. Output metric names (via Cerberus / PromQL):
    #   traces_span_metrics_calls
    #   traces_span_metrics_duration_bucket / _sum / _count
    spanmetrics:
      histogram:
        unit: ms
        explicit:
          buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
      dimensions:
        - name: http.request.method
        - name: http.response.status_code
        - name: http.route
      exemplars:
        enabled: true           # links metric points back to example trace IDs
      metrics_flush_interval: 15s
    # Service-to-service request/latency metrics that power Grafana's Tempo
    # "Service Graph" view (traces_service_graph_request_total, ...).
    servicegraph:
      latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
      store:
        ttl: 5s
        max_items: 10000

  exporters:
    clickhouse:
      endpoint: tcp://clickhouse:9000?dial_timeout=10s
      database: otel
      username: otel
      password: ${env:CLICKHOUSE_PASSWORD}
      # Cerberus creates the tables (see values/cerberus.yaml). Retries cover
      # the short window at first install before those tables exist.
      create_schema: false
      timeout: 10s
      retry_on_failure:
        enabled: true
        max_elapsed_time: 5m
      sending_queue:
        enabled: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [clickhouse, spanmetrics, servicegraph]
      metrics:
        receivers: [otlp, spanmetrics, servicegraph]
        processors: [memory_limiter, batch]
        exporters: [clickhouse]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [clickhouse]
